<!DOCTYPE html>
<!--
  _template.html — Squelette canonique pour une nouvelle app pédagogique.

  UTILISATION :
    1. Copier ce fichier sous le nom de la nouvelle app (ex. apps/mon-activite.html).
    2. Remplacer tous les blocs marqués « TODO » ci-dessous.
    3. Ne pas modifier les classes/IDs marqués « NE PAS CHANGER » — ils correspondent
       aux conventions documentées dans CLAUDE.md.

  CHECKLIST avant livraison :
    [ ] <title> renseigné
    [ ] Emoji + titre dans le <h1>
    [ ] Niveaux définis dans .level-bar (au moins 2 boutons)
    [ ] playCorrect() + launchConfetti() appelés sur bonne réponse
    [ ] playIncorrect() appelé seul sur mauvaise réponse (pas de confettis)
    [ ] Bouton "Nouvel exercice" visible après chaque réponse
    [ ] Les compteurs repartent à zéro au changement de niveau
    [ ] Testé sur iPad (touch-action, min-height des boutons)
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TODO — Titre de l'activité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Styles partagés (reset, header, level-bar, feedback, boutons d'action…) -->
<link rel="stylesheet" href="app-base.css">
<style>
  /* ── TODO : styles spécifiques à l'app ──────────────────────────────────── */
  /*
    Ajouter ici uniquement les styles propres à cette activité (canvas, SVG,
    grilles de choix…). Ne pas redéfinir ce qui est déjà dans app-base.css.
    Exemple :
      .canvas-wrap { width: 100%; background: #fff; border: 1px solid var(--app-border); border-radius: 16px; }
  */
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>TODO 🎯 Titre de l'activité</h1>
  <div class="header-spacer"></div>
</header>

<!-- ── Sélecteur de niveau ─────────────────────────────────────────────────── -->
<!--
  Convention :
  - Premier bouton toujours class="level-btn active" aria-pressed="true"
  - Libellé : "Niveau 1" ou "Niveau 1 · description courte"
  - aria-pressed mis à jour dynamiquement par le JS
  - Supprimer ce bloc entier si l'app n'a qu'un seul niveau
-->
<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1</button>
  <button class="level-btn"        data-level="2" aria-pressed="false">Niveau 2</button>
  <!-- TODO : ajouter ou retirer des boutons selon le nombre de niveaux -->
</div>

<!-- ── Contenu principal ───────────────────────────────────────────────────── -->
<main>
  <div class="question-box" id="question-box">Chargement…</div>

  <!-- TODO : zone de contenu spécifique à l'app (canvas, SVG, grille de choix…) -->

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <!-- Supprimer .verify-btn si la réponse est immédiate (clic direct) -->
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn"    id="new-btn">Nouvel exercice</button>
  </div>
</main>

<!-- ── Script de l'app ─────────────────────────────────────────────────────── -->
<!-- appUtils.js expose : randInt, randBetween, shuffle, pick, colorForRank    -->
<script src="appUtils.js"></script>
<script>
  // ── Références DOM ─────────────────────────────────────────────────────────
  const questionBox = document.getElementById('question-box');
  const feedbackEl  = document.getElementById('feedback');
  const verifyBtn   = document.getElementById('verify-btn');
  const newBtn      = document.getElementById('new-btn');

  // ── État ────────────────────────────────────────────────────────────────────
  let currentLevel = 1;
  let state = {};

  // ── Feedback unifié ─────────────────────────────────────────────────────────
  // Appeler showFeedback() depuis le point de validation unique de l'app.
  // Ne jamais appeler playCorrect/playIncorrect/launchConfetti directement
  // depuis plusieurs endroits différents.
  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    newBtn.classList.add('visible');
    newBtn.focus();
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
  }

  function resetFeedback() {
    feedbackEl.className = 'feedback';
    newBtn.classList.remove('visible');
  }

  // ── Sélecteur de niveau ─────────────────────────────────────────────────────
  // NE PAS MODIFIER ce bloc — convention partagée entre toutes les apps.
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);
  // verifyBtn.addEventListener('click', verify); // TODO : décommenter et implémenter

  // ── Logique de l'app ────────────────────────────────────────────────────────
  // TODO : implémenter setupLevel1(), setupLevel2()… selon le nombre de niveaux.

  function setupLevel1() {
    resetFeedback();
    // TODO
    questionBox.textContent = 'TODO : question niveau 1';
    state = { answered: false };
  }

  function setupLevel2() {
    resetFeedback();
    // TODO
    questionBox.textContent = 'TODO : question niveau 2';
    state = { answered: false };
  }

  function newExercise() {
    if (currentLevel === 1) setupLevel1();
    else                    setupLevel2();
    // TODO : ajouter les autres niveaux si nécessaire
  }

  // ── Démarrage ───────────────────────────────────────────────────────────────
  newExercise();
</script>
<!-- feedbackUtils.js DOIT être chargé APRÈS le script de l'app, juste avant </body> -->
<script src="feedbackUtils.js"></script>
</body>
</html>

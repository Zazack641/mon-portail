<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Les surfaces — Comparer des aires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #C0272D;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    gap: 24px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  .question-box {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(17px, 3.5vw, 21px);
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.4;
  }

  .shapes-row {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(12px, 3vw, 32px);
    flex-wrap: wrap;
    width: 100%;
  }

  .shape-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    touch-action: manipulation;
    padding: 8px;
    border: 3px solid #E2E8F0;
    border-radius: 14px;
    background: #fff;
    transition: border-color 0.15s, background 0.15s;
  }
  .shape-item:hover { border-color: #3B7DD8; background: #EFF6FF; }
  .shape-item.selected { border-color: #3B7DD8; background: #DBEAFE; }
  .shape-item.correct  { border-color: #10B981; background: #D1FAE5; }
  .shape-item.wrong    { border-color: #EF4444; background: #FEE2E2; }
  .shape-label {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #64748B;
  }

  .feedback {
    width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 800;
    display: none;
  }
  .feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .verify-btn {
    padding: 16px 36px;
    background: #C0272D;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .verify-btn:hover { background: #A01F23; }
  .verify-btn:disabled { background: #94A3B8; cursor: default; }
  .new-btn {
    padding: 16px 36px;
    background: #0F7860;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: #0A5C48; }

  /* Grid hint for level 1 */
  .grid-note {
    font-size: 13px;
    color: #94A3B8;
    font-style: italic;
    text-align: center;
  }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>📐 Les surfaces</h1>
  <div class="header-spacer"></div>
</header>


<main>
  <div class="question-box" id="question-box">Chargement…</div>
  <div class="grid-note" id="grid-note"></div>
  <div class="shapes-row" id="shapes-row"></div>
  <div class="feedback" id="feedback"></div>
  <div class="action-row">
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<script>
  const COLORS = ['#3B7DD8', '#D64045', '#3A9E6F', '#3B7DD8'];
  const NAMES = ['A', 'B', 'C', 'D'];

  let state = {};

  const questionBox = document.getElementById('question-box');
  const shapesRow = document.getElementById('shapes-row');
  const feedbackEl = document.getElementById('feedback');
  const verifyBtn = document.getElementById('verify-btn');
  const newBtn = document.getElementById('new-btn');
  const gridNote = document.getElementById('grid-note');

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  // Point unique de feedback audio-visuel
  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    verifyBtn.style.display = 'none';
    newBtn.classList.add('visible');
  }

  function newExercise() {
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    state = {};
    setupL1();
  }

  // ---- Niveau 1 : rectangles sur grille ----
  function makeRect() {
    const cols = randInt(2, 6), rows = randInt(2, 5);
    return { type: 'rect', cols, rows, area: cols * rows };
  }

  function drawGridShape(shape, color, cellSize) {
    const pad = 4;
    const canvW = shape.cols * cellSize + pad * 2;
    const canvH = shape.rows * cellSize + pad * 2;
    const cv = document.createElement('canvas');
    cv.width = canvW;
    cv.height = canvH;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = color + '33';
    ctx.fillRect(pad, pad, shape.cols * cellSize, shape.rows * cellSize);

    ctx.strokeStyle = color + '66';
    ctx.lineWidth = 1;
    for (let c = 0; c <= shape.cols; c++) {
      ctx.beginPath();
      ctx.moveTo(pad + c * cellSize, pad);
      ctx.lineTo(pad + c * cellSize, pad + shape.rows * cellSize);
      ctx.stroke();
    }
    for (let r = 0; r <= shape.rows; r++) {
      ctx.beginPath();
      ctx.moveTo(pad, pad + r * cellSize);
      ctx.lineTo(pad + shape.cols * cellSize, pad + r * cellSize);
      ctx.stroke();
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(pad, pad, shape.cols * cellSize, shape.rows * cellSize);

    return cv;
  }

  function setupL1() {
    const count = 2;
    const cellSize = 24;
    const shapes = [];
    const usedAreas = [];
    while (shapes.length < count) {
      const s = makeRect();
      // Écart minimal de 3 carreaux entre les deux surfaces
      if (!usedAreas.includes(s.area) && Math.abs(s.area - (usedAreas[0] || 0)) >= 3) {
        shapes.push(s);
        usedAreas.push(s.area);
      }
    }
    shapes.forEach((s, i) => { s.name = NAMES[i]; s.color = COLORS[i]; });

    const isLargest = Math.random() < 0.5;
    const sorted = [...shapes].sort((a, b) => a.area - b.area);
    const correctName = isLargest ? sorted[sorted.length - 1].name : sorted[0].name;
    const correctShape = shapes.find(s => s.name === correctName);
    const correctArea = correctShape.cols * correctShape.rows;

    state = { shapes, correctName, isLargest, correctArea, selected: null, answered: false };
    questionBox.textContent = isLargest
      ? 'Quelle surface est la plus grande ?'
      : 'Quelle surface est la plus petite ?';
    gridNote.textContent = 'Les cases de la grille ont toutes la même taille.';

    shapesRow.innerHTML = '';
    shapes.forEach(shape => {
      const item = document.createElement('div');
      item.className = 'shape-item';
      item.appendChild(drawGridShape(shape, shape.color, cellSize));
      const lbl = document.createElement('div');
      lbl.className = 'shape-label';
      lbl.textContent = 'Surface ' + shape.name;
      item.appendChild(lbl);
      item.addEventListener('click', () => selectShape(shape.name, item));
      shapesRow.appendChild(item);
    });
  }

  function selectShape(name, item) {
    if (state.answered) return;
    document.querySelectorAll('.shape-item').forEach(d => d.classList.remove('selected'));
    item.classList.add('selected');
    state.selected = name;
    verifyBtn.disabled = false;
  }

  verifyBtn.addEventListener('click', () => {
    if (!state.selected || state.answered) return;
    state.answered = true;
    const correct = state.selected === state.correctName;
    const label = state.isLargest ? 'plus grande' : 'plus petite';

    document.querySelectorAll('.shape-item').forEach((div, i) => {
      div.classList.remove('selected');
      if (state.shapes[i].name === state.correctName) div.classList.add('correct');
      else if (state.shapes[i].name === state.selected) div.classList.add('wrong');
    });

    let msg;
    if (correct) {
      msg = `Bravo ! La surface ${state.correctName} a le plus de carreaux : c'est la ${label}.`;
    } else {
      msg = `Pas tout à fait. Recompte les carreaux : la surface ${state.correctName} en a le plus, c'est la ${label}.`;
    }

    showFeedback(correct, msg);
  });

  newBtn.addEventListener('click', newExercise);

  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

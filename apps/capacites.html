<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Les capacités — Comparer des récipients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #C0272D;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  .level-bar {
    background: #fff;
    border-bottom: 1px solid #E2E8F0;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .level-btn {
    padding: 10px 24px;
    border-radius: 999px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .level-btn.active { background: #C0272D; color: #fff; border-color: #C0272D; }
  .level-btn:not(.active):hover { background: #EEF2F7; border-color: #CBD5E0; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    gap: 24px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  .question-box {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(17px, 3.5vw, 21px);
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.4;
  }

  /* Containers display */
  .containers-row {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(16px, 4vw, 40px);
    flex-wrap: wrap;
    width: 100%;
    padding: 8px 0;
  }

  .container-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    touch-action: manipulation;
    min-height: 48px;
  }
  .container-item .label {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #64748B;
  }
  .container-svg-wrap {
    border: 3px solid #E2E8F0;
    border-radius: 12px;
    padding: 8px;
    background: #fff;
    transition: border-color 0.15s, background 0.15s;
  }
  .container-item:hover .container-svg-wrap { border-color: #3B7DD8; background: #EFF6FF; }
  .container-item.selected .container-svg-wrap { border-color: #3B7DD8; background: #DBEAFE; }
  .container-item.correct .container-svg-wrap { border-color: #10B981; background: #D1FAE5; }
  .container-item.wrong .container-svg-wrap   { border-color: #EF4444; background: #FEE2E2; }

  .feedback {
    width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 800;
    display: none;
  }
  .feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .verify-btn {
    padding: 16px 36px;
    background: #C0272D;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .verify-btn:hover { background: #A01F23; }
  .verify-btn:disabled { background: #94A3B8; cursor: default; }
  .new-btn {
    padding: 16px 36px;
    background: #0F7860;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: #0A5C48; }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>🥛 Les capacités</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2</button>
</div>

<main>
  <div class="question-box" id="question-box">Chargement…</div>
  <div class="containers-row" id="containers-row"></div>
  <div class="feedback" id="feedback"></div>
  <div class="action-row">
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<script>
  const WATER_COLOR = '#3B7DD8';
  const WATER_ALPHA = 'rgba(59,125,216,0.25)';

  /*
   * Chaque forme a :
   *   baseW / baseH  — dimensions de dessin de référence (avant mise à l'échelle)
   *   maxCapacity    — capacité réelle en mL (détermine le volume d'eau affiché)
   *   draw(ctx, w, h, fill)  — fill = volume / maxCapacity, 0..1
   *
   * Proportions intentionnellement contrastées pour travailler la conservation du volume :
   *   récipients hauts et fins  → petite capacité malgré la hauteur
   *   récipients larges et bas  → grande capacité malgré la faible hauteur
   */
  const SHAPES = [
    {
      id: 'verre',
      label: 'Verre',
      maxCapacity: 200,   // petit — haut et fin
      baseW: 52, baseH: 148,
      draw(ctx, w, h, fill) {
        const btw = w * 0.72, ttw = w * 0.58;
        const bx = (w - btw) / 2, tx = (w - ttw) / 2;
        ctx.beginPath();
        ctx.moveTo(bx, h); ctx.lineTo(tx, 0);
        ctx.lineTo(tx + ttw, 0); ctx.lineTo(bx + btw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fy = h * (1 - fill);
          const fTL = tx + (bx - tx) * (1 - fill);
          const fTR = (tx + ttw) + (btw - ttw) * (1 - fill);
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(fTL, fy);
          ctx.lineTo(fTR, fy); ctx.lineTo(bx + btw, h);
          ctx.closePath();
          ctx.fillStyle = WATER_ALPHA; ctx.fill();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fTL, fy); ctx.lineTo(fTR, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'bouteille',
      label: 'Bouteille',
      maxCapacity: 330,   // moyen — très haute et fine
      baseW: 58, baseH: 158,
      draw(ctx, w, h, fill) {
        const bw = w * 0.56, nw = w * 0.24;
        const neckH = h * 0.22;
        const bx = (w - bw) / 2, nx = (w - nw) / 2;
        ctx.beginPath();
        ctx.moveTo(bx, h);
        ctx.lineTo(bx, h * 0.78);
        ctx.quadraticCurveTo(bx, h * 0.68, nx, neckH);
        ctx.lineTo(nx, 0);
        ctx.lineTo(nx + nw, 0);
        ctx.lineTo(nx + nw, neckH);
        ctx.quadraticCurveTo(bx + bw, h * 0.68, bx + bw, h * 0.78);
        ctx.lineTo(bx + bw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const bodyTop = h * 0.68;
          const bodyH = h - bodyTop;
          const fillH = bodyH * Math.min(fill, 1);
          const fy = Math.max(h - fillH, bodyTop);
          ctx.save();
          ctx.beginPath(); ctx.rect(bx, bodyTop, bw, bodyH + 1); ctx.clip();
          ctx.fillStyle = WATER_ALPHA;
          ctx.fillRect(bx, fy, bw, h - fy + 1);
          ctx.restore();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(bx, fy); ctx.lineTo(bx + bw, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'tasse',
      label: 'Tasse',
      maxCapacity: 260,   // moyen — large et basse
      baseW: 126, baseH: 78,
      draw(ctx, w, h, fill) {
        const btw = w * 0.76, ttw = w * 0.66;
        const bx = (w - btw) / 2, tx = (w - ttw) / 2;
        ctx.beginPath();
        ctx.moveTo(bx, h); ctx.lineTo(tx, 0);
        ctx.lineTo(tx + ttw, 0); ctx.lineTo(bx + btw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        // Anse
        ctx.beginPath();
        ctx.arc(bx + btw + w * 0.04, h * 0.50, h * 0.24, -Math.PI * 0.42, Math.PI * 0.42);
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fy = h * (1 - fill);
          const fTL = tx + (bx - tx) * (1 - fill);
          const fTR = (tx + ttw) + (btw - ttw) * (1 - fill);
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(fTL, fy);
          ctx.lineTo(fTR, fy); ctx.lineTo(bx + btw, h);
          ctx.closePath();
          ctx.fillStyle = WATER_ALPHA; ctx.fill();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fTL, fy); ctx.lineTo(fTR, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'bol',
      label: 'Bol',
      maxCapacity: 620,   // grand — très large et très bas
      baseW: 148, baseH: 84,
      draw(ctx, w, h, fill) {
        const cx = w / 2, cy = h * 0.74;
        const rx = w * 0.46, ry = h * 0.54;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0);
        ctx.lineTo(cx + rx, cy);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fillTop = cy - ry * fill * 0.88;
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0);
          ctx.clip();
          ctx.fillStyle = WATER_ALPHA;
          ctx.fillRect(cx - rx, fillTop, rx * 2, cy - fillTop + ry);
          ctx.restore();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath();
          const wRx = rx * Math.sqrt(Math.max(0, 1 - Math.pow((fillTop - cy) / ry, 2)));
          ctx.ellipse(cx, fillTop, wRx, wRx * 0.14, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    },
    {
      id: 'seau',
      label: 'Seau',
      maxCapacity: 520,   // grand — largeur et hauteur moyennes
      baseW: 108, baseH: 108,
      draw(ctx, w, h, fill) {
        const btw = w * 0.80, ttw = w * 0.60;
        const bx = (w - btw) / 2, tx = (w - ttw) / 2;
        // Anse (dessinée en premier pour passer derrière le corps)
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w / 2, -6, ttw * 0.37, 0, Math.PI);
        ctx.stroke();
        // Corps
        ctx.beginPath();
        ctx.moveTo(bx, h); ctx.lineTo(tx, 0);
        ctx.lineTo(tx + ttw, 0); ctx.lineTo(bx + btw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fy = h * (1 - fill);
          const fTL = tx + (bx - tx) * (1 - fill);
          const fTR = (tx + ttw) + (btw - ttw) * (1 - fill);
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(fTL, fy);
          ctx.lineTo(fTR, fy); ctx.lineTo(bx + btw, h);
          ctx.closePath();
          ctx.fillStyle = WATER_ALPHA; ctx.fill();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fTL, fy); ctx.lineTo(fTR, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'pichet',
      label: 'Pichet',
      maxCapacity: 400,   // moyen — plus large que le verre, moins que le bol
      baseW: 82, baseH: 140,
      draw(ctx, w, h, fill) {
        const bw = w * 0.58;
        const bx = (w - bw) / 2;
        const py = h * 0.12, ph = h * 0.88, pr = 7;
        // Corps arrondi en bas (arcTo, compatible iOS < 15.4)
        ctx.beginPath();
        ctx.moveTo(bx, py);
        ctx.lineTo(bx + bw, py);
        ctx.lineTo(bx + bw, py + ph - pr);
        ctx.arcTo(bx + bw, py + ph, bx + bw - pr, py + ph, pr);
        ctx.lineTo(bx + pr, py + ph);
        ctx.arcTo(bx, py + ph, bx, py + ph - pr, pr);
        ctx.lineTo(bx, py);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        // Bec verseur
        ctx.beginPath();
        ctx.moveTo(bx, h * 0.22);
        ctx.quadraticCurveTo(bx - w * 0.14, h * 0.08, bx - w * 0.04, h * 0.04);
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        // Anse
        ctx.beginPath();
        ctx.arc(bx + bw + w * 0.1, py + ph * 0.42, ph * 0.2, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fillH = ph * fill;
          const fy = py + ph - fillH;
          ctx.save();
          ctx.beginPath(); ctx.rect(bx, py, bw, ph); ctx.clip();
          ctx.fillStyle = WATER_ALPHA;
          ctx.fillRect(bx, fy, bw, fillH + 1);
          ctx.restore();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(bx, fy); ctx.lineTo(bx + bw, fy); ctx.stroke();
        }
      }
    },
  ];

  let currentLevel = 1;
  let state = {};

  const questionBox = document.getElementById('question-box');
  const containersRow = document.getElementById('containers-row');
  const feedbackEl = document.getElementById('feedback');
  const verifyBtn = document.getElementById('verify-btn');
  const newBtn = document.getElementById('new-btn');

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  function pick(arr, n) { return shuffle(arr).slice(0, n); }

  /*
   * Dessine un récipient sur un canvas aux dimensions de la forme mise à l'échelle.
   * fill = volume / maxCapacity (0..1)
   */
  function drawContainer(shape, volume, scale) {
    const cw = Math.round(shape.baseW * scale) + 16;
    const ch = Math.round(shape.baseH * scale) + 16;
    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d');
    const fill = Math.max(0, Math.min(1, volume / shape.maxCapacity));
    ctx.save();
    ctx.translate(8, 8);
    shape.draw(ctx, cw - 16, ch - 16, fill);
    ctx.restore();
    return canvas;
  }

  /*
   * Construit l'affichage des récipients.
   * Les formes ont des proportions très différentes (hauteur vs largeur) :
   * align-items: flex-end dans containers-row aligne leur base au même niveau
   * pour que l'élève compare visuellement comme s'ils étaient posés sur une table.
   */
  function buildContainers(items) {
    containersRow.innerHTML = '';
    // Mise à l'échelle : la forme la plus haute atteint ~138 px sur l'écran
    const maxBaseH = Math.max(...items.map(it => it.shape.baseH));
    const targetH = Math.min(138, Math.max(82, (window.innerHeight - 340) * 0.45));
    const scale = Math.max(0.52, Math.min(1.0, targetH / maxBaseH));

    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'container-item';
      div.dataset.index = i;
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');
      div.setAttribute('aria-label', item.shape.label);

      const svgWrap = document.createElement('div');
      svgWrap.className = 'container-svg-wrap';
      svgWrap.appendChild(drawContainer(item.shape, item.volume, scale));

      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.textContent = item.shape.label;

      div.appendChild(svgWrap);
      div.appendChild(lbl);
      div.addEventListener('click', () => selectContainer(i, div));
      div.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectContainer(i, div); }
      });
      containersRow.appendChild(div);
    });
  }

  function selectContainer(idx, div) {
    if (state.answered) return;
    document.querySelectorAll('.container-item').forEach(d => d.classList.remove('selected'));
    div.classList.add('selected');
    state.selected = idx;
    verifyBtn.disabled = false;
  }

  /*
   * Génère des volumes en mL pour chaque forme.
   * Chaque récipient est rempli à 20–85 % de sa capacité propre.
   * minDiffMl garantit que la différence entre le max et le min est perceptible.
   * Résultat : un verre à 95 % peut contenir MOINS qu'un bol à 40 % — c'est voulu.
   */
  function generateVolumes(shapes, minDiffMl) {
    let vols, attempts = 0;
    do {
      vols = shapes.map(s => Math.round(s.maxCapacity * (0.20 + Math.random() * 0.65)));
      attempts++;
    } while (attempts < 60 && (Math.max(...vols) - Math.min(...vols)) < minDiffMl);
    return vols;
  }

  function setupL1() {
    const shapes = pick(SHAPES, 2);
    const isMost = Math.random() < 0.5;
    const vols = generateVolumes(shapes, 30);
    const items = shapes.map((shape, i) => ({ shape, volume: vols[i] }));
    const correctIdx = isMost ? (vols[0] > vols[1] ? 0 : 1) : (vols[0] < vols[1] ? 0 : 1);

    state = { items, correctIdx, selected: null, answered: false, isMost };
    questionBox.textContent = isMost
      ? 'Quel récipient contient le plus d\'eau ?'
      : 'Quel récipient contient le moins d\'eau ?';

    buildContainers(items);
    feedbackEl.className = 'feedback';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    state.answered = false;
  }

  function setupL2() {
    const count = 3 + Math.floor(Math.random() * 2);
    const shapes = pick(SHAPES, count);
    const isMost = Math.random() < 0.5;
    const vols = generateVolumes(shapes, 40);
    const items = shapes.map((shape, i) => ({ shape, volume: vols[i] }));
    const sorted = items.map((it, i) => ({ vol: vols[i], i })).sort((a, b) => a.vol - b.vol);
    const correctIdx = isMost ? sorted[sorted.length - 1].i : sorted[0].i;

    state = { items, correctIdx, selected: null, answered: false, isMost };
    questionBox.textContent = isMost
      ? 'Quel récipient contient le plus d\'eau ?'
      : 'Quel récipient contient le moins d\'eau ?';

    buildContainers(items);
    feedbackEl.className = 'feedback';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    state.answered = false;
  }

  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    verifyBtn.style.display = 'none';
    newBtn.classList.add('visible');
  }

  verifyBtn.addEventListener('click', () => {
    if (state.selected === null) return;
    state.answered = true;
    const correct = state.selected === state.correctIdx;
    document.querySelectorAll('.container-item').forEach((div, i) => {
      div.classList.remove('selected');
      if (i === state.correctIdx) div.classList.add('correct');
      else if (i === state.selected) div.classList.add('wrong');
    });
    const correctShape = state.items[state.correctIdx].shape.label;
    const question = state.isMost ? 'le plus' : 'le moins';
    const msg = correct
      ? `Bravo ! ${correctShape} contient ${question} d'eau.`
      : `Pas tout à fait. Regarde le niveau de l'eau : c'est ${correctShape} qui en contient ${question}.`;
    showFeedback(correct, msg);
  });

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);

  function newExercise() {
    if (currentLevel === 1) setupL1();
    else setupL2();
  }

  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doubles et moitiés — Maths 3H-4H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  :root {
    /* Domaine : Mathématiques */
    --app-accent:      #C0272D;
    --app-accent-dark: #A01F23;
    --app-tint-bg:     #FDECEA;
    --app-tint-fg:     #8B0000;
  }

  /* ── Affichage de l'équation ─────────────────────────────────────────────── */
  .equation {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.5vw, 20px);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 10vw, 68px);
    margin: 8px auto;
    flex-wrap: wrap;
    line-height: 1.1;
  }

  .eq-operator {
    color: #64748B;
    font-weight: 700;
  }

  .eq-blank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: clamp(60px, 14vw, 90px);
    min-height: clamp(56px, 12vw, 80px);
    border-bottom: 5px solid var(--app-accent);
    color: transparent;
    font-size: inherit;
    font-weight: 800;
    border-radius: 4px;
    padding: 0 6px;
  }

  .eq-blank.revealed {
    color: var(--app-correct-fg);
    border-bottom: none;
    background: var(--app-correct-bg);
    border-radius: 12px;
    padding: 0 14px;
  }

  /* ── Grille de réponses ──────────────────────────────────────────────────── */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 320px;
    margin: 12px auto 8px;
    padding: 0 8px;
    width: 100%;
  }

  .choice-btn {
    min-height: 72px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 7vw, 44px);
    border-radius: 16px;
    border: 3px solid var(--app-border, #DFE6EE);
    background: #fff;
    color: #1A2535;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
  }

  .choice-btn.correct {
    background: var(--app-correct-bg);
    border-color: var(--app-correct-fg);
    color: var(--app-correct-fg);
  }

  .choice-btn.wrong {
    background: var(--app-wrong-bg);
    border-color: var(--app-wrong-fg);
    color: var(--app-wrong-fg);
  }

  .choice-btn:disabled { cursor: default; }

  .choice-btn:not(:disabled):hover {
    background: #F8FAFC;
    border-color: #94A3B8;
  }

  .choice-btn:focus-visible {
    outline: 3px solid var(--app-accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .choice-btn:not(:disabled):active { transform: scale(0.94); }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>Doubles et moitiés</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1 · Doubles</button>
  <button class="level-btn"        data-level="2" aria-pressed="false">Niveau 2 · Moitiés</button>
  <button class="level-btn"        data-level="3" aria-pressed="false">Niveau 3 · Mixte</button>
</div>

<main>
  <div class="question-box" id="question-box">Chargement…</div>

  <!-- Représentation additive : doubles = n+n=__ ; moitiés = __+__=n -->
  <div class="equation" id="equation" aria-hidden="true"></div>

  <div class="choices" id="choices" role="group" aria-label="Choisir la réponse"></div>

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<script src="appUtils.js"></script>
<script>
  // 'drill' : la reconnaissance des doubles/moitiés est du calcul mental — l'erreur clôt l'item.
  const TYPE_TACHE = 'drill';

  const questionBox = document.getElementById('question-box');
  const equationEl  = document.getElementById('equation');
  const feedbackEl  = document.getElementById('feedback');
  const choicesEl   = document.getElementById('choices');
  const newBtn      = document.getElementById('new-btn');

  let currentLevel = 1;
  let state = {};

  // ── Feedback unifié ─────────────────────────────────────────────────────────
  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    // Drill : l'erreur clôt l'item — on propose la suite immédiatement.
    newBtn.classList.add('visible');
    newBtn.focus();
  }

  // ── Révélation de la réponse dans l'équation ────────────────────────────────
  function revealBlanks(value) {
    equationEl.querySelectorAll('.eq-blank').forEach(el => {
      el.textContent = value;
      el.classList.add('revealed');
    });
  }

  // ── Génération des distracteurs ─────────────────────────────────────────────
  function makeDistractors(correct, candidates, count) {
    const used = new Set([correct]);
    const result = [];
    for (const v of shuffle(candidates)) {
      if (!used.has(v) && v > 0) { used.add(v); result.push(v); }
      if (result.length === count) break;
    }
    for (let v = 1; result.length < count; v++) {
      if (!used.has(v)) { used.add(v); result.push(v); }
    }
    return result;
  }

  // ── Construction des boutons-réponses ───────────────────────────────────────
  function buildChoices(options) {
    choicesEl.innerHTML = '';
    options.forEach((val, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = val;
      btn.setAttribute('aria-label', `Réponse : ${val}`);
      btn.setAttribute('tabindex', idx === 0 ? '0' : '-1');
      btn.addEventListener('click', () => {
        if (state.answered) return;
        state.answered = true;
        choicesEl.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });
        const correct = (val === state.correctAnswer);
        btn.classList.add(correct ? 'correct' : 'wrong');
        revealBlanks(state.correctAnswer);
        showFeedback(correct, correct ? state.msgCorrect : state.msgWrong);
      });
      choicesEl.appendChild(btn);
    });
    const first = choicesEl.querySelector('.choice-btn');
    if (first) first.focus();
  }

  // ── Exercice : double d'un nombre (Niveau 1 et part du Niveau 3) ────────────
  function setupDouble(maxN) {
    const n = randInt(1, maxN);
    const correct = n * 2;
    const candidates = [correct - 1, correct + 1, correct - 2, correct + 2, n + 1, n + 2];
    const options = shuffle([correct, ...makeDistractors(correct, candidates, 3)]);

    questionBox.textContent = `Quel est le double de ${n} ?`;
    equationEl.innerHTML =
      `<span>${n}</span>` +
      `<span class="eq-operator">+</span>` +
      `<span>${n}</span>` +
      `<span class="eq-operator">=</span>` +
      `<span class="eq-blank"> </span>`;

    state = {
      answered: false,
      correctAnswer: correct,
      msgCorrect: `Bravo ! ${n} + ${n} = ${correct}, donc le double de ${n} est ${correct}.`,
      msgWrong:   `Pas tout à fait. ${n} + ${n} = ${correct}, c'est le double de ${n}. Appuie sur « Nouvel exercice » pour continuer.`
    };
    buildChoices(options);
  }

  // ── Exercice : moitié d'un nombre pair (Niveau 2 et part du Niveau 3) ───────
  function setupMoitie(maxPair) {
    // Uniquement les nombres pairs pour garantir une moitié entière.
    const n = randInt(1, Math.floor(maxPair / 2)) * 2;
    const correct = n / 2;
    const candidates = [correct - 1, correct + 1, correct - 2, correct + 2, n - 1, n + 1];
    const options = shuffle([correct, ...makeDistractors(correct, candidates, 3)]);

    questionBox.textContent = `Quelle est la moitié de ${n} ?`;
    // Représentation additive : __ + __ = n (pas de notation ÷, non encore vue en 3H-4H).
    equationEl.innerHTML =
      `<span class="eq-blank"> </span>` +
      `<span class="eq-operator">+</span>` +
      `<span class="eq-blank"> </span>` +
      `<span class="eq-operator">=</span>` +
      `<span>${n}</span>`;

    state = {
      answered: false,
      correctAnswer: correct,
      msgCorrect: `Exact ! ${correct} + ${correct} = ${n}, donc la moitié de ${n} est ${correct}.`,
      msgWrong:   `Pas tout à fait. ${correct} + ${correct} = ${n}, donc la moitié de ${n} est ${correct}. Appuie sur « Nouvel exercice » pour continuer.`
    };
    buildChoices(options);
  }

  // ── Nouvelle question ────────────────────────────────────────────────────────
  function newExercise() {
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    newBtn.classList.remove('visible');
    state = { answered: false };

    if (currentLevel === 1) {
      setupDouble(10);
    } else if (currentLevel === 2) {
      setupMoitie(20);
    } else {
      // Niveau 3 : doubles jusqu'à 15, moitiés jusqu'à 30, mélangés.
      if (Math.random() < 0.5) setupDouble(15);
      else                      setupMoitie(30);
    }
  }

  // ── Sélecteur de niveau ─────────────────────────────────────────────────────
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);

  // ── Navigation clavier : flèches entre les choix ────────────────────────────
  choicesEl.addEventListener('keydown', e => {
    const btns = Array.from(choicesEl.querySelectorAll('.choice-btn:not(:disabled)'));
    const cur = btns.indexOf(document.activeElement);
    if (cur === -1) return;
    let next = -1;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = (cur + 1) % btns.length;
    if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  next = (cur - 1 + btns.length) % btns.length;
    if (next !== -1) {
      e.preventDefault();
      btns.forEach(b => b.setAttribute('tabindex', '-1'));
      btns[next].setAttribute('tabindex', '0');
      btns[next].focus();
    }
  });

  // ── Raccourcis clavier : 1–4 sélectionnent le bouton correspondant ──────────
  document.addEventListener('keydown', e => {
    if (state.answered) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); newBtn.click(); }
      return;
    }
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= 4) {
      const btns = choicesEl.querySelectorAll('.choice-btn:not(:disabled)');
      if (btns[idx - 1]) btns[idx - 1].click();
    }
  });

  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

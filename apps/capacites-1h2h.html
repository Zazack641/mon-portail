<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Qui contient le plus ? (1H-2H)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  /* Couleur de branche (Mathématiques) — app-base.css s'en sert pour header,
     boutons primaires et niveau actif. */
  :root {
    /* Domaine : Mathématiques */
    --app-accent:      #C0272D;
    --app-accent-dark: #A01F23;
    --app-tint-bg:     #FDECEA;
    --app-tint-fg:     #8B0000;
  }

  /* .app-header, .back-link : fournis par app-base.css */

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    gap: 24px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  /* Containers display */
  .containers-row {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(16px, 4vw, 40px);
    flex-wrap: wrap;
    width: 100%;
    padding: 8px 0;
  }

  .container-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    touch-action: manipulation;
    min-height: 64px;
    min-width: 64px;
  }
  .container-item .label {
    font-family: 'Baloo 2', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #64748B;
  }
  .container-svg-wrap {
    border: 3px solid #64748B;
    border-radius: 12px;
    padding: 8px;
    background: #fff;
  }
  .container-item:hover .container-svg-wrap { border-color: #3B7DD8; background: #EFF6FF; }
  .container-item.selected .container-svg-wrap { border-color: #3B7DD8; background: #DBEAFE; }
  .container-item.correct .container-svg-wrap { border-color: #10B981; background: #D1FAE5; }
  .container-item.wrong .container-svg-wrap   { border-color: #EF4444; background: #FEE2E2; }
  .container-item:focus-visible { outline: 3px solid #3B7DD8; outline-offset: 4px; border-radius: 8px; }

  @media (prefers-reduced-motion: no-preference) {
    .container-svg-wrap { transition: border-color 0.15s, background 0.15s; }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>Qui contient le plus ?</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2</button>
</div>

<main>
  <div class="question-box" id="question-box">Chargement…</div>
  <div class="containers-row" id="containers-row"></div>
  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="action-row">
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn" id="new-btn"><span aria-hidden="true">▶</span> Nouvel exercice</button>
  </div>
</main>

<script src="appUtils.js"></script>
<script>
  const WATER_COLOR = '#3B7DD8';
  const WATER_ALPHA = 'rgba(59,125,216,0.25)';

  /*
   * Chaque forme a :
   *   baseW / baseH  — dimensions de dessin de référence (avant mise à l'échelle)
   *   maxCapacity    — capacité réelle en mL (détermine le volume d'eau affiché)
   *   draw(ctx, w, h, fill)  — fill = volume / maxCapacity, 0..1
   *
   * Proportions intentionnellement contrastées pour travailler la conservation du volume :
   *   récipients hauts et fins  → petite capacité malgré la hauteur
   *   récipients larges et bas  → grande capacité malgré la faible hauteur
   */
  const SHAPES = [
    {
      id: 'verre',
      label: 'Verre', article: 'le', famille: 'fin',
      // fillArea : aire intérieure approx. à l'échelle de base (px²) — sert de vérité terrain
      // verre trapézoïdal : largeur moy. = (0.72+0.58)/2 × 52 = 33.8 px × h 148 px
      fillArea: 5002,
      baseW: 52, baseH: 148,
      draw(ctx, w, h, fill) {
        const btw = w * 0.72, ttw = w * 0.58;
        const bx = (w - btw) / 2, tx = (w - ttw) / 2;
        ctx.beginPath();
        ctx.moveTo(bx, h); ctx.lineTo(tx, 0);
        ctx.lineTo(tx + ttw, 0); ctx.lineTo(bx + btw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fy = h * (1 - fill);
          const fTL = tx + (bx - tx) * (1 - fill);
          const fTR = (tx + ttw) + (btw - ttw) * (1 - fill);
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(fTL, fy);
          ctx.lineTo(fTR, fy); ctx.lineTo(bx + btw, h);
          ctx.closePath();
          ctx.fillStyle = WATER_ALPHA; ctx.fill();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fTL, fy); ctx.lineTo(fTR, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'bouteille',
      label: 'Bouteille', article: 'la', famille: 'fin',
      // bouteille entière : (bw+nw)/2 × 58 × 158 ≈ 3667 px²
      fillArea: 3667,
      baseW: 58, baseH: 158,
      draw(ctx, w, h, fill) {
        const bw = w * 0.56, nw = w * 0.24;
        const neckH = h * 0.22;
        const bx = (w - bw) / 2, nx = (w - nw) / 2;
        // Contour
        ctx.beginPath();
        ctx.moveTo(bx, h);
        ctx.lineTo(bx, h * 0.78);
        ctx.quadraticCurveTo(bx, h * 0.68, nx, neckH);
        ctx.lineTo(nx, 0);
        ctx.lineTo(nx + nw, 0);
        ctx.lineTo(nx + nw, neckH);
        ctx.quadraticCurveTo(bx + bw, h * 0.68, bx + bw, h * 0.78);
        ctx.lineTo(bx + bw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          // L'eau remonte de bas en haut dans toute la bouteille (corps + col)
          const fy = h * (1 - fill);
          ctx.save();
          // Clip = contour de la bouteille entière
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(bx, h * 0.78);
          ctx.quadraticCurveTo(bx, h * 0.68, nx, neckH);
          ctx.lineTo(nx, 0); ctx.lineTo(nx + nw, 0); ctx.lineTo(nx + nw, neckH);
          ctx.quadraticCurveTo(bx + bw, h * 0.68, bx + bw, h * 0.78);
          ctx.lineTo(bx + bw, h); ctx.closePath();
          ctx.clip();
          ctx.fillStyle = WATER_ALPHA;
          ctx.fillRect(0, fy, w, h - fy + 1);
          ctx.restore();
          // Ligne de surface — largeur au niveau fy
          let surfW;
          if (fy >= h * 0.68) {          // dans le corps
            surfW = bw;
          } else if (fy <= neckH) {      // dans le col
            surfW = nw;
          } else {                        // dans la transition : interpolation linéaire
            const t = (fy - neckH) / (h * 0.68 - neckH);
            surfW = nw + (bw - nw) * t;
          }
          const sx = (w - surfW) / 2;
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(sx, fy); ctx.lineTo(sx + surfW, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'tasse',
      label: 'Tasse', article: 'la', famille: 'large',
      // tasse trapézoïdale : (0.76+0.66)/2 × 126 × 78 ≈ 6976 px²
      fillArea: 6976,
      baseW: 126, baseH: 78,
      draw(ctx, w, h, fill) {
        const btw = w * 0.76, ttw = w * 0.66;
        const bx = (w - btw) / 2, tx = (w - ttw) / 2;
        ctx.beginPath();
        ctx.moveTo(bx, h); ctx.lineTo(tx, 0);
        ctx.lineTo(tx + ttw, 0); ctx.lineTo(bx + btw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        // Anse
        ctx.beginPath();
        ctx.arc(bx + btw + w * 0.04, h * 0.50, h * 0.24, -Math.PI * 0.42, Math.PI * 0.42);
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fy = h * (1 - fill);
          const fTL = tx + (bx - tx) * (1 - fill);
          const fTR = (tx + ttw) + (btw - ttw) * (1 - fill);
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(fTL, fy);
          ctx.lineTo(fTR, fy); ctx.lineTo(bx + btw, h);
          ctx.closePath();
          ctx.fillStyle = WATER_ALPHA; ctx.fill();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fTL, fy); ctx.lineTo(fTR, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'bol',
      label: 'Bol', article: 'le', famille: 'large',
      // demi-ellipse : π × rx × ry / 2 = π × (0.46×148) × (0.94×84) / 2 ≈ 8440 px²
      fillArea: 8440,
      baseW: 148, baseH: 84,
      draw(ctx, w, h, fill) {
        const cx = w / 2;
        const cy = h * 0.02;  // centre de l'ellipse près du bord supérieur
        const rx = w * 0.46;  // très large
        const ry = h * 0.94;  // profond (couvre presque toute la hauteur)
        // Demi-ellipse INFÉRIEURE (0 → π) = bol ouvert vers le haut
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI);
        ctx.closePath();  // trait horizontal = bord supérieur du bol
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          // L'eau monte du bas (cy + ry) vers le bord (cy)
          const fillY = cy + ry * (1 - fill * 0.92);
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI);
          ctx.clip();
          ctx.fillStyle = WATER_ALPHA;
          ctx.fillRect(cx - rx, fillY, rx * 2, cy + ry - fillY + 1);
          ctx.restore();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath();
          const wRx = rx * Math.sqrt(Math.max(0, 1 - Math.pow((fillY - cy) / ry, 2)));
          ctx.ellipse(cx, fillY, wRx, wRx * 0.14, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    },
    {
      id: 'seau',
      label: 'Seau', article: 'le', famille: 'large',
      // trapèze : (0.80+0.60)/2 × 108 × 108 ≈ 8165 px²
      fillArea: 8165,
      baseW: 108, baseH: 108,
      draw(ctx, w, h, fill) {
        const btw = w * 0.80, ttw = w * 0.60;
        const bx = (w - btw) / 2, tx = (w - ttw) / 2;
        // Anse (dessinée en premier pour passer derrière le corps)
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w / 2, -6, ttw * 0.37, 0, Math.PI);
        ctx.stroke();
        // Corps
        ctx.beginPath();
        ctx.moveTo(bx, h); ctx.lineTo(tx, 0);
        ctx.lineTo(tx + ttw, 0); ctx.lineTo(bx + btw, h);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fy = h * (1 - fill);
          const fTL = tx + (bx - tx) * (1 - fill);
          const fTR = (tx + ttw) + (btw - ttw) * (1 - fill);
          ctx.beginPath();
          ctx.moveTo(bx, h); ctx.lineTo(fTL, fy);
          ctx.lineTo(fTR, fy); ctx.lineTo(bx + btw, h);
          ctx.closePath();
          ctx.fillStyle = WATER_ALPHA; ctx.fill();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fTL, fy); ctx.lineTo(fTR, fy); ctx.stroke();
        }
      }
    },
    {
      id: 'pichet',
      label: 'Pichet', article: 'le', famille: 'fin',
      // corps rectangulaire : 0.58×82 × 0.88×140 ≈ 5866 px²
      fillArea: 5866,
      baseW: 82, baseH: 140,
      draw(ctx, w, h, fill) {
        const bw = w * 0.58;
        const bx = (w - bw) / 2;
        const py = h * 0.12, ph = h * 0.88, pr = 7;
        // Corps arrondi en bas (arcTo, compatible iOS < 15.4)
        ctx.beginPath();
        ctx.moveTo(bx, py);
        ctx.lineTo(bx + bw, py);
        ctx.lineTo(bx + bw, py + ph - pr);
        ctx.arcTo(bx + bw, py + ph, bx + bw - pr, py + ph, pr);
        ctx.lineTo(bx + pr, py + ph);
        ctx.arcTo(bx, py + ph, bx, py + ph - pr, pr);
        ctx.lineTo(bx, py);
        ctx.closePath();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        // Bec verseur
        ctx.beginPath();
        ctx.moveTo(bx, h * 0.22);
        ctx.quadraticCurveTo(bx - w * 0.14, h * 0.08, bx - w * 0.04, h * 0.04);
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.stroke();
        // Anse
        ctx.beginPath();
        ctx.arc(bx + bw + w * 0.1, py + ph * 0.42, ph * 0.2, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill > 0) {
          const fillH = ph * fill;
          const fy = py + ph - fillH;
          ctx.save();
          ctx.beginPath(); ctx.rect(bx, py, bw, ph); ctx.clip();
          ctx.fillStyle = WATER_ALPHA;
          ctx.fillRect(bx, fy, bw, fillH + 1);
          ctx.restore();
          ctx.strokeStyle = WATER_COLOR; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(bx, fy); ctx.lineTo(bx + bw, fy); ctx.stroke();
        }
      }
    },
  ];

  // Type de tâche (voir skills/design-portail § « drill vs instance » et
  // skills/pedagogie-per § 5 bis). Comparaison perceptive de capacités :
  // l'erreur révèle la bonne réponse et clôt l'item (aucun tâtonnement
  // exploitable sur la même instance) → 'drill'.
  const TYPE_TACHE = 'drill';

  let currentLevel = 1;
  let state = {};

  const questionBox = document.getElementById('question-box');
  const containersRow = document.getElementById('containers-row');
  const feedbackEl = document.getElementById('feedback');
  const verifyBtn = document.getElementById('verify-btn');
  const newBtn = document.getElementById('new-btn');

  // shuffle, pick : fournis par appUtils.js (chargé avant ce script).

  /*
   * Dessine un récipient sur un canvas mis à l'échelle.
   * fill : taux de remplissage 0..1 (fourni directement, plus de division par maxCapacity)
   */
  function drawContainer(shape, fill, scale) {
    const cw = Math.round(shape.baseW * scale) + 16;
    const ch = Math.round(shape.baseH * scale) + 16;
    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(8, 8);
    shape.draw(ctx, cw - 16, ch - 16, Math.max(0, Math.min(1, fill)));
    ctx.restore();
    return canvas;
  }

  /*
   * Construit l'affichage des récipients.
   * Les formes ont des proportions très différentes (hauteur vs largeur) :
   * align-items: flex-end dans containers-row aligne leur base au même niveau
   * pour que l'élève compare visuellement comme s'ils étaient posés sur une table.
   */
  function buildContainers(items) {
    containersRow.innerHTML = '';
    // Mise à l'échelle : la forme la plus haute atteint ~138 px sur l'écran
    const maxBaseH = Math.max(...items.map(it => it.shape.baseH));
    const targetH = Math.min(138, Math.max(82, (window.innerHeight - 340) * 0.45));
    const scale = Math.max(0.52, Math.min(1.0, targetH / maxBaseH));

    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'container-item';
      div.dataset.index = i;
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');
      if (i === 0) div.setAttribute('data-focus-target', '');
      const letter = String.fromCharCode(65 + i); // A, B, C, D
      div.setAttribute('aria-label', 'Récipient ' + letter);

      const svgWrap = document.createElement('div');
      svgWrap.className = 'container-svg-wrap';
      svgWrap.appendChild(drawContainer(item.shape, item.fill, scale));

      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.textContent = letter;

      div.appendChild(svgWrap);
      div.appendChild(lbl);
      div.addEventListener('click', () => selectContainer(i, div));
      div.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectContainer(i, div); }
      });
      containersRow.appendChild(div);
    });
  }

  function selectContainer(idx, div) {
    if (state.answered) return;
    document.querySelectorAll('.container-item').forEach(d => d.classList.remove('selected'));
    div.classList.add('selected');
    state.selected = idx;
    verifyBtn.disabled = false;
  }

  /*
   * Génère des volumes en mL pour chaque forme.
   * Chaque récipient est rempli à 20–85 % de sa capacité propre.
   * minDiffMl garantit que la différence entre le max et le min est perceptible.
   * Résultat : un verre à 95 % peut contenir MOINS qu'un bol à 40 % — c'est voulu.
   */
  /*
   * Génère des taux de remplissage (fill, 0..1) pour chaque forme.
   *
   * minFillDiff : écart minimal de taux de remplissage entre les deux extrêmes.
   *   N1 (même famille) : 0.28 — la différence de niveau est toujours visible.
   *   N2 (formes mixtes) : 0.12 — les niveaux peuvent être proches ; c'est la
   *     surface × taux qui détermine le gagnant, pas le niveau seul.
   *
   * minVisVolRatio : le gagnant doit avoir au moins (1 + ratio) × volume visuel
   *   du deuxième — évite les exercices trop ambigus.
   */
  function generateFills(shapes, minFillDiff, minVisVolRatio = 0.12) {
    let fills, attempts = 0;
    do {
      fills = shapes.map(() => +(0.15 + Math.random() * 0.75).toFixed(3));
      const fillSpread = Math.max(...fills) - Math.min(...fills);
      const visVols = shapes.map((s, i) => s.fillArea * fills[i]);
      const sortedVV = [...visVols].sort((a, b) => a - b);
      const spread = (sortedVV[sortedVV.length - 1] - sortedVV[sortedVV.length - 2])
                     / sortedVV[sortedVV.length - 2];
      if (fillSpread >= minFillDiff && spread >= minVisVolRatio) break;
      attempts++;
    } while (attempts < 150);
    return fills;
  }

  /* Calcule l'index correct à partir des volumes visuels (fillArea × taux). */
  function correctByVisualVolume(shapes, fills, isMost) {
    const visVols = shapes.map((s, i) => s.fillArea * fills[i]);
    const sorted  = visVols.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v);
    return isMost ? sorted[sorted.length - 1].i : sorted[0].i;
  }

  function setupL1() {
    // N1 — même famille (proportions similaires) : 1H-2H
    // Vérité = taux de remplissage (volumes visuels proches pour même famille).
    // minFillDiff = 0.28 garantit une différence de niveau toujours visible.
    const familles = [...new Set(SHAPES.map(s => s.famille))];
    const famille  = familles[Math.floor(Math.random() * familles.length)];
    const pool     = SHAPES.filter(s => s.famille === famille);
    const shapes   = pick(pool, 2);
    const isMost   = Math.random() < 0.5;
    const fills    = generateFills(shapes, 0.28);
    const items    = shapes.map((shape, i) => ({ shape, fill: fills[i] }));
    const correctIdx = correctByVisualVolume(shapes, fills, isMost);

    state = { items, correctIdx, selected: null, answered: false, isMost };
    questionBox.textContent = isMost
      ? 'Clique sur le récipient qui contient le plus d\'eau.'
      : 'Clique sur le récipient qui contient le moins d\'eau.';

    buildContainers(items);
    feedbackEl.className = 'feedback';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    state.answered = false;
  }

  function setupL2() {
    // N2 — même famille (proportions similaires), 3 récipients : 1H-2H
    // Différenciation interne du groupe d'années : on reste en même famille,
    // donc la comparaison porte sur le niveau d'eau visible et n'introduit
    // jamais le piège « conservation du volume » (trop précoce à 1H-2H).
    const familles = [...new Set(SHAPES.map(s => s.famille))];
    const famille  = familles[Math.floor(Math.random() * familles.length)];
    const pool     = SHAPES.filter(s => s.famille === famille);
    const shapes   = pick(pool, 3);
    const isMost   = Math.random() < 0.5;
    const fills    = generateFills(shapes, 0.22);
    const items  = shapes.map((shape, i) => ({ shape, fill: fills[i] }));
    const correctIdx = correctByVisualVolume(shapes, fills, isMost);

    state = { items, correctIdx, selected: null, answered: false, isMost };
    questionBox.textContent = isMost
      ? 'Clique sur le récipient qui contient le plus d\'eau.'
      : 'Clique sur le récipient qui contient le moins d\'eau.';

    buildContainers(items);
    feedbackEl.className = 'feedback';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    state.answered = false;
  }

  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }

    if (correct || TYPE_TACHE === 'drill') {
      // Item clos : on propose la suite. Focus déplacé sur « Nouvel exercice »
      // (exigence de gestion du focus, skills/accessibilite § 6).
      verifyBtn.style.display = 'none';
      newBtn.classList.add('visible');
      newBtn.focus();
    } else {
      // 'instance' + incorrect : l'élève corrigerait et revérifierait la même
      // instance. Non emprunté ici (tâche de drill), conservé pour le contrat.
      verifyBtn.style.display = '';
      verifyBtn.disabled = false;
      newBtn.classList.remove('visible');
    }
  }

  verifyBtn.addEventListener('click', () => {
    if (state.selected === null) return;
    state.answered = true;
    const correct = state.selected === state.correctIdx;
    document.querySelectorAll('.container-item').forEach((div, i) => {
      div.classList.remove('selected');
      const letter = String.fromCharCode(65 + i);
      const lbl = div.querySelector('.label');
      if (i === state.correctIdx) {
        div.classList.add('correct');
        lbl.textContent = letter + ' ✓';
        div.setAttribute('aria-label', 'Récipient ' + letter + ' — correct');
      } else if (i === state.selected && i !== state.correctIdx) {
        div.classList.add('wrong');
        lbl.textContent = letter + ' ✗';
        div.setAttribute('aria-label', 'Récipient ' + letter + ' — incorrect');
      }
    });
    const correctLetter = String.fromCharCode(65 + state.correctIdx);
    const question = state.isMost ? 'le plus' : 'le moins';
    const msg = correct
      ? `Bravo ! Le récipient ${correctLetter} contient ${question} d'eau.`
      : `Pas tout à fait. C'est le récipient ${correctLetter} qui contient ${question} d'eau. Appuie sur « Nouvel exercice » pour continuer.`;
    showFeedback(correct, msg);
  });

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);

  function newExercise() {
    if (currentLevel === 1) setupL1();
    else setupL2();
    const firstEl = containersRow.querySelector('[data-focus-target]');
    if (firstEl) firstEl.focus();
  }

  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

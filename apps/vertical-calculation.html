<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calcul en Colonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-units:    #3B7DD8;
      --color-tens:     #D64045;
      --color-hundreds: #3A9E6F;
      --bg:        #F0F4F8;
      --white:     #ffffff;
      --text:      #1A2535;
      --muted:     #64748B;
      --border:    #E2E8F0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    .app-header {
      background: #1A3A5C;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.15s;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .back-btn:hover { background: rgba(255,255,255,0.22); }
    .app-header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 900;
      color: #fff;
    }

    /* ── Layout ── */
    .app-main {
      max-width: 560px;
      margin: 0 auto;
      padding: 22px 18px 56px;
    }

    /* ── Panel ── */
    .panel {
      background: var(--white);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .panel-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Level buttons ── */
    .level-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .level-btn {
      padding: 10px 6px 12px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #F8FAFC;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      min-height: 52px;
      touch-action: manipulation;
      -webkit-appearance: none;
      line-height: 1.2;
    }
    .level-btn small {
      display: block;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 10px;
      font-weight: 600;
      opacity: 0.75;
      margin-top: 3px;
    }
    .level-btn:hover { background: #EEF2F7; border-color: #CBD5E0; }
    .level-btn.active {
      background: var(--color-units);
      color: #fff;
      border-color: var(--color-units);
    }

    /* ── Exercise card ── */
    .exercise-card {
      background: var(--white);
      border-radius: 18px;
      padding: 28px 20px 24px;
      border: 1px solid var(--border);
    }

    /* ── Calc table ── */
    .calc-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .calc-table {
      border-collapse: collapse;
    }

    /* Column headers */
    .th-sign { width: 52px; }
    .th-col {
      width: 72px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding-bottom: 10px;
    }

    /* Carry row */
    .td-carry { text-align: center; padding: 0 6px 8px; }
    .carry-inp {
      width: 32px; height: 32px;
      border: 2px dashed #CBD5E0;
      border-radius: 7px;
      background: #F8FAFC;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #94A3B8;
      outline: none;
      -webkit-appearance: none;
      touch-action: manipulation;
      transition: border-color 0.15s, color 0.15s;
    }
    .carry-inp:focus { border-style: solid; border-color: #94A3B8; color: #475569; }

    /* Addend rows */
    .td-sign {
      text-align: right;
      padding-right: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: var(--muted);
      vertical-align: middle;
      height: 60px;
    }
    .td-digit { text-align: center; padding: 2px 6px; height: 60px; vertical-align: middle; }
    .digit {
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      display: block;
    }

    /* Separator */
    .sep-td {
      border-top: 3px solid var(--text);
      padding-top: 6px;
      height: 0;
    }

    /* Result row */
    .td-result { text-align: center; padding: 8px 6px 0; }
    .result-inp {
      width: 62px; height: 70px;
      border: 2.5px solid var(--border);
      border-radius: 10px;
      background: #F8FAFC;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      touch-action: manipulation;
      transition: border-color 0.15s, background 0.15s;
    }
    .result-inp:focus { background: #EBF3FC; border-color: var(--color-units); }

    /* Verification states */
    .result-inp.ok  { border-color: #3A9E6F; background: #E6F5F0; color: #0A6048; }
    .result-inp.bad { border-color: #D64045; background: #FEE8E8; color: #C0282C; }
    .carry-inp.ok   { border-style: solid; border-color: #3A9E6F; background: #E6F5F0; color: #0A6048; }
    .carry-inp.bad  { border-style: solid; border-color: #D64045; background: #FEE8E8; color: #C0282C; }

    /* ── Feedback ── */
    .feedback {
      text-align: center;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 18px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .feedback.ok  { display: block; background: #E6F5F0; color: #0A6048; }
    .feedback.bad { display: block; background: #FEE8E8; color: #C0282C; }

    /* ── Action buttons ── */
    .btn-row { display: flex; gap: 10px; }
    .btn-check {
      flex: 2;
      padding: 16px;
      background: #1A3A5C;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      min-height: 54px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-check:hover  { background: #253F63; }
    .btn-check:active { transform: scale(0.98); }
    .btn-next {
      flex: 1;
      padding: 16px;
      background: #F0F4F8;
      color: #1A3A5C;
      border: 2px solid #CBD5E0;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      min-height: 54px;
      transition: background 0.15s;
    }
    .btn-next:hover { background: #E2E8F0; }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .level-row { grid-template-columns: repeat(2, 1fr); }
      .digit, .td-sign { font-size: 36px; }
      .result-inp { width: 52px; height: 60px; font-size: 34px; }
    }
  </style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../portail-pedagogique.html" class="back-btn">← Retour au portail</a>
  <h1>Calcul en Colonne</h1>
</header>

<main class="app-main">

  <div class="panel">
    <div class="panel-label">Niveau</div>
    <div class="level-row" role="group" aria-label="Choisir le niveau">
      <button class="level-btn active" data-level="1" aria-pressed="true">
        N·1<small>2 chiffres sans retenue</small>
      </button>
      <button class="level-btn" data-level="2" aria-pressed="false">
        N·2<small>3 chiffres sans retenue</small>
      </button>
      <button class="level-btn" data-level="3" aria-pressed="false">
        N·3<small>avec retenue</small>
      </button>
      <button class="level-btn" data-level="4" aria-pressed="false">
        N·4<small>3 nombres</small>
      </button>
    </div>
  </div>

  <div class="exercise-card">
    <div class="calc-wrap">
      <table class="calc-table" id="calc-table" aria-label="Grille de calcul en colonne"></table>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="btn-row">
      <button class="btn-check" id="btn-check">Vérifier ✓</button>
      <button class="btn-next" id="btn-next">Nouvel exercice</button>
    </div>
  </div>

</main>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let level = 1;
  let numbers = [];
  let cols = 2;
  let isVerified = false;

  // ── Helpers ────────────────────────────────────────────────────────────────
  const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

  // Returns array of length `c`: null for absent leading digits, then actual digits.
  function toDigits(n, c) {
    const arr = String(n).split('').map(Number);
    while (arr.length < c) arr.unshift(null);
    return arr;
  }

  // Column 0 = leftmost (highest place value), column cols-1 = units.
  const PLACE_COLORS = ['var(--color-hundreds)', 'var(--color-tens)', 'var(--color-units)'];
  const PLACE_LABELS = ['C', 'D', 'U'];
  const PLACE_NAMES  = ['centaines', 'dizaines', 'unités'];

  function colColor(colIdx, totalCols) {
    return PLACE_COLORS[colIdx + (3 - totalCols)];
  }
  function colLabel(colIdx, totalCols) {
    return PLACE_LABELS[colIdx + (3 - totalCols)];
  }
  function colName(colIdx, totalCols) {
    return PLACE_NAMES[colIdx + (3 - totalCols)];
  }

  // ── Number generation ──────────────────────────────────────────────────────
  function generate(lvl) {
    let a, b, c;

    if (lvl === 1) {
      // 2 numbers, 2 digits, no carry in any column
      do {
        a = ri(11, 89); b = ri(11, 89);
      } while (
        (a % 10) + (b % 10) >= 10 ||
        Math.floor(a / 10) + Math.floor(b / 10) >= 10
      );
      cols = 2;
      return [a, b];
    }

    if (lvl === 2) {
      // 2 numbers, 3 digits, no carry in any column
      do {
        a = ri(111, 899); b = ri(111, 899);
      } while (
        (a % 10) + (b % 10) >= 10 ||
        (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) >= 10 ||
        Math.floor(a / 100) + Math.floor(b / 100) >= 10
      );
      cols = 3;
      return [a, b];
    }

    if (lvl === 3) {
      // 2 numbers, 2–3 digits, at least one carry, sum < 1000
      let hasCarry;
      do {
        a = ri(10, 999); b = ri(10, 999);
        const su = (a % 10) + (b % 10);
        const sd = (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10);
        hasCarry = su >= 10 || sd >= 10;
      } while (!hasCarry || a + b >= 1000);
      cols = 3;
      return [a, b];
    }

    // lvl 4: 3 numbers, 3 digits, at least 2 carries, sum < 1000
    let carries;
    do {
      a = ri(100, 399); b = ri(100, 399); c = ri(100, 399);
      const su = (a % 10) + (b % 10) + (c % 10);
      const cu = Math.floor(su / 10);
      const sd = (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) + (Math.floor(c / 10) % 10) + cu;
      carries = (su >= 10 ? 1 : 0) + (sd >= 10 ? 1 : 0);
    } while (carries < 2 || a + b + c >= 1000);
    cols = 3;
    return [a, b, c];
  }

  // ── Expected carries ───────────────────────────────────────────────────────
  // carries[colIdx] = value to write above that column (carry INTO it from the right).
  function computeCarries(nums, c) {
    const result = new Array(c).fill(0);
    let carry = 0;
    for (let col = c - 1; col >= 0; col--) {
      let sum = carry;
      nums.forEach(n => {
        const d = toDigits(n, c)[col];
        if (d !== null) sum += d;
      });
      carry = Math.floor(sum / 10);
      if (col > 0) result[col - 1] = carry;
    }
    return result;
  }

  // ── Build table ────────────────────────────────────────────────────────────
  function buildTable() {
    const t = document.getElementById('calc-table');
    let html = '';

    // Header row: column labels (C / D / U)
    html += '<tr><th class="th-sign"></th>';
    for (let c = 0; c < cols; c++) {
      html += `<th class="th-col" style="color:${colColor(c, cols)}">${colLabel(c, cols)}</th>`;
    }
    html += '</tr>';

    // Carry row: optional small inputs above each column
    html += '<tr><td></td>';
    for (let c = 0; c < cols; c++) {
      html += `<td class="td-carry">
        <input class="carry-inp" type="text" inputmode="numeric" maxlength="1"
               data-carry="${c}" autocomplete="off"
               aria-label="Retenue ${colName(c, cols)}">
      </td>`;
    }
    html += '</tr>';

    // Addend rows
    numbers.forEach((n, row) => {
      const isLast = row === numbers.length - 1;
      html += `<tr><td class="td-sign">${isLast ? '+' : ''}</td>`;
      toDigits(n, cols).forEach((d, c) => {
        const hidden = d === null ? 'style="visibility:hidden"' : '';
        html += `<td class="td-digit">
          <span class="digit" style="color:${colColor(c, cols)}" ${hidden}>${d ?? 0}</span>
        </td>`;
      });
      html += '</tr>';
    });

    // Separator line
    html += `<tr><td class="sep-td" colspan="${cols + 1}"></td></tr>`;

    // Result row: one editable input per column
    html += '<tr><td></td>';
    for (let c = 0; c < cols; c++) {
      html += `<td class="td-result">
        <input class="result-inp" type="text" inputmode="numeric" maxlength="1"
               data-res="${c}" autocomplete="off"
               aria-label="Résultat ${colName(c, cols)}">
      </td>`;
    }
    html += '</tr>';

    t.innerHTML = html;
    wireInputs();
  }

  // ── Input wiring ───────────────────────────────────────────────────────────
  function wireInputs() {
    const resInps = [...document.querySelectorAll('.result-inp')];

    // Auto-advance right-to-left (educational convention: units first)
    resInps.forEach((inp, i) => {
      inp.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g, '');
        e.target.value = v ? v[v.length - 1] : '';
        // Advance to the column on the left (higher place value)
        if (v && i > 0) resInps[i - 1].focus();
        resetVerification();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i < resInps.length - 1) {
          resInps[i + 1].focus(); // go right (lower place value)
        }
      });
    });

    // Carry inputs: independent, just sanitize
    document.querySelectorAll('.carry-inp').forEach(inp => {
      inp.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g, '');
        e.target.value = v ? v[v.length - 1] : '';
        resetVerification();
      });
    });

    // Focus units (rightmost) first
    resInps[resInps.length - 1]?.focus();
  }

  // ── Verify ─────────────────────────────────────────────────────────────────
  function verify() {
    isVerified = true;
    const total = numbers.reduce((s, n) => s + n, 0);
    const expected = toDigits(total, cols);
    const carries  = computeCarries(numbers, cols);
    let allOk = true;

    document.querySelectorAll('.result-inp').forEach((inp, i) => {
      const ok = inp.value !== '' && parseInt(inp.value) === expected[i];
      inp.classList.toggle('ok', ok);
      inp.classList.toggle('bad', !ok);
      if (!ok) allOk = false;
    });

    // Carries are optional: only validate if filled
    document.querySelectorAll('.carry-inp').forEach((inp, i) => {
      inp.classList.remove('ok', 'bad');
      if (!inp.value) return;
      const ok = parseInt(inp.value) === carries[i];
      inp.classList.toggle('ok', ok);
      inp.classList.toggle('bad', !ok);
      if (!ok) allOk = false;
    });

    const fb = document.getElementById('feedback');
    fb.textContent = allOk
      ? '🎉 Bravo ! C\'est correct !'
      : '🔴 Pas tout à fait… Vérifie et réessaie !';
    fb.className = 'feedback ' + (allOk ? 'ok' : 'bad');
    if (allOk) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
  }

  function resetVerification() {
    if (!isVerified) return;
    isVerified = false;
    document.querySelectorAll('.result-inp, .carry-inp').forEach(el => el.classList.remove('ok', 'bad'));
    document.getElementById('feedback').className = 'feedback';
  }

  // ── New exercise ───────────────────────────────────────────────────────────
  function newExercise() {
    isVerified = false;
    document.getElementById('feedback').className = 'feedback';
    numbers = generate(level);
    buildTable();
  }

  // ── Event listeners ────────────────────────────────────────────────────────
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      level = parseInt(btn.dataset.level);
      newExercise();
    });
  });

  document.getElementById('btn-check').addEventListener('click', verify);
  document.getElementById('btn-next').addEventListener('click', newExercise);

  // ── Init ───────────────────────────────────────────────────────────────────
  newExercise();
</script>

<script src="feedbackUtils.js"></script>
</body>
</html>

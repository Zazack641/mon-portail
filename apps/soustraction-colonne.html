<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Soustraction en colonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-units:    #3B7DD8;
      --color-tens:     #D64045;
      --color-hundreds: #3A9E6F;
      --bg:        #F0F4F8;
      --white:     #ffffff;
      --text:      #1A2535;
      --muted:     #64748B;
      --border:    #E2E8F0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    .app-header {
      background: #C0272D;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.15s;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .back-btn:hover { background: rgba(255,255,255,0.22); }
    .app-header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 900;
      color: #fff;
    }

    /* ── Layout ── */
    .app-main {
      max-width: 560px;
      margin: 0 auto;
      padding: 22px 18px 56px;
    }

    /* ── Panel ── */
    .panel {
      background: var(--white);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .panel-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Level buttons ── */
    .level-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .level-btn {
      padding: 10px 6px 12px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #F8FAFC;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      min-height: 52px;
      touch-action: manipulation;
      -webkit-appearance: none;
      line-height: 1.2;
    }
    .level-btn small {
      display: block;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 10px;
      font-weight: 600;
      opacity: 0.75;
      margin-top: 3px;
    }
    .level-btn:hover { background: #EEF2F7; border-color: #CBD5E0; }
    .level-btn.active {
      background: var(--color-units);
      color: #fff;
      border-color: var(--color-units);
    }

    /* ── Exercise card ── */
    .exercise-card {
      background: var(--white);
      border-radius: 18px;
      padding: 28px 20px 24px;
      border: 1px solid var(--border);
    }

    /* ── Calc table ── */
    .calc-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .calc-table { border-collapse: collapse; }

    /* Column headers */
    .th-sign { width: 52px; }
    .th-col {
      width: 72px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding-bottom: 10px;
    }

    /* ── Minuend interactive row ── */
    .td-minuend {
      text-align: center;
      padding: 0 6px;
      vertical-align: middle;
      height: 86px;
    }
    /* Tappable columns get a pointer and subtle active state */
    .td-minuend.tappable {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .td-minuend.tappable:active .minuend-wrap {
      opacity: 0.75;
      transform: scale(0.95);
    }
    .minuend-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: opacity 0.1s, transform 0.1s;
    }
    /* "+10" label shown when the column receives a borrow */
    .plus10-label {
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #3A9E6F;
      line-height: 1;
      min-height: 16px;
      visibility: hidden;
    }
    .plus10-label.visible { visibility: visible; }
    /* Original digit and effective value sit side by side */
    .digit-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
    }
    .digit-orig {
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      transition: color 0.15s, text-decoration 0.15s;
    }
    .digit-orig.struck {
      text-decoration: line-through;
      color: #CBD5E0 !important;
    }
    /* Effective value: hidden until borrow involved */
    .digit-eff {
      display: none;
      font-family: 'Nunito', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #D97706;
      line-height: 1;
    }
    .digit-eff.visible { display: block; }
    /* Subtle tap affordance on tappable columns with no active borrow */
    .td-minuend.tappable .tap-hint {
      font-size: 10px;
      color: #CBD5E0;
      line-height: 1;
      min-height: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
    }
    .td-minuend.tappable.borrowed .tap-hint { display: none; }

    /* ── Subtrahend row ── */
    .td-sign {
      text-align: right;
      padding-right: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: var(--muted);
      vertical-align: middle;
      height: 60px;
    }
    .td-digit { text-align: center; padding: 2px 6px; height: 60px; vertical-align: middle; }
    .digit {
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      display: block;
    }

    /* Separator */
    .sep-td {
      border-top: 3px solid var(--text);
      padding-top: 6px;
      height: 0;
    }

    /* Result row */
    .td-result { text-align: center; padding: 8px 6px 0; }
    .result-inp {
      width: 62px; height: 70px;
      border: 2.5px solid var(--border);
      border-radius: 10px;
      background: #F8FAFC;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      touch-action: manipulation;
      transition: border-color 0.15s, background 0.15s;
    }
    .result-inp:focus { background: #EBF3FC; border-color: var(--color-units); }

    /* Verification states */
    .result-inp.ok  { border-color: #3A9E6F; background: #E6F5F0; color: #0A6048; }
    .result-inp.bad { border-color: #D64045; background: #FEE8E8; color: #C0282C; }

    /* ── Feedback ── */
    .feedback {
      text-align: center;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 18px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .feedback.ok  { display: block; background: #E6F5F0; color: #0A6048; }
    .feedback.bad { display: block; background: #FEE8E8; color: #C0282C; }

    /* ── Action buttons ── */
    .btn-row { display: flex; gap: 10px; }
    .btn-check {
      flex: 2;
      padding: 16px;
      background: #C0272D;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      min-height: 54px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-check:hover  { background: #A01F23; }
    .btn-check:active { transform: scale(0.98); }
    .btn-next {
      flex: 1;
      padding: 16px;
      background: #F0F4F8;
      color: #1A3A5C;
      border: 2px solid #CBD5E0;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      min-height: 54px;
      transition: background 0.15s;
    }
    .btn-next:hover { background: #E2E8F0; }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .level-row { grid-template-columns: repeat(2, 1fr); }
      .digit-orig, .td-sign { font-size: 36px; }
      .result-inp { width: 52px; height: 60px; font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-btn">← Retour au portail</a>
  <h1>Soustraction en colonne</h1>
</header>

<main class="app-main">

  <div class="panel">
    <div class="panel-label">Niveau</div>
    <div class="level-row" role="group" aria-label="Choisir le niveau">
      <button class="level-btn active" data-level="1" aria-pressed="true">
        N·1<small>2 chiffres sans emprunt</small>
      </button>
      <button class="level-btn" data-level="2" aria-pressed="false">
        N·2<small>3 chiffres sans emprunt</small>
      </button>
      <button class="level-btn" data-level="3" aria-pressed="false">
        N·3<small>1 emprunt</small>
      </button>
      <button class="level-btn" data-level="4" aria-pressed="false">
        N·4<small>2 emprunts</small>
      </button>
    </div>
  </div>

  <div class="exercise-card">
    <div class="calc-wrap">
      <table class="calc-table" id="calc-table" aria-label="Grille de soustraction en colonne"></table>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="btn-row">
      <button class="btn-check" id="btn-check">Vérifier ✓</button>
      <button class="btn-next" id="btn-next">Nouvel exercice</button>
    </div>
  </div>

</main>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let level = 1;
  let minuend = 0;
  let subtrahend = 0;
  let cols = 2;
  let isVerified = false;
  // gives[c] = true → column c gives 1 to column c+1 (right, lower place value)
  let gives = [];

  // ── Helpers ────────────────────────────────────────────────────────────────
  const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

  function toDigits(n, c) {
    const arr = String(n).split('').map(Number);
    while (arr.length < c) arr.unshift(null);
    return arr;
  }

  const PLACE_COLORS = ['var(--color-hundreds)', 'var(--color-tens)', 'var(--color-units)'];
  const PLACE_LABELS = ['C', 'D', 'U'];
  const PLACE_NAMES  = ['centaines', 'dizaines', 'unités'];

  function colColor(colIdx, totalCols) { return PLACE_COLORS[colIdx + (3 - totalCols)]; }
  function colLabel(colIdx, totalCols) { return PLACE_LABELS[colIdx + (3 - totalCols)]; }
  function colName(colIdx, totalCols)  { return PLACE_NAMES [colIdx + (3 - totalCols)]; }

  // Effective value for minuend column c given current borrows state.
  // receives borrow if gives[c-1]; gives borrow if gives[c].
  function effectiveDigit(origDigits, c) {
    const base = origDigits[c] ?? 0;
    const received = c > 0 && gives[c - 1] ? 10 : 0;
    const given    = c < cols - 1 && gives[c] ? 1 : 0;
    return base + received - given;
  }

  function countBorrows(a, b, c) {
    const da = toDigits(a, c).map(d => d ?? 0);
    const db = toDigits(b, c).map(d => d ?? 0);
    let n = 0;
    for (let i = 0; i < c; i++) if (da[i] < db[i]) n++;
    return n;
  }

  // ── Number generation ──────────────────────────────────────────────────────
  function generate(lvl) {
    let a, b;

    if (lvl === 1) {
      do {
        a = ri(11, 99); b = ri(11, 99);
        if (a < b) [a, b] = [b, a];
      } while (
        (a % 10) < (b % 10) ||
        Math.floor(a / 10) < Math.floor(b / 10)
      );
      cols = 2;
      return [a, b];
    }

    if (lvl === 2) {
      // 50% chance: 3-digit minus 2-digit (e.g. 987 - 42), no borrow
      const mixed = Math.random() < 0.5;
      do {
        a = ri(111, 999);
        b = mixed ? ri(11, 99) : ri(111, 999);
        if (a < b) [a, b] = [b, a];
      } while (countBorrows(a, b, 3) > 0);
      cols = 3;
      return [a, b];
    }

    if (lvl === 3) {
      // 2-digit numbers only, exactly 1 borrow (units column)
      do {
        a = ri(21, 99); b = ri(11, 89);
        if (a < b) [a, b] = [b, a];
      } while (a === b || (a % 10) >= (b % 10));
      cols = 2;
      return [a, b];
    }

    // lvl 4: 3-digit minus 2-or-3-digit, at least two borrows
    // 50% chance: 3-digit minus 2-digit
    const mixed = Math.random() < 0.5;
    do {
      a = ri(200, 999);
      b = mixed ? ri(11, 99) : ri(11, 999);
      if (a < b) [a, b] = [b, a];
    } while (a === b || countBorrows(a, b, 3) < 2);
    cols = 3;
    return [a, b];
  }

  // ── Build table ────────────────────────────────────────────────────────────
  function buildTable() {
    const t = document.getElementById('calc-table');
    let html = '';

    // Header row
    html += '<tr><th class="th-sign"></th>';
    for (let c = 0; c < cols; c++) {
      html += `<th class="th-col" style="color:${colColor(c, cols)}">${colLabel(c, cols)}</th>`;
    }
    html += '</tr>';

    // Minuend row: interactive cells (all but the last column are tappable)
    const origDigits = toDigits(minuend, cols).map(d => d ?? 0);
    html += '<tr><td class="td-sign"></td>';
    for (let c = 0; c < cols; c++) {
      const isLast = c === cols - 1;
      const canBorrow = level >= 3 && !isLast;
      const tappable = canBorrow ? 'tappable' : '';
      const tapHint  = canBorrow ? '<span class="tap-hint">tap ✎</span>' : '';
      html += `
        <td class="td-minuend ${tappable}" data-col="${c}"
            ${!isLast ? `role="button" tabindex="0" aria-label="Emprunt ${colName(c, cols)}, chiffre ${origDigits[c]}"` : ''}>
          <div class="minuend-wrap">
            <span class="plus10-label">+10</span>
            <div class="digit-row">
              <span class="digit-orig" style="color:${colColor(c, cols)}">${origDigits[c]}</span>
              <span class="digit-eff"></span>
            </div>
            ${tapHint}
          </div>
        </td>`;
    }
    html += '</tr>';

    // Subtrahend row
    html += '<tr><td class="td-sign">−</td>';
    toDigits(subtrahend, cols).forEach((d, c) => {
      const hidden = d === null ? 'style="visibility:hidden"' : '';
      html += `<td class="td-digit">
        <span class="digit" style="color:${colColor(c, cols)}" ${hidden}>${d ?? 0}</span>
      </td>`;
    });
    html += '</tr>';

    // Separator
    html += `<tr><td class="sep-td" colspan="${cols + 1}"></td></tr>`;

    // Result row
    html += '<tr><td></td>';
    for (let c = 0; c < cols; c++) {
      html += `<td class="td-result">
        <input class="result-inp" type="text" inputmode="numeric" maxlength="1"
               data-res="${c}" autocomplete="off"
               aria-label="Résultat ${colName(c, cols)}">
      </td>`;
    }
    html += '</tr>';

    t.innerHTML = html;
    updateMinuendDisplay();
    wireInputs();
    wireMinuendTaps();
  }

  // ── Borrow display update ──────────────────────────────────────────────────
  function updateMinuendDisplay() {
    const origDigits = toDigits(minuend, cols).map(d => d ?? 0);

    for (let c = 0; c < cols; c++) {
      const cell      = document.querySelector(`.td-minuend[data-col="${c}"]`);
      const plus10El  = cell.querySelector('.plus10-label');
      const origEl    = cell.querySelector('.digit-orig');
      const effEl     = cell.querySelector('.digit-eff');

      const receives  = c > 0 && gives[c - 1];
      const givesRight = c < cols - 1 && gives[c];
      const involved  = receives || givesRight;
      const eff       = effectiveDigit(origDigits, c);

      // "+10" label: shown when receiving a borrow
      plus10El.classList.toggle('visible', receives);

      // Only the giving column gets struck + effective value shown
      origEl.classList.toggle('struck', givesRight);

      if (givesRight) {
        effEl.textContent = effectiveDigit(origDigits, c);
        effEl.classList.add('visible');
      } else {
        effEl.textContent = '';
        effEl.classList.remove('visible');
      }

      // borrowed marker for tap-hint hide
      cell.classList.toggle('borrowed', givesRight);
    }
  }

  // ── Wire minuend taps ──────────────────────────────────────────────────────
  function wireMinuendTaps() {
    document.querySelectorAll('.td-minuend.tappable').forEach(cell => {
      const toggle = () => {
        const c = parseInt(cell.dataset.col);
        gives[c] = !gives[c];
        updateMinuendDisplay();
        resetVerification();
      };
      cell.addEventListener('click', toggle);
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }

  // ── Input wiring ───────────────────────────────────────────────────────────
  function wireInputs() {
    const resInps = [...document.querySelectorAll('.result-inp')];

    resInps.forEach((inp, i) => {
      inp.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g, '');
        e.target.value = v ? v[v.length - 1] : '';
        if (v && i > 0) resInps[i - 1].focus();
        resetVerification();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i < resInps.length - 1) {
          resInps[i + 1].focus();
        }
      });
    });

    resInps[resInps.length - 1]?.focus();
  }

  // ── Verify ─────────────────────────────────────────────────────────────────
  function verify() {
    isVerified = true;
    const diff = minuend - subtrahend;
    const expected = toDigits(diff, cols).map(d => d ?? 0);
    let allOk = true;
    const wrongCols = [];

    document.querySelectorAll('.result-inp').forEach((inp, i) => {
      const ok = inp.value !== '' && parseInt(inp.value) === expected[i];
      inp.classList.toggle('ok', ok);
      inp.classList.toggle('bad', !ok);
      if (!ok) { allOk = false; wrongCols.push(colName(i, cols)); }
    });

    const fb = document.getElementById('feedback');
    if (allOk) {
      fb.textContent = 'Bravo ! C\'est correct !';
      fb.className = 'feedback ok';
      playCorrect();
      launchConfetti();
    } else {
      fb.textContent = `Pas tout à fait. Vérifie les ${wrongCols.join(', ')}.`;
      fb.className = 'feedback bad';
      playIncorrect();
    }
  }

  function resetVerification() {
    if (!isVerified) return;
    isVerified = false;
    document.querySelectorAll('.result-inp').forEach(el => el.classList.remove('ok', 'bad'));
    document.getElementById('feedback').className = 'feedback';
  }

  // ── New exercise ───────────────────────────────────────────────────────────
  function newExercise() {
    isVerified = false;
    gives = [];
    document.getElementById('feedback').className = 'feedback';
    const [a, b] = generate(level);
    minuend = a;
    subtrahend = b;
    gives = new Array(cols).fill(false);
    buildTable();
  }

  // ── Event listeners ────────────────────────────────────────────────────────
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      level = parseInt(btn.dataset.level);
      newExercise();
    });
  });

  document.getElementById('btn-check').addEventListener('click', verify);
  document.getElementById('btn-next').addEventListener('click', newExercise);

  // ── Init ───────────────────────────────────────────────────────────────────
  newExercise();
</script>

<script src="feedbackUtils.js"></script>
</body>
</html>

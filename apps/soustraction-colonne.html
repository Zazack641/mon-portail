<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Soustraction en colonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-base.css">
  <style>
    :root {
      /* Couleur de branche (Mathématiques) — app-base.css l'utilise pour le
         header, les boutons primaires et le niveau actif. */
      --app-header-bg: #C0272D;
      /* Variables propres au rendu de la grille de calcul (conservées). */
      --white:     #ffffff;
      --text:      #1A2535;
      --muted:     #64748B;
      --border:    #E2E8F0;
    }

    /* ── Layout ── */
    .app-main {
      max-width: 560px;
      margin: 0 auto;
      padding: 22px 18px 56px;
    }

    /* Le sélecteur de niveau utilise .level-bar / .level-btn d'app-base.css. */

    /* ── Exercise card ── */
    .exercise-card {
      background: var(--white);
      border-radius: 18px;
      padding: 28px 20px 24px;
      border: 1px solid var(--border);
    }

    /* ── Calc table ── */
    .calc-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .calc-table { border-collapse: collapse; }

    /* Column headers */
    .th-sign { width: 52px; }
    .th-col {
      width: 72px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding-bottom: 10px;
    }

    /* ── Minuend interactive row ── */
    .td-minuend {
      text-align: center;
      padding: 0 6px;
      vertical-align: middle;
      height: 96px;
    }
    /* Tappable columns get a pointer and subtle active state */
    .td-minuend.tappable {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .td-minuend.tappable:active .minuend-wrap {
      opacity: 0.75;
      transform: scale(0.95);
    }
    .minuend-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: opacity 0.1s, transform 0.1s;
    }
    /* "+10" label shown when the column receives a borrow */
    .plus10-label {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--app-correct-fg);
      line-height: 1;
      min-height: 22px;
      visibility: hidden;
    }
    .plus10-label.visible { visibility: visible; }
    /* Original digit and effective value sit side by side */
    .digit-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
    }
    .digit-orig {
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      transition: color 0.15s, text-decoration 0.15s;
    }
    .digit-orig.struck {
      text-decoration: line-through;
      color: #CBD5E0 !important;
    }
    /* Effective value: hidden until borrow involved */
    .digit-eff {
      display: none;
      font-family: 'Nunito', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #D97706;
      line-height: 1;
    }
    .digit-eff.visible { display: block; }
    /* Subtle tap affordance on tappable columns with no active borrow */
    .td-minuend.tappable .tap-hint {
      font-size: 18px;
      color: #475569;
      line-height: 1;
      min-height: 20px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
    }
    .td-minuend.tappable.borrowed .tap-hint { display: none; }

    /* ── Subtrahend row ── */
    .td-sign {
      text-align: right;
      padding-right: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: var(--muted);
      vertical-align: middle;
      height: 60px;
    }
    .td-digit { text-align: center; padding: 2px 6px; height: 60px; vertical-align: middle; }
    .digit {
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      display: block;
    }

    /* Separator */
    .sep-td {
      border-top: 3px solid var(--text);
      padding-top: 6px;
      height: 0;
    }

    /* Result row */
    .td-result { text-align: center; padding: 8px 6px 0; position: relative; }
    .td-result.ok::after,
    .td-result.bad::after {
      position: absolute;
      top: 2px;
      right: 8px;
      font-size: 16px;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
    }
    .td-result.ok::after  { content: '✓'; color: var(--app-correct-fg); }
    .td-result.bad::after { content: '✗'; color: var(--app-wrong-fg); }
    .result-inp {
      width: 64px; height: 70px;
      border: 2.5px solid var(--border);
      border-radius: 10px;
      background: #F8FAFC;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      touch-action: manipulation;
      transition: border-color 0.15s, background 0.15s;
    }
    .result-inp:focus { background: #EBF3FC; border-color: var(--color-units); }

    /* Verification states */
    .result-inp.ok  { border-color: #3A9E6F; background: #E6F5F0; color: #0A6048; }
    .result-inp.bad { border-color: #D64045; background: #FEE8E8; color: #C0282C; }

    /* Feedback et boutons d'action : .feedback / .action-row / .verify-btn /
       .new-btn fournis par app-base.css. */

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .digit-orig, .td-sign { font-size: 36px; }
      .result-inp { width: 64px; height: 64px; font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>Soustraction en colonne</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1 · 2 chiffres</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2 · 3 chiffres</button>
  <button class="level-btn" data-level="3" aria-pressed="false">Niveau 3 · 1 emprunt</button>
  <button class="level-btn" data-level="4" aria-pressed="false">Niveau 4 · 2 emprunts</button>
</div>

<main class="app-main">

  <div class="exercise-card">
    <div class="question-box" id="question-box"></div>
    <div class="calc-wrap">
      <table class="calc-table" id="calc-table" aria-label="Grille de soustraction en colonne"></table>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="action-row">
      <button class="verify-btn" id="btn-check" disabled>Vérifier <span aria-hidden="true">✓</span></button>
      <button class="new-btn" id="btn-next"><span aria-hidden="true">▶</span> Nouvel exercice</button>
    </div>
  </div>

</main>

<script src="appUtils.js"></script>
<script>
  // ── State ──────────────────────────────────────────────────────────────────
  // 'instance' : une erreur est corrigeable — l'élève ajuste les emprunts/chiffres
  // et revérifie sur la même soustraction jusqu'à réussite (voir skills/design-portail).
  const TYPE_TACHE = 'instance';
  const questionBox = document.getElementById('question-box');
  const feedbackEl  = document.getElementById('feedback');
  const checkBtn    = document.getElementById('btn-check');
  const newBtn      = document.getElementById('btn-next');
  let level = 1;
  let minuend = 0;
  let subtrahend = 0;
  let cols = 2;
  let isVerified = false;
  // gives[c] = true → column c gives 1 to column c+1 (right, lower place value)
  let gives = [];

  // ── Helpers ────────────────────────────────────────────────────────────────
  const ri = randInt; // randInt (entier inclusif [a,b]) fourni par appUtils.js

  function toDigits(n, c) {
    const arr = String(n).split('').map(Number);
    while (arr.length < c) arr.unshift(null);
    return arr;
  }

  const PLACE_COLORS = ['var(--color-hundreds)', 'var(--color-tens)', 'var(--color-units)'];
  const PLACE_LABELS = ['C', 'D', 'U'];
  const PLACE_NAMES  = ['centaines', 'dizaines', 'unités'];

  function colColor(colIdx, totalCols) { return PLACE_COLORS[colIdx + (3 - totalCols)]; }
  function colLabel(colIdx, totalCols) { return PLACE_LABELS[colIdx + (3 - totalCols)]; }
  function colName(colIdx, totalCols)  { return PLACE_NAMES [colIdx + (3 - totalCols)]; }

  // Une colonne peut recevoir un tap d'emprunt à partir du niveau 3, sauf la
  // dernière (unités) qui ne peut jamais emprunter à une colonne à sa droite.
  function canBorrowCol(c) { return level >= 3 && c < cols - 1; }

  // Effective value for minuend column c given current borrows state.
  // receives borrow if gives[c-1]; gives borrow if gives[c].
  function effectiveDigit(origDigits, c) {
    const base = origDigits[c] ?? 0;
    const received = c > 0 && gives[c - 1] ? 10 : 0;
    const given    = c < cols - 1 && gives[c] ? 1 : 0;
    return base + received - given;
  }

  function updateInstructions() {
    questionBox.textContent = level >= 3
      ? 'Calcule chaque colonne. Touche un chiffre pour emprunter une dizaine.'
      : 'Calcule chaque colonne, de droite à gauche.';
  }

  function countBorrows(a, b, c) {
    const da = toDigits(a, c).map(d => d ?? 0);
    const db = toDigits(b, c).map(d => d ?? 0);
    let n = 0;
    for (let i = 0; i < c; i++) if (da[i] < db[i]) n++;
    return n;
  }

  // ── Number generation ──────────────────────────────────────────────────────
  function generate(lvl) {
    let a, b;

    if (lvl === 1) {
      do {
        a = ri(11, 99); b = ri(11, 99);
        if (a < b) [a, b] = [b, a];
      } while (
        (a % 10) < (b % 10) ||
        Math.floor(a / 10) < Math.floor(b / 10)
      );
      cols = 2;
      return [a, b];
    }

    if (lvl === 2) {
      // 50% chance: 3-digit minus 2-digit (e.g. 987 - 42), no borrow
      const mixed = Math.random() < 0.5;
      do {
        a = ri(111, 999);
        b = mixed ? ri(11, 99) : ri(111, 999);
        if (a < b) [a, b] = [b, a];
      } while (countBorrows(a, b, 3) > 0);
      cols = 3;
      return [a, b];
    }

    if (lvl === 3) {
      // 2-digit numbers only, exactly 1 borrow (units column)
      do {
        a = ri(21, 99); b = ri(11, 89);
        if (a < b) [a, b] = [b, a];
      } while (a === b || (a % 10) >= (b % 10));
      cols = 2;
      return [a, b];
    }

    // lvl 4: 3-digit minus 2-or-3-digit, at least two borrows
    // 50% chance: 3-digit minus 2-digit
    const mixed = Math.random() < 0.5;
    do {
      a = ri(200, 999);
      b = mixed ? ri(11, 99) : ri(11, 999);
      if (a < b) [a, b] = [b, a];
    } while (a === b || countBorrows(a, b, 3) < 2);
    cols = 3;
    return [a, b];
  }

  // ── Build table ────────────────────────────────────────────────────────────
  function buildTable() {
    const t = document.getElementById('calc-table');
    let html = '';

    // Header row
    html += '<tr><th class="th-sign"></th>';
    for (let c = 0; c < cols; c++) {
      html += `<th class="th-col" style="color:${colColor(c, cols)}">${colLabel(c, cols)}</th>`;
    }
    html += '</tr>';

    // Minuend row: interactive cells (all but the last column are tappable)
    const origDigits = toDigits(minuend, cols).map(d => d ?? 0);
    html += '<tr><td class="td-sign"></td>';
    for (let c = 0; c < cols; c++) {
      const canBorrow = canBorrowCol(c);
      const tappable = canBorrow ? 'tappable' : '';
      const tapHint  = canBorrow ? '<span class="tap-hint">tap ✎</span>' : '';
      html += `
        <td class="td-minuend ${tappable}" data-col="${c}"
            ${canBorrow ? `role="button" tabindex="0" aria-pressed="false"` : ''}>
          <div class="minuend-wrap">
            <span class="plus10-label">+10</span>
            <div class="digit-row">
              <span class="digit-orig" style="color:${colColor(c, cols)}">${origDigits[c]}</span>
              <span class="digit-eff"></span>
            </div>
            ${tapHint}
          </div>
        </td>`;
    }
    html += '</tr>';

    // Subtrahend row
    html += '<tr><td class="td-sign">−</td>';
    toDigits(subtrahend, cols).forEach((d, c) => {
      const hidden = d === null ? 'style="visibility:hidden"' : '';
      html += `<td class="td-digit">
        <span class="digit" style="color:${colColor(c, cols)}" ${hidden}>${d ?? 0}</span>
      </td>`;
    });
    html += '</tr>';

    // Separator
    html += `<tr><td class="sep-td" colspan="${cols + 1}"></td></tr>`;

    // Result row
    html += '<tr><td></td>';
    for (let c = 0; c < cols; c++) {
      html += `<td class="td-result">
        <input class="result-inp" type="text" inputmode="numeric" maxlength="1"
               data-res="${c}" autocomplete="off"
               aria-label="Résultat ${colName(c, cols)}">
      </td>`;
    }
    html += '</tr>';

    t.innerHTML = html;
    updateMinuendDisplay();
    wireInputs();
    wireMinuendTaps();
  }

  // ── Borrow display update ──────────────────────────────────────────────────
  function updateMinuendDisplay() {
    const origDigits = toDigits(minuend, cols).map(d => d ?? 0);

    for (let c = 0; c < cols; c++) {
      const cell      = document.querySelector(`.td-minuend[data-col="${c}"]`);
      const plus10El  = cell.querySelector('.plus10-label');
      const origEl    = cell.querySelector('.digit-orig');
      const effEl     = cell.querySelector('.digit-eff');

      const receives  = c > 0 && gives[c - 1];
      const givesRight = c < cols - 1 && gives[c];
      const involved  = receives || givesRight;
      const eff       = effectiveDigit(origDigits, c);
      const canBorrow = canBorrowCol(c);

      // "+10" label: shown when receiving a borrow
      plus10El.classList.toggle('visible', receives);

      // Only the giving column gets struck + effective value shown
      origEl.classList.toggle('struck', givesRight);

      if (givesRight) {
        effEl.textContent = eff;
        effEl.classList.add('visible');
      } else {
        effEl.textContent = '';
        effEl.classList.remove('visible');
      }

      // borrowed marker for tap-hint hide
      cell.classList.toggle('borrowed', givesRight);

      // État accessible du bouton d'emprunt : reflète l'emprunt actif et sa valeur.
      if (canBorrow) {
        cell.setAttribute('aria-pressed', String(givesRight));
        cell.setAttribute('aria-label',
          `Emprunt ${colName(c, cols)}, chiffre ${origDigits[c]}` +
          (givesRight ? `, emprunt actif, valeur actuelle ${eff}` : ''));
      }
    }
  }

  // ── Wire minuend taps ──────────────────────────────────────────────────────
  function wireMinuendTaps() {
    document.querySelectorAll('.td-minuend.tappable').forEach(cell => {
      const toggle = () => {
        const c = parseInt(cell.dataset.col);
        gives[c] = !gives[c];
        updateMinuendDisplay();
        resetVerification();
      };
      cell.addEventListener('click', toggle);
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }

  // ── Input wiring ───────────────────────────────────────────────────────────
  function updateCheckState() {
    const allFilled = [...document.querySelectorAll('.result-inp')].every(el => el.value !== '');
    checkBtn.disabled = !allFilled;
  }

  // État "en cours de résolution" : verify-btn visible (dés/activé selon le
  // remplissage), new-btn caché. Utilisé après une remise à zéro ou une
  // réponse incorrecte sur une tâche 'instance'.
  function resetButtons() {
    checkBtn.style.display = '';
    updateCheckState();
    newBtn.classList.remove('visible');
  }

  function wireInputs() {
    const resInps = [...document.querySelectorAll('.result-inp')];

    resInps.forEach((inp, i) => {
      inp.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g, '');
        e.target.value = v ? v[v.length - 1] : '';
        if (v && i > 0) resInps[i - 1].focus();
        resetVerification();
        updateCheckState();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i < resInps.length - 1) {
          resInps[i + 1].focus();
        }
      });
    });

    updateCheckState();
    resInps[resInps.length - 1]?.focus();
  }

  // ── Feedback ───────────────────────────────────────────────────────────────
  // Point unique d'appel des feedbackUtils ; branche sur TYPE_TACHE (voir
  // skills/design-portail/SKILL.md « Type de tâche »).
  function showFeedback(correct, msg) {
    feedbackEl.textContent = msg;
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }

    if (correct || TYPE_TACHE === 'drill') {
      // Item réussi : on propose la suite.
      checkBtn.style.display = 'none';
      checkBtn.disabled = true;
      newBtn.classList.add('visible');
      newBtn.focus();
    } else {
      // 'instance' + incorrect : l'élève corrige les chiffres/emprunts et
      // revérifie la même soustraction — aucun bouton d'action suivante.
      resetButtons();
      feedbackEl.setAttribute('tabindex', '-1');
      feedbackEl.focus();
    }
  }

  // ── Verify ─────────────────────────────────────────────────────────────────
  function verify() {
    isVerified = true;
    const diff = minuend - subtrahend;
    const expected = toDigits(diff, cols).map(d => d ?? 0);
    let allOk = true;
    const wrongCols = [];

    document.querySelectorAll('.result-inp').forEach((inp, i) => {
      const ok = inp.value !== '' && parseInt(inp.value) === expected[i];
      inp.classList.toggle('ok', ok);
      inp.classList.toggle('bad', !ok);
      inp.setAttribute('aria-invalid', String(!ok));
      const td = inp.closest('.td-result');
      td.classList.toggle('ok', ok);
      td.classList.toggle('bad', !ok);
      if (!ok) { allOk = false; wrongCols.push(colName(i, cols)); }
    });

    const msg = allOk
      ? 'Bravo ! C\'est correct !'
      : `Pas tout à fait. Vérifie les ${wrongCols.join(', ')}.`;
    showFeedback(allOk, msg);
  }

  function resetVerification() {
    if (!isVerified) return;
    isVerified = false;
    document.querySelectorAll('.result-inp').forEach(el => { el.classList.remove('ok', 'bad'); el.removeAttribute('aria-invalid'); });
    document.querySelectorAll('.td-result').forEach(el => el.classList.remove('ok', 'bad'));
    feedbackEl.className = 'feedback';
    feedbackEl.removeAttribute('tabindex');
    resetButtons();
  }

  // ── New exercise ───────────────────────────────────────────────────────────
  function newExercise() {
    isVerified = false;
    gives = [];
    feedbackEl.className = 'feedback';
    feedbackEl.removeAttribute('tabindex');
    resetButtons();
    updateInstructions();
    const [a, b] = generate(level);
    minuend = a;
    subtrahend = b;
    gives = new Array(cols).fill(false);
    buildTable();
  }

  // ── Event listeners ────────────────────────────────────────────────────────
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      level = parseInt(btn.dataset.level);
      newExercise();
    });
  });

  checkBtn.addEventListener('click', verify);
  newBtn.addEventListener('click', newExercise);

  // ── Init ───────────────────────────────────────────────────────────────────
  newExercise();
</script>

<script src="feedbackUtils.js"></script>
</body>
</html>

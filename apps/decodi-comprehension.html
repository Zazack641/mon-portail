<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Compréhension DéCoDi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  :root {
    --app-header-bg: #7A6200;
  }

  /* ── Views & phases ─────────────────────────────────────────────────────── */
  .vue   { display: none; width: 100%; }
  .phase { display: none; width: 100%; }
  .vue.active   { display: flex; flex-direction: column; gap: 20px; }
  .phase.active { display: flex; flex-direction: column; gap: 20px; }

  /* ── Vue 1 — Sélection du module ────────────────────────────────────────── */
  .vue-intro {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 3.5vw, 22px);
    font-weight: 800;
    color: var(--app-text);
  }
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    width: 100%;
  }
  .module-btn {
    padding: 20px 12px;
    background: #fff;
    border: 2px solid var(--app-border);
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--app-text);
    cursor: pointer;
    min-height: 72px;
    touch-action: manipulation;
    -webkit-appearance: none;
    text-align: center;
  }
  .module-btn:hover { background: #FBF5D6; border-color: #7A6200; }
  .module-btn:focus-visible { outline: 3px solid var(--app-header-bg); outline-offset: 3px; border-radius: 14px; }

  /* ── Vue 2 — Sélection du texte ─────────────────────────────────────────── */
  .vue-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .back-nav-btn {
    padding: 10px 18px;
    background: #F1F5F9;
    border: 1.5px solid var(--app-border);
    border-radius: 10px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #475569;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    white-space: nowrap;
  }
  .back-nav-btn:hover { background: #E2E8F0; }
  .back-nav-btn:focus-visible { outline: 3px solid var(--app-header-bg); outline-offset: 3px; border-radius: 10px; }
  .vue-titre {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 3vw, 19px);
    font-weight: 800;
    color: var(--app-text);
  }
  .textes-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .texte-btn {
    width: 100%;
    padding: 18px 22px;
    background: #fff;
    border: 2px solid var(--app-border);
    border-radius: 14px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--app-text);
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    text-align: left;
  }
  .texte-btn:hover { background: #FBF5D6; border-color: #7A6200; }
  .texte-btn:focus-visible { outline: 3px solid var(--app-header-bg); outline-offset: 3px; border-radius: 14px; }

  /* ── Phase 1 — Lecture ──────────────────────────────────────────────────── */
  .text-card {
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
  }
  .text-titre {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 4vw, 26px);
    font-weight: 900;
    color: #7A6200;
    margin-bottom: 16px;
  }
  .text-body {
    font-size: 18px;
    line-height: 1.85;
    color: var(--app-text);
    white-space: pre-line;
  }
  .primary-btn {
    padding: 18px 32px;
    background: #7A6200;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    align-self: center;
  }
  .primary-btn:hover { background: #5B4800; }
  .primary-btn:focus-visible { outline: 3px solid rgba(255,255,255,0.9); outline-offset: 3px; }
  .secondary-btn {
    padding: 18px 32px;
    background: #1A3A5C;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    align-self: center;
  }
  .secondary-btn:hover { background: #253F63; }
  .secondary-btn:focus-visible { outline: 3px solid rgba(255,255,255,0.9); outline-offset: 3px; }

  /* ── Phase 2 — Questions ────────────────────────────────────────────────── */
  .q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 12px;
  }
  .q-counter {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #64748B;
    white-space: nowrap;
  }

  /* Accordéon "Revoir le texte" */
  .accordion {
    width: 100%;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }
  .accordion-btn {
    width: 100%;
    padding: 14px 20px;
    background: #F8FAFC;
    border: none;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #475569;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .accordion-btn:hover { background: #F1F5F9; }
  .accordion-btn:focus-visible { outline: 3px solid var(--app-header-bg); outline-offset: -3px; }
  .accordion-btn .chevron { font-style: normal; }
  .accordion-btn[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .accordion-body {
    display: none;
    padding: 16px 20px;
    border-top: 1px solid var(--app-border);
  }
  .accordion-body.open { display: block; }
  .accordion-body-text {
    font-size: 18px;
    line-height: 1.8;
    color: var(--app-text);
    white-space: pre-line;
  }

  /* Carte question */
  .question-card {
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
  }
  .q-type-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 700;
    align-self: flex-start;
  }
  .q-type-badge.explicite { background: #DBEAFE; color: #1E40AF; }
  .q-type-badge.implicite { background: #EDE9FE; color: #5B21B6; }
  .q-type-badge.opinion   { background: #FEF3C7; color: #92400E; }
  .q-text {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 3.5vw, 20px);
    font-weight: 800;
    color: var(--app-text);
    line-height: 1.4;
  }

  /* Boutons QCM */
  .answer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .answer-btn {
    width: 100%;
    padding: 16px 20px;
    background: #F8FAFC;
    border: 2px solid var(--app-border);
    border-radius: 12px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--app-text);
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    text-align: left;
    line-height: 1.4;
  }
  .answer-btn:not(:disabled):hover { background: #FBF5D6; border-color: #7A6200; }
  .answer-btn.correct  { background: var(--app-correct-bg); border-color: #10B981; color: var(--app-correct-fg); font-weight: 700; }
  .answer-btn.wrong    { background: var(--app-wrong-bg);   border-color: #EF4444; color: var(--app-wrong-fg); }
  .answer-btn:disabled { cursor: default; }
  .answer-btn:focus-visible { outline: 3px solid var(--app-header-bg); outline-offset: 3px; }

  /* Feedback QCM */
  .q-feedback {
    padding: 12px 16px;
    border-radius: 10px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
    display: none;
  }
  .q-feedback.correct { background: var(--app-correct-bg); color: var(--app-correct-fg); display: block; }
  .q-feedback.wrong   { background: var(--app-wrong-bg);   color: var(--app-wrong-fg);   display: block; }

  /* Zone opinion */
  .opinion-zone {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .opinion-zone.visible { display: flex; }
  .opinion-zone textarea {
    width: 100%;
    min-height: 100px;
    padding: 14px 16px;
    border: 2px solid var(--app-border);
    border-radius: 12px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    color: var(--app-text);
    resize: vertical;
    -webkit-appearance: none;
    outline: none;
    line-height: 1.5;
    background: #F8FAFC;
  }
  .opinion-zone textarea:focus { border-color: #7A6200; background: #fff; outline: 3px solid #7A6200; outline-offset: 2px; }
  .see-ex-btn {
    padding: 14px 24px;
    background: #7A6200;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    align-self: flex-start;
  }
  .see-ex-btn:hover:not(:disabled) { background: #5B4800; }
  .see-ex-btn:disabled { background: #94A3B8; cursor: default; }
  .see-ex-btn:focus-visible { outline: 3px solid rgba(255,255,255,0.9); outline-offset: 3px; }
  .opinion-ex {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: #EFF6FF;
    border: 1.5px solid #BFDBFE;
    border-radius: 12px;
    padding: 16px 20px;
  }
  .opinion-ex.visible { display: flex; }
  .opinion-ex-label {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #1E40AF;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .opinion-ex-text {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    color: #1E40AF;
    line-height: 1.6;
  }

  /* Bouton suivant */
  .next-q-btn {
    padding: 14px 28px;
    background: #0F7860;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    align-self: flex-end;
    display: none;
  }
  .next-q-btn.visible { display: block; }
  .next-q-btn:hover { background: #0A5C48; }
  .next-q-btn:focus-visible { outline: 3px solid rgba(255,255,255,0.9); outline-offset: 3px; }

  /* ── Phase 3 — Résultat ─────────────────────────────────────────────────── */
  .result-card {
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 16px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
    width: 100%;
  }
  .result-emoji { font-size: 64px; line-height: 1; }
  .result-msg {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 3.5vw, 21px);
    font-weight: 800;
    color: var(--app-text);
    line-height: 1.5;
  }
  .result-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    .module-btn  { transition: all 0.15s; }
    .texte-btn   { transition: all 0.15s; }
    .primary-btn { transition: all 0.15s; }
    .secondary-btn { transition: all 0.15s; }
    .answer-btn  { transition: all 0.15s; }
    .see-ex-btn  { transition: all 0.15s; }
    .next-q-btn  { transition: all 0.15s; }
    .accordion-btn .chevron { transition: transform 0.2s; }
    .module-btn:active  { transform: scale(0.97); }
    .texte-btn:active   { transform: scale(0.99); }
    .primary-btn:active { transform: scale(0.98); }
    .answer-btn:not(:disabled):active { transform: scale(0.99); }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>📖 Compréhension DéCoDi</h1>
  <div class="header-spacer"></div>
</header>

<main>

  <!-- ── Vue 1 : Sélection du module ──────────────────────────────────────── -->
  <div id="vue-modules" class="vue active">
    <p class="vue-intro">Choisis un module :</p>
    <div class="modules-grid">
      <button class="module-btn" data-module="Module 6">Module 6</button>
      <button class="module-btn" data-module="Module 7">Module 7</button>
      <button class="module-btn" data-module="Module 8">Module 8</button>
      <button class="module-btn" data-module="Module 9">Module 9</button>
      <button class="module-btn" data-module="Module 10">Module 10</button>
      <button class="module-btn" data-module="Module 11">Module 11</button>
      <button class="module-btn" data-module="Module 12">Module 12</button>
      <button class="module-btn" data-module="Module 13">Module 13</button>
      <button class="module-btn" data-module="Module 14">Module 14</button>
      <button class="module-btn" data-module="Module 15">Module 15</button>
    </div>
  </div>

  <!-- ── Vue 2 : Sélection du texte ──────────────────────────────────────── -->
  <div id="vue-textes" class="vue">
    <div class="vue-nav">
      <button class="back-nav-btn" id="back-to-modules">← Modules</button>
      <span class="vue-titre" id="textes-titre"></span>
    </div>
    <div class="textes-list" id="textes-list"></div>
  </div>

  <!-- ── Vue 3 : Lecture et questionnaire ────────────────────────────────── -->
  <div id="vue-lecture" class="vue">

    <!-- Phase 1 : Lecture -->
    <div id="phase-read" class="phase">
      <div class="text-card">
        <div class="text-titre" id="read-titre"></div>
        <div class="text-body" id="read-body"></div>
      </div>
      <button class="primary-btn" id="start-questions-btn">J'ai lu, commencer les questions →</button>
    </div>

    <!-- Phase 2 : Questions -->
    <div id="phase-questions" class="phase">
      <div class="q-header">
        <button class="back-nav-btn" id="back-to-textes">← Textes</button>
        <span class="q-counter" id="q-counter">Question 1 / 3</span>
      </div>

      <div class="accordion">
        <button class="accordion-btn" id="accordion-btn" aria-expanded="false">
          <span>Revoir le texte</span>
          <span class="chevron" aria-hidden="true">▼</span>
        </button>
        <div class="accordion-body" id="accordion-body">
          <div class="accordion-body-text" id="accordion-text"></div>
        </div>
      </div>

      <div class="question-card">
        <span class="q-type-badge" id="q-type-badge"></span>
        <p class="q-text" id="q-text"></p>

        <!-- Choix QCM -->
        <div class="answer-list" id="answer-list"></div>

        <!-- Zone opinion -->
        <div class="opinion-zone" id="opinion-zone">
          <textarea id="opinion-ta" rows="4" autocorrect="off" spellcheck="false"
            placeholder="Écris ta réponse ici…" aria-label="Ta réponse"></textarea>
          <button class="see-ex-btn" id="see-ex-btn" disabled>Voir un exemple</button>
          <div class="opinion-ex" id="opinion-ex">
            <p class="opinion-ex-label">Il n'y a pas de réponse unique. Voici un exemple :</p>
            <p class="opinion-ex-text" id="opinion-ex-text"></p>
          </div>
        </div>

        <!-- Feedback QCM -->
        <div class="q-feedback" id="q-feedback" role="status" aria-live="polite" aria-atomic="true"></div>

        <!-- Bouton suivant -->
        <button class="next-q-btn" id="next-q-btn">Question suivante →</button>
      </div>
    </div>

    <!-- Phase 3 : Résultat -->
    <div id="phase-result" class="phase">
      <div class="result-card">
        <span class="result-emoji" id="result-emoji">🎉</span>
        <p class="result-msg" id="result-msg"></p>
        <div class="result-actions">
          <button class="primary-btn" id="btn-autre-texte">Choisir un autre texte</button>
          <button class="secondary-btn" id="btn-autre-module">Choisir un autre module</button>
        </div>
      </div>
    </div>

  </div><!-- /vue-lecture -->

</main>

<script src="appUtils.js"></script>
<script>
// ── Données ─────────────────────────────────────────────────────────────────
const DECODI_TEXTS = {
  "Module 6": [
    {
      id: "m6t1",
      titre: "La chasse",
      texte: `C'est la chasse. Abritée dans un fossé, une biche a la frousse. Ouf ! L'homme qui la chasse est passé et ne l'a pas vue.\nLe chat de Mélissa est assis. Il a une jolie fourrure rousse. Mélissa brosse et lisse sa fourrure.\nMélissa se lave. Il y a de la mousse partout !\nMélissa chute, elle a une bosse. Son papa la rassure : « Les bosses passent vite ! »`,
      questions: [
        { type: "explicite", question: "Pourquoi la biche a-t-elle la frousse ?", choix: ["Elle est tombée dans un fossé", "Un homme la chasse", "Elle a une bosse", "Le chat l'a effrayée"], reponse: 1 },
        { type: "implicite", question: "Que fait le papa de Mélissa quand elle tombe ?", choix: ["Il la gronde", "Il appelle le médecin", "Il lui dit que ça va aller", "Il la brosse"], reponse: 2 }
      ]
    },
    {
      id: "m6t2",
      titre: "Nabil",
      texte: `Nabil prépare une tarte avec des fruits. Dans une bassine il y a de la farine. Nabil ajoute des pommes et des prunes. Il tourne le tout. A-t-il fini ?\nNabil a passé une bonne journée : il a vu ses amis, il a joué et il a eu une bonne note !\nNabil a une mine maline. Son papa s'est tourné et il a pris son journal et sa tartine !`,
      questions: [
        { type: "explicite", question: "Quels fruits Nabil met-il dans sa tarte ?", choix: ["Des fraises et des bananes", "Des pommes et des prunes", "Des prunes et des fraises", "Des pommes et des abricots"], reponse: 1 },
        { type: "explicite", question: "Pourquoi Nabil a-t-il passé une bonne journée ?", choix: ["Il a préparé une tarte", "Il a vu ses amis, joué et eu une bonne note", "Il a mangé une tartine avec son papa", "Il a trouvé un journal"], reponse: 1 },
        { type: "implicite", question: "Que veut dire « avoir une mine maline » ?", choix: ["Avoir l'air fatigué", "Avoir l'air triste", "Avoir l'air espiègle", "Avoir l'air malade"], reponse: 2 }
      ]
    },
    {
      id: "m6t3",
      titre: "La chèvre",
      texte: `La chèvre vit dans une étable. Elle est matinale : elle se lève avec la lumière du jour. Elle se promène dans les prés et elle broute des trèfles. Après sa journée, elle va dans son étable.\nNoël arrive ! Avec son frère, Maëlle a mis les lumières et les boules sur l'arbre de Noël. Elle est fière : il est très joli ! Tout est prêt pour la fête !`,
      questions: [
        { type: "explicite", question: "Que mange la chèvre dans les prés ?", choix: ["De l'herbe et des fleurs", "Des trèfles", "Des pommes", "De la farine"], reponse: 1 },
        { type: "explicite", question: "Qu'est-ce que Maëlle a fait avec son frère ?", choix: ["Ils ont préparé un repas de Noël", "Ils ont décoré l'arbre de Noël", "Ils ont acheté des cadeaux", "Ils ont allumé des bougies"], reponse: 1 },
        { type: "implicite", question: "Pourquoi dit-on que la chèvre est « matinale » ?", choix: ["Elle se lève tard le matin", "Elle se lève tôt, dès que le jour se lève", "Elle mange le matin uniquement", "Elle rentre dans son étable le matin"], reponse: 1 }
      ]
    }
  ],
  "Module 7": [
    {
      id: "m7t1",
      titre: "Les sportifs",
      texte: `Les sportifs se préparent toujours pour leurs matchs. Ils utilisent des pistes et des salles de sport pour être prêts. Après les matchs, les journalistes parlent avec les sportifs les plus réputés. Mais pas de méprise, même s'ils sourient, ils sont épuisés !`,
      questions: [
        { type: "explicite", question: "Où s'entraînent les sportifs ?", choix: ["Dans des parcs et des forêts", "Dans des pistes et des salles de sport", "Dans des stades uniquement", "Chez eux"], reponse: 1 },
        { type: "explicite", question: "Avec qui les journalistes parlent-ils après les matchs ?", choix: ["Avec tous les sportifs", "Avec les entraîneurs", "Avec les sportifs les plus réputés", "Avec le public"], reponse: 2 },
        { type: "implicite", question: "Pourquoi précise-t-on « pas de méprise » quand les sportifs sourient ?", choix: ["Parce qu'ils sont contents d'avoir perdu", "Parce qu'ils sourient mais sont en réalité épuisés", "Parce qu'ils font semblant d'être fatigués", "Parce qu'ils n'aiment pas les journalistes"], reponse: 1 }
      ]
    },
    {
      id: "m7t2",
      titre: "Les pirates",
      texte: `Un pirate, c'est rusé. Les pirates arrivent par surprise et poursuivent des navires. Ils volent leurs sous. Ils s'arment de fusils ou de sabres. Ils posent dans des valises les trésors volés et fuient avec leurs navires.`,

        { type: "implicite", question: "Que veut dire « Léonard devint plus habile que son maître » ?", choix: ["Que Léonard est devenu professeur à son tour", "Que Léonard a dépassé en talent celui qui lui enseignait", "Que Léonard n'avait plus besoin d'apprendre", "Que le maître est parti à la retraite"], reponse: 1 },

        { type: "explicite", question: "Combien de temps vit une abeille ordinaire ?", choix: ["Environ 3 semaines", "Environ 7 semaines", "Environ 6 mois", "Environ 1 an"], reponse: 1 },

        { type: "explicite", question: "Qui a inventé le premier vaccin et contre quelle maladie ?", choix: ["Alexander Graham Bell, contre la grippe", "Edward Jenner, contre la variole", "John Baird, contre la variole", "Clément Ader, contre la peste"], reponse: 1 },
        { type: "explicite", question: "En quelle année le téléphone a-t-il été inventé ?", choix: ["1796", "1856", "1876", "1926"], reponse: 2 },
        { type: "implicite", question: "Pourquoi les premiers vols en avion étaient-ils impressionnants malgré leur courte distance ?", choix: ["Parce que personne n'avait jamais essayé avant et que c'était très dangereux", "Parce que les avions volaient très haut", "Parce que les pilotes étaient très jeunes", "Parce que les avions allaient très vite"], reponse: 0 },
        { type: "opinion", question: "Quelle invention citée dans le texte te semble la plus importante pour l'humanité ? Explique pourquoi.", exemple: "Je pense que le vaccin est l'invention la plus importante car il a permis de sauver des millions de vies en protégeant les gens contre des maladies mortelles." }
      ]

// QCM : l'erreur clôt la question (pas de retry). Questions d'opinion : logique propre (production libre).
const TYPE_TACHE = 'drill';

// ── État ─────────────────────────────────────────────────────────────────────
let currentModule = null;
let currentText   = null;
let currentQIdx   = 0;
let score         = 0;
let qcmTotal      = 0;

// ── Références DOM ────────────────────────────────────────────────────────────
const vueModules  = document.getElementById('vue-modules');
const vueTextes   = document.getElementById('vue-textes');
const vueLecture  = document.getElementById('vue-lecture');
const phaseRead   = document.getElementById('phase-read');
const phaseQuest  = document.getElementById('phase-questions');
const phaseResult = document.getElementById('phase-result');

// ── Navigation entre vues ─────────────────────────────────────────────────────
function showVue(id) {
  [vueModules, vueTextes, vueLecture].forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showPhase(id) {
  [phaseRead, phaseQuest, phaseResult].forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── Vue 1 : sélection du module ───────────────────────────────────────────────
document.querySelectorAll('.module-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentModule = btn.dataset.module;
    loadModuleTextes(currentModule);
  });
});

// ── Vue 2 : sélection du texte ────────────────────────────────────────────────
function loadModuleTextes(moduleKey) {
  document.getElementById('textes-titre').textContent = moduleKey;
  const list = document.getElementById('textes-list');
  list.innerHTML = '';
  DECODI_TEXTS[moduleKey].forEach(texte => {
    const btn = document.createElement('button');
    btn.className = 'texte-btn';
    btn.textContent = texte.titre;
    btn.addEventListener('click', () => startText(texte));
    list.appendChild(btn);
  });
  showVue('vue-textes');
  const firstTexte = list.querySelector('.texte-btn');
  if (firstTexte) firstTexte.focus();
}

document.getElementById('back-to-modules').addEventListener('click', () => {
  showVue('vue-modules');
  document.querySelector('.module-btn').focus();
});

// ── Vue 3, Phase 1 : lecture ──────────────────────────────────────────────────
function startText(texte) {
  currentText = texte;
  currentQIdx = 0;
  score       = 0;
  qcmTotal    = texte.questions.filter(q => q.type !== 'opinion').length;

  document.getElementById('read-titre').textContent = texte.titre;
  document.getElementById('read-body').textContent  = texte.texte;
  document.getElementById('accordion-text').textContent = texte.texte;

  showVue('vue-lecture');
  showPhase('phase-read');
}

document.getElementById('start-questions-btn').addEventListener('click', () => {
  showPhase('phase-questions');
  renderQuestion();
});

// ── Vue 3, Phase 2 : questions ────────────────────────────────────────────────
document.getElementById('back-to-textes').addEventListener('click', () => {
  loadModuleTextes(currentModule);
  // focus géré dans loadModuleTextes()
});

// Accordéon
document.getElementById('accordion-btn').addEventListener('click', function () {
  const body   = document.getElementById('accordion-body');
  const isOpen = body.classList.toggle('open');
  this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
});

function renderQuestion() {
  const q     = currentText.questions[currentQIdx];
  const total = currentText.questions.length;

  // Compteur
  document.getElementById('q-counter').textContent = `Question ${currentQIdx + 1} / ${total}`;

  // Fermer l'accordéon
  document.getElementById('accordion-body').classList.remove('open');
  document.getElementById('accordion-btn').setAttribute('aria-expanded', 'false');

  // Badge type
  const badge = document.getElementById('q-type-badge');
  const labels = { explicite: 'Explicite', implicite: 'Implicite', opinion: 'Mon avis' };
  badge.textContent = labels[q.type] || q.type;
  badge.className   = 'q-type-badge ' + q.type;

  // Texte de la question
  document.getElementById('q-text').textContent = q.question;

  // Réinitialiser feedback et bouton suivant
  const feedbackEl = document.getElementById('q-feedback');
  feedbackEl.className = 'q-feedback';
  feedbackEl.textContent = '';

  const nextBtn = document.getElementById('next-q-btn');
  nextBtn.classList.remove('visible');

  if (q.type === 'opinion') {
    // Afficher la zone opinion, masquer QCM
    document.getElementById('answer-list').style.display = 'none';
    const zone = document.getElementById('opinion-zone');
    zone.classList.add('visible');

    const ta = document.getElementById('opinion-ta');
    ta.value = '';

    const seeBtn = document.getElementById('see-ex-btn');
    seeBtn.disabled = true;

    const exDiv = document.getElementById('opinion-ex');
    exDiv.classList.remove('visible');
    document.getElementById('opinion-ex-text').textContent = q.exemple || '';

    ta.focus();
  } else {
    // Afficher QCM, masquer opinion
    document.getElementById('opinion-zone').classList.remove('visible');
    const answerList = document.getElementById('answer-list');
    answerList.style.display = 'flex';
    answerList.innerHTML = '';

    q.choix.forEach((choix, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = choix;
      btn.addEventListener('click', () => handleQCMAnswer(i, btn, q));
      answerList.appendChild(btn);
    });

    const firstBtn = answerList.querySelector('.answer-btn');
    if (firstBtn) firstBtn.focus();
  }
}

function handleQCMAnswer(idx, btn, q) {
  // Désactiver tous les boutons, colorier correct/wrong
  document.querySelectorAll('.answer-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.reponse) b.classList.add('correct');
    else if (b === btn)  b.classList.add('wrong');
  });

  const correct = (idx === q.reponse);
  if (correct) {
    score++;
    playCorrect();
    launchConfetti();
  } else {
    playIncorrect();
  }

  const feedbackEl = document.getElementById('q-feedback');
  if (correct) {
    feedbackEl.className = 'q-feedback correct';
    feedbackEl.textContent = '✓ Bonne réponse ! Appuie sur le bouton pour continuer.';
  } else {
    feedbackEl.className = 'q-feedback wrong';
    feedbackEl.textContent = `La bonne réponse était : « ${q.choix[q.reponse]} ». Appuie sur le bouton pour continuer.`;
  }

  showNextBtn();
  document.getElementById('next-q-btn').focus();
}

// Opinion : activer "Voir un exemple" dès que le textarea est rempli
document.getElementById('opinion-ta').addEventListener('input', function () {
  document.getElementById('see-ex-btn').disabled = (this.value.trim() === '');
});

document.getElementById('see-ex-btn').addEventListener('click', function () {
  this.disabled = true;
  document.getElementById('opinion-ex').classList.add('visible');
  showNextBtn();
  document.getElementById('next-q-btn').focus();
});

function showNextBtn() {
  const nextBtn = document.getElementById('next-q-btn');
  const isLast  = (currentQIdx >= currentText.questions.length - 1);
  nextBtn.textContent = isLast ? 'Voir mes résultats →' : 'Question suivante →';
  nextBtn.classList.add('visible');
}

document.getElementById('next-q-btn').addEventListener('click', () => {
  currentQIdx++;
  if (currentQIdx >= currentText.questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
});

// ── Vue 3, Phase 3 : résultat ─────────────────────────────────────────────────
function showResult() {
  const msgEl = document.getElementById('result-msg');
  const emoji = document.getElementById('result-emoji');

  if (qcmTotal > 0) {
    const noun = qcmTotal === 1 ? 'question' : 'questions';
    msgEl.textContent = `Tu as répondu correctement à ${score} ${noun} sur ${qcmTotal}.`;
    emoji.textContent = (score === qcmTotal) ? '🏆' : (score >= qcmTotal / 2) ? '👍' : '📖';
  } else {
    msgEl.textContent = 'Tu as terminé toutes les questions !';
    emoji.textContent = '🎉';
  }

  showPhase('phase-result');
  document.getElementById('btn-autre-texte').focus();
}

document.getElementById('btn-autre-texte').addEventListener('click', () => {
  loadModuleTextes(currentModule);
});

document.getElementById('btn-autre-module').addEventListener('click', () => {
  showVue('vue-modules');
  document.querySelector('.module-btn').focus();
});
</script>
<script src="feedbackUtils.js"></script>
</body>

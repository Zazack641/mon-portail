<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Place le nombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  :root {
    --color-units:    #3B7DD8;
    --color-tens:     #D64045;
    --color-hundreds: #3A9E6F;
    --app-header-bg:  #C0272D; /* branche Mathématiques */
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 28px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
  }

  /* Number to place — big colored display */
  .target-number {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(52px, 12vw, 80px);
    font-weight: 900;
    line-height: 1;
    display: flex;
    gap: 2px;
    align-items: baseline;
    justify-content: center;
  }

  /* Numberline canvas */
  .numberline-wrap {
    width: 100%;
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 16px 8px;
    touch-action: none;
    cursor: pointer;
    user-select: none;
  }
  #nl-canvas {
    width: 100%;
    display: block;
    touch-action: none;
  }

  .hint {
    font-size: 18px;
    color: #475569;
    text-align: center;
    font-style: italic;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>↗️ Place le nombre</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1 · dizaines</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2 · unités</button>
</div>

<main>
  <div class="question-box" id="question-box">Place ce nombre sur la droite :</div>
  <div class="target-number" id="target-number"></div>

  <div class="numberline-wrap" id="nl-wrap"
       tabindex="0" role="slider"
       aria-label="Droite graduée — utilise les flèches gauche/droite pour placer le nombre"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas id="nl-canvas"></canvas>
  </div>

  <div class="hint" id="hint">Touche la droite pour placer le repère. Déplace-le si besoin, puis vérifie.</div>

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn" id="new-btn"><span aria-hidden="true">▶</span> Nouvel exercice</button>
  </div>
</main>

<script src="appUtils.js"></script>
<script>
  // 'instance' : placer un nombre sur une droite est une tâche corrigeable —
  // l'élève ajuste le repère et revérifie sur la même instance jusqu'à réussite.
  const TYPE_TACHE = 'instance';

  let currentLevel = 1;
  let state = {};

  const targetNumberEl = document.getElementById('target-number');
  const feedbackEl = document.getElementById('feedback');
  const verifyBtn = document.getElementById('verify-btn');
  const newBtn = document.getElementById('new-btn');
  const nlWrap = document.getElementById('nl-wrap');
  const canvas = document.getElementById('nl-canvas');
  const ctx = canvas.getContext('2d');
  const questionBox = document.getElementById('question-box');

  // colorForRank et pick : fournis par appUtils.js (chargé avant ce script).
  const PAD_L = 46, PAD_R = 46;

  function renderTargetNumber(n) {
    targetNumberEl.innerHTML = '';
    const digits = String(n).split('');
    const len = digits.length;
    digits.forEach((d, i) => {
      const rank = len - 1 - i;
      const span = document.createElement('span');
      span.style.color = colorForRank(rank);
      span.textContent = d;
      targetNumberEl.appendChild(span);
    });
  }

  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct || TYPE_TACHE === 'drill') {
      playCorrect();
      launchConfetti();
      verifyBtn.style.display = 'none';
      newBtn.classList.add('visible');
      newBtn.focus();
    } else {
      playIncorrect();
    }
  }

  function setup(moveFocus) {
    // 3H-4H : nombres jusqu'à 100, droite complète 0–100.
    // Niveau 1 : placer une dizaine (graduations étiquetées de 10).
    // Niveau 2 : placer un nombre quelconque (unités entre les dizaines).
    const segments = 10;
    const nlStart = 0;
    const step = 10;
    const nlEnd = nlStart + segments * step; // 100
    let target;
    if (currentLevel === 1) {
      const inner = [];
      for (let v = nlStart + 10; v < nlEnd; v += 10) inner.push(v); // 10..90
      target = pick(inner, 1)[0];
    } else {
      const inner = [];
      for (let v = nlStart + 1; v < nlEnd; v++) {
        if (v % 10 !== 0) inner.push(v); // une unité, jamais une dizaine étiquetée
      }
      target = pick(inner, 1)[0];
    }

    state = {
      nlStart, nlEnd, step, segments, target,
      snapStep: currentLevel === 1 ? 10 : 1,
      userPos: null,
      answered: false,
    };

    questionBox.textContent = `Place le nombre ${target} sur la droite graduée.`;
    renderTargetNumber(target);
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    feedbackEl.removeAttribute('tabindex');
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    nlWrap.setAttribute('aria-valuemin', nlStart);
    nlWrap.setAttribute('aria-valuemax', nlEnd);
    nlWrap.setAttribute('aria-valuenow', nlStart);
    resizeAndDraw();
    if (moveFocus) nlWrap.focus();
  }

  function resizeAndDraw() {
    const dpr = window.devicePixelRatio || 1;
    const w = nlWrap.clientWidth - 16;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(140 * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = '140px';
    drawLine();
  }

  function drawLine(userFrac, showResult) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.width / dpr, H = canvas.height / dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(dpr, dpr);

    const lineY = H * 0.5;
    const lineW = W - PAD_L - PAD_R;
    const { nlStart, nlEnd, step, segments } = state;

    // Main line
    ctx.strokeStyle = '#64748B';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(PAD_L, lineY);
    ctx.lineTo(PAD_L + lineW, lineY);
    ctx.stroke();

    // Arrow right
    ctx.beginPath();
    ctx.moveTo(PAD_L + lineW - 10, lineY - 8);
    ctx.lineTo(PAD_L + lineW + 5, lineY);
    ctx.lineTo(PAD_L + lineW - 10, lineY + 8);
    ctx.fillStyle = '#64748B';
    ctx.fill();

    // Ticks & labels
    const labelSize = Math.max(14, Math.min(18, Math.round(lineW / 36)));
    ctx.font = `bold ${labelSize}px 'Source Sans 3', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    for (let i = 0; i <= segments; i++) {
      const val = nlStart + i * step;
      const x = PAD_L + (i / segments) * lineW;
      const isEndpoint = i === 0 || i === segments;

      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = isEndpoint ? 3 : 1.8;
      ctx.beginPath();
      ctx.moveTo(x, lineY - (isEndpoint ? 16 : 11));
      ctx.lineTo(x, lineY + (isEndpoint ? 16 : 11));
      ctx.stroke();

      ctx.fillStyle = '#475569';
      ctx.fillText(val, x, lineY + 20);
    }

    // Niveau 2 : sous-graduations (de 5) pour aider à placer les unités
    if (currentLevel === 2) {
      const subStep = 5;
      const totalRange = nlEnd - nlStart;
      for (let v = nlStart + subStep; v < nlEnd; v += subStep) {
        if (v % step === 0) continue;
        const frac = (v - nlStart) / totalRange;
        const x = PAD_L + frac * lineW;
        ctx.strokeStyle = '#CBD5E0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, lineY - 8);
        ctx.lineTo(x, lineY + 8);
        ctx.stroke();
      }
    }

    // User marker
    const frac = userFrac !== undefined ? userFrac : state.userPos;
    if (frac !== null && frac !== undefined) {
      const ux = PAD_L + frac * lineW;
      ctx.fillStyle = '#1A3A5C';
      ctx.beginPath();
      ctx.arc(ux, lineY, 11, 0, Math.PI * 2);
      ctx.fill();

      // Label above
      const userVal = Math.round(nlStart + frac * (nlEnd - nlStart));
      ctx.font = `bold 18px 'Nunito', sans-serif`;
      ctx.fillStyle = '#1A3A5C';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(userVal, ux, lineY - 16);
    }

    // Correct marker (after verification)
    if (showResult) {
      const correctFrac = (state.target - nlStart) / (nlEnd - nlStart);
      const cx = PAD_L + correctFrac * lineW;
      ctx.fillStyle = '#10B981';
      ctx.beginPath();
      ctx.arc(cx, lineY, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `bold 18px 'Nunito', sans-serif`;
      ctx.fillStyle = '#10B981';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(state.target, cx, lineY - 36);
    }
    ctx.restore();
  }

  function getCanvasX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return clientX - rect.left;
  }

  function setUserValue(rawVal) {
    const range = state.nlEnd - state.nlStart;
    let val = Math.round(rawVal / state.snapStep) * state.snapStep;
    val = Math.max(state.nlStart, Math.min(state.nlEnd, val));
    state.userPos = (val - state.nlStart) / range;
    nlWrap.setAttribute('aria-valuenow', val);
    drawLine(state.userPos);
    verifyBtn.disabled = false;
  }

  function placeFromEvent(e) {
    if (state.answered) return;
    e.preventDefault();
    const x = getCanvasX(e);
    const dpr = window.devicePixelRatio || 1;
    const lineW = canvas.width / dpr - PAD_L - PAD_R;
    let frac = (x - PAD_L) / lineW;
    frac = Math.max(0, Math.min(1, frac));
    setUserValue(state.nlStart + frac * (state.nlEnd - state.nlStart));
    nlWrap.focus();
  }

  let dragging = false;
  canvas.addEventListener('pointerdown', e => {
    if (state.answered) return;
    dragging = true;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    placeFromEvent(e);
  });
  canvas.addEventListener('pointermove', e => { if (dragging) placeFromEvent(e); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });

  nlWrap.addEventListener('keydown', e => {
    if (state.answered) return;
    const range = state.nlEnd - state.nlStart;
    const curVal = state.userPos !== null ? Math.round(state.nlStart + state.userPos * range) : state.nlStart;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      setUserValue(curVal + state.snapStep);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setUserValue(curVal - state.snapStep);
    }
  });

  verifyBtn.addEventListener('click', () => {
    if (state.userPos === null || state.answered) return;

    const userVal = Math.round(state.nlStart + state.userPos * (state.nlEnd - state.nlStart));
    const correct = userVal === state.target;

    if (correct) {
      state.answered = true;
      drawLine(state.userPos, true);
      showFeedback(true, `Bravo ! ${state.target} est bien placé sur la droite.`);
    } else {
      showFeedback(false, currentLevel === 1
        ? `Presque ! Compte les dizaines depuis 0 jusqu'à ${state.target}.`
        : `Presque ! Repère la dizaine juste avant ${state.target}, puis compte les unités.`);
    }
  });

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      setup(true);
    });
  });

  newBtn.addEventListener('click', () => setup(true));
  window.addEventListener('resize', () => { resizeAndDraw(); });

  setup();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

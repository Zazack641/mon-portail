<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Compréhension de lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #B8960C;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  /* Text selector */
  .text-bar {
    background: #fff;
    border-bottom: 1px solid #E2E8F0;
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .text-btn {
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .text-btn.active { background: #B8960C; color: #fff; border-color: #B8960C; }
  .text-btn:not(.active):hover { background: #E6F5F0; border-color: #B8960C; }

  /* Phases */
  .phase { display: none; }
  .phase.active { display: flex; flex-direction: column; }

  /* Reading phase */
  #phase-read {
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
    padding: 24px 20px 32px;
    gap: 20px;
    align-items: stretch;
  }

  .text-card {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 28px 28px;
  }
  .text-title {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 4.5vw, 26px);
    font-weight: 900;
    color: #B8960C;
    margin-bottom: 16px;
  }
  .text-emoji {
    font-size: 40px;
    margin-bottom: 12px;
    display: block;
  }
  .text-body {
    font-size: clamp(16px, 2.5vw, 18px);
    line-height: 1.85;
    color: #1A1A2E;
  }
  .text-body p + p { margin-top: 12px; }

  .read-btn {
    padding: 18px 36px;
    background: #B8960C;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    align-self: center;
  }
  .read-btn:hover { background: #9A7C0A; }
  .read-btn:active { transform: scale(0.97); }

  /* Question phase */
  #phase-questions {
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
    padding: 24px 20px 40px;
    gap: 20px;
    align-items: stretch;
  }

  .progress-bar-wrap {
    background: #E2E8F0;
    border-radius: 999px;
    height: 8px;
    width: 100%;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: #B8960C;
    transition: width 0.35s ease;
  }
  .progress-label {
    font-size: 13px;
    font-weight: 700;
    color: #94A3B8;
    text-align: right;
  }

  .question-card {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .question-text {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(17px, 3.5vw, 20px);
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.4;
  }
  .answer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .answer-btn {
    width: 100%;
    padding: 16px 20px;
    background: #F8FAFC;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: clamp(15px, 2.5vw, 17px);
    font-weight: 600;
    color: #1A1A2E;
    cursor: pointer;
    min-height: 52px;
    touch-action: manipulation;
    -webkit-appearance: none;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .answer-btn:hover { background: #E6F5F0; border-color: #B8960C; }
  .answer-btn:active { transform: scale(0.99); }
  .answer-btn.correct { background: #D1FAE5; border-color: #10B981; color: #065F46; font-weight: 700; }
  .answer-btn.wrong   { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
  .answer-btn:disabled { cursor: default; }

  .question-feedback {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    display: none;
  }
  .question-feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .question-feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .next-btn {
    padding: 14px 28px;
    background: #1A3A5C;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    min-height: 52px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    align-self: flex-end;
    display: none;
  }
  .next-btn.visible { display: block; }
  .next-btn:hover { background: #253F63; }

  /* Result phase */
  #phase-result {
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
    padding: 40px 20px;
    gap: 24px;
    align-items: center;
    text-align: center;
  }
  .result-emoji { font-size: 72px; }
  .result-title {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 900;
    color: #1A1A2E;
  }
  .result-score {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(40px, 10vw, 60px);
    font-weight: 900;
    color: #B8960C;
  }
  .result-msg {
    font-size: clamp(16px, 2.5vw, 18px);
    color: #64748B;
    line-height: 1.6;
  }
  .result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .retry-btn {
    padding: 16px 32px;
    background: #B8960C;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .retry-btn:hover { background: #9A7C0A; }
  .change-text-btn {
    padding: 16px 32px;
    background: #1A3A5C;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .change-text-btn:hover { background: #253F63; }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>📖 Compréhension de lecture</h1>
  <div class="header-spacer"></div>
</header>

<div class="text-bar" id="text-bar">
  <button class="text-btn active" data-text="kiosque">Le kiosque</button>
  <button class="text-btn" data-text="leonard">Léonard de Vinci</button>
</div>

<!-- Phase 1 : Lecture -->
<div class="phase active" id="phase-read">
  <div class="text-card">
    <span class="text-emoji" id="text-emoji">📰</span>
    <div class="text-title" id="text-title">Le kiosque</div>
    <div class="text-body" id="text-body"></div>
  </div>
  <button class="read-btn" id="read-btn">J'ai lu le texte → Passer aux questions</button>
</div>

<!-- Phase 2 : Questions -->
<div class="phase" id="phase-questions">
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div class="progress-label" id="progress-label">Question 1 / 5</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
  </div>
  <div class="question-card" id="question-card">
    <div class="question-text" id="question-text"></div>
    <div class="answer-list" id="answer-list"></div>
    <div class="question-feedback" id="question-feedback"></div>
    <button class="next-btn" id="next-btn">Question suivante →</button>
  </div>
</div>

<!-- Phase 3 : Résultat -->
<div class="phase" id="phase-result">
  <div class="result-emoji" id="result-emoji">🎉</div>
  <div class="result-title">Terminé !</div>
  <div class="result-score" id="result-score">5 / 5</div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-actions">
    <button class="retry-btn" id="retry-btn">Recommencer ce texte</button>
    <button class="change-text-btn" id="change-text-btn">Changer de texte</button>
  </div>
</div>

<script>
  const TEXTS = {
    kiosque: {
      emoji: '📰',
      title: 'Le kiosque',
      body: `<p>Chaque matin, monsieur Félix ouvre son kiosque à journaux à sept heures précises. Il dispose soigneusement les magazines sur les présentoirs et range les journaux par ordre alphabétique. Les clients habituels arrivent les uns après les autres : madame Dupont prend toujours <em>Le Matin</em>, et le vieux Thomas demande chaque jour <em>Le Journal du Sport</em>.</p>
<p>Ce mardi-là, un enfant s'approche du kiosque avec quelques pièces dans la main. Il hésite longtemps devant les bandes dessinées, puis choisit finalement un album de son héros préféré. Monsieur Félix lui sourit et lui rend la monnaie exacte.</p>
<p>Quand le soleil se couche, monsieur Félix referme les volets du kiosque. Il compte les journaux invendus et les ficelle pour les rendre à l'imprimerie. Demain matin, tout recommencera.</p>`,
      questions: [
        {
          q: 'À quelle heure monsieur Félix ouvre-t-il son kiosque ?',
          answers: ['À sept heures précises', 'À huit heures du matin', 'À six heures et demie', 'À sept heures et demie'],
          correct: 0,
          explanation: 'Le texte dit : « Il ouvre son kiosque à sept heures précises ».',
        },
        {
          q: 'Comment monsieur Félix range-t-il les journaux ?',
          answers: ['Par couleur de couverture', 'Par prix', 'Par ordre alphabétique', 'Par date de parution'],
          correct: 2,
          explanation: 'Le texte précise qu\'il « range les journaux par ordre alphabétique ».',
        },
        {
          q: 'Quel journal madame Dupont achète-t-elle habituellement ?',
          answers: ['Le Journal du Sport', 'Le Matin', 'Les Nouvelles', 'Le Journal du Soir'],
          correct: 1,
          explanation: '« Madame Dupont prend toujours Le Matin ».',
        },
        {
          q: 'Qu\'est-ce que l\'enfant achète au kiosque ?',
          answers: ['Un journal de sport', 'Des cartes postales', 'Un album de bande dessinée', 'Un magazine de cuisine'],
          correct: 2,
          explanation: 'L\'enfant « choisit finalement un album de son héros préféré » — c\'est une bande dessinée.',
        },
        {
          q: 'Que fait monsieur Félix avec les journaux invendus le soir ?',
          answers: ['Il les jette à la poubelle', 'Il les garde pour le lendemain', 'Il les ficelle pour les rendre à l\'imprimerie', 'Il les donne à ses clients'],
          correct: 2,
          explanation: '« Il ficelle les journaux invendus pour les rendre à l\'imprimerie ».',
        },
      ],
    },
    leonard: {
      emoji: '🎨',
      title: 'Léonard de Vinci',
      body: `<p>Léonard de Vinci est né en 1452 en Italie, dans un petit village appelé Vinci. Dès son enfance, il observe la nature avec une curiosité extraordinaire : il dessine les oiseaux, les plantes et les rivières pour les comprendre.</p>
<p>Adulte, il devient un artiste célèbre. Son tableau le plus connu s'appelle <em>La Joconde</em> : il représente une femme au sourire mystérieux. Léonard a travaillé plusieurs années sur ce portrait avant de le considérer terminé.</p>
<p>Mais Léonard n'est pas seulement un peintre. Il imagine aussi des machines volantes, des ponts mobiles et des instruments de musique nouveaux. Il remplit des centaines de cahiers de notes et de dessins. Beaucoup de ses inventions n'ont été construites que des siècles plus tard.</p>
<p>Léonard de Vinci meurt en 1519, à l'âge de 67 ans. On l'appelle souvent « génie universel » car il excellait dans presque tous les domaines : l'art, la science et l'ingénierie.</p>`,
      questions: [
        {
          q: 'Dans quel pays est né Léonard de Vinci ?',
          answers: ['En France', 'En Espagne', 'En Italie', 'En Grèce'],
          correct: 2,
          explanation: '« Léonard de Vinci est né en 1452 en Italie ».',
        },
        {
          q: 'Quel est le tableau le plus connu de Léonard de Vinci ?',
          answers: ['La Nuit étoilée', 'La Joconde', 'Le Déjeuner sur l\'herbe', 'La Ronde de nuit'],
          correct: 1,
          explanation: '« Son tableau le plus connu s\'appelle La Joconde ».',
        },
        {
          q: 'Que représente le tableau La Joconde ?',
          answers: ['Un paysage de montagne', 'Un enfant qui joue', 'Une femme au sourire mystérieux', 'Un marché en plein air'],
          correct: 2,
          explanation: '« La Joconde représente une femme au sourire mystérieux ».',
        },
        {
          q: 'En quelle année Léonard de Vinci est-il mort ?',
          answers: ['En 1452', 'En 1500', 'En 1519', 'En 1550'],
          correct: 2,
          explanation: '« Léonard de Vinci meurt en 1519 ».',
        },
        {
          q: 'Pourquoi appelle-t-on Léonard de Vinci « génie universel » ?',
          answers: [
            'Parce qu\'il a peint des milliers de tableaux',
            'Parce qu\'il excellait dans presque tous les domaines',
            'Parce qu\'il était très riche',
            'Parce qu\'il a voyagé dans le monde entier',
          ],
          correct: 1,
          explanation: '« On l\'appelle génie universel car il excellait dans presque tous les domaines : l\'art, la science et l\'ingénierie ».',
        },
      ],
    },
  };

  let currentText = 'kiosque';
  let currentQ = 0;
  let score = 0;
  let answered = [];

  // Elements
  const phaseRead = document.getElementById('phase-read');
  const phaseQuestions = document.getElementById('phase-questions');
  const phaseResult = document.getElementById('phase-result');
  const textEmoji = document.getElementById('text-emoji');
  const textTitle = document.getElementById('text-title');
  const textBody = document.getElementById('text-body');
  const readBtn = document.getElementById('read-btn');
  const progressLabel = document.getElementById('progress-label');
  const progressBar = document.getElementById('progress-bar');
  const questionText = document.getElementById('question-text');
  const answerList = document.getElementById('answer-list');
  const questionFeedback = document.getElementById('question-feedback');
  const nextBtn = document.getElementById('next-btn');
  const resultEmoji = document.getElementById('result-emoji');
  const resultScore = document.getElementById('result-score');
  const resultMsg = document.getElementById('result-msg');

  function showPhase(id) {
    [phaseRead, phaseQuestions, phaseResult].forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function loadText(key) {
    currentText = key;
    const data = TEXTS[key];
    textEmoji.textContent = data.emoji;
    textTitle.textContent = data.title;
    textBody.innerHTML = data.body;
    currentQ = 0;
    score = 0;
    answered = [];
    showPhase('phase-read');
  }

  document.querySelectorAll('.text-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.text-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadText(btn.dataset.text);
    });
  });

  readBtn.addEventListener('click', () => {
    showPhase('phase-questions');
    renderQuestion();
  });

  function renderQuestion() {
    const data = TEXTS[currentText];
    const q = data.questions[currentQ];
    const total = data.questions.length;

    progressLabel.textContent = `Question ${currentQ + 1} / ${total}`;
    progressBar.style.width = ((currentQ / total) * 100) + '%';

    questionText.textContent = q.q;
    answerList.innerHTML = '';
    questionFeedback.className = 'question-feedback';
    nextBtn.classList.remove('visible');

    q.answers.forEach((ans, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = ans;
      btn.addEventListener('click', () => answerQuestion(i, btn, q));
      answerList.appendChild(btn);
    });
  }

  function answerQuestion(idx, btn, q) {
    const correct = idx === q.correct;
    document.querySelectorAll('.answer-btn').forEach((b, i) => {
      b.disabled = true;
      if (i === q.correct) b.classList.add('correct');
      else if (b === btn) b.classList.add('wrong');
    });

    if (correct) score++;
    answered.push(correct);

    questionFeedback.className = 'question-feedback ' + (correct ? 'correct' : 'wrong');
    questionFeedback.textContent = (correct ? '✅ ' : '❌ ') + q.explanation;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }

    const data = TEXTS[currentText];
    const isLast = currentQ >= data.questions.length - 1;
    nextBtn.textContent = isLast ? 'Voir mes résultats →' : 'Question suivante →';
    nextBtn.classList.add('visible');
  }

  nextBtn.addEventListener('click', () => {
    const data = TEXTS[currentText];
    currentQ++;
    if (currentQ >= data.questions.length) {
      showResult();
    } else {
      renderQuestion();
    }
  });

  function showResult() {
    const data = TEXTS[currentText];
    const total = data.questions.length;
    progressBar.style.width = '100%';

    resultScore.textContent = `${score} / ${total}`;

    const pct = score / total;
    if (pct === 1) {
      resultEmoji.textContent = '🏆';
      resultMsg.textContent = 'Parfait ! Tu as tout compris. Tu peux essayer l\'autre texte maintenant.';
    } else if (pct >= 0.6) {
      resultEmoji.textContent = '👍';
      resultMsg.textContent = 'Bien joué ! Tu peux relire le texte et réessayer pour t\'améliorer.';
    } else {
      resultEmoji.textContent = '📖';
      resultMsg.textContent = 'Relis bien le texte, tu trouveras les réponses. Tu vas y arriver !';
    }

    showPhase('phase-result');
  }

  document.getElementById('retry-btn').addEventListener('click', () => {
    loadText(currentText);
  });

  document.getElementById('change-text-btn').addEventListener('click', () => {
    // Switch to the other text
    const other = currentText === 'kiosque' ? 'leonard' : 'kiosque';
    document.querySelectorAll('.text-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.text === other);
    });
    loadText(other);
  });

  // Init
  loadText(currentText);
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

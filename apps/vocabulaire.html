<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vocabulaire — Les graphèmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #B8960C;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  /* Sound selector */
  .sound-bar {
    background: #fff;
    border-bottom: 1px solid #E2E8F0;
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sound-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .sound-btn.active { background: #B8960C; color: #fff; border-color: #B8960C; }
  .sound-btn:not(.active):hover { background: #E6F5F0; border-color: #B8960C; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    gap: 24px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  /* Sound badge */
  .sound-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: #E6F5F0;
    border-radius: 999px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    color: #9A7C0A;
  }

  .question-box {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(17px, 3.5vw, 21px);
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.5;
  }
  .question-box .word-hint {
    font-size: clamp(14px, 2.5vw, 16px);
    color: #64748B;
    font-weight: 600;
    margin-top: 6px;
    font-family: 'Source Sans 3', sans-serif;
  }

  /* Image zone */
  .image-zone {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .word-image {
    font-size: clamp(80px, 20vw, 120px);
    line-height: 1;
    text-align: center;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.10));
  }

  /* Letter choices */
  .letter-choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .letter-btn {
    flex: 1;
    min-width: 80px;
    max-width: 160px;
    padding: 16px 8px;
    background: #fff;
    border: 2.5px solid #E2E8F0;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 3.5vw, 22px);
    font-weight: 900;
    color: #1A1A2E;
    cursor: pointer;
    min-height: 58px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    text-align: center;
  }
  .letter-btn:hover { background: #E6F5F0; border-color: #B8960C; }
  .letter-btn:active { transform: scale(0.97); }
  .letter-btn.correct { background: #D1FAE5; border-color: #10B981; color: #065F46; }
  .letter-btn.wrong   { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
  .letter-btn:disabled { cursor: default; }

  /* Word display with blanks */
  .word-display {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    justify-content: center;
    flex-wrap: wrap;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 900;
    color: #1A1A2E;
    letter-spacing: 2px;
  }
  .word-blank {
    display: inline-block;
    min-width: 40px;
    border-bottom: 3px solid #B8960C;
    color: #B8960C;
    text-align: center;
    padding: 0 4px;
  }

  .feedback {
    width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 800;
    display: none;
  }
  .feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .new-btn {
    padding: 16px 36px;
    background: #B8960C;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: #9A7C0A; }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>🔤 Vocabulaire</h1>
  <div class="header-spacer"></div>
</header>

<div class="sound-bar" id="sound-bar">
  <button class="sound-btn active" data-sound="ill">ill</button>
  <button class="sound-btn" data-sound="ail">ail</button>
  <button class="sound-btn" data-sound="un">un</button>
  <button class="sound-btn" data-sound="ain">ain / aim / ein</button>
  <button class="sound-btn" data-sound="oin">oin</button>
  <button class="sound-btn" data-sound="revision">Révision</button>
</div>

<main>
  <div class="sound-badge" id="sound-badge">Son : <span id="sound-label">ill</span></div>
  <div class="question-box" id="question-box"></div>
  <div class="image-zone"><div class="word-image" id="word-image"></div></div>
  <div class="word-display" id="word-display"></div>
  <div class="letter-choices" id="letter-choices"></div>
  <div class="feedback" id="feedback"></div>
  <div class="action-row">
    <button class="new-btn" id="new-btn">Autre mot</button>
  </div>
</main>

<script>
  // Word bank per sound, with: word, grapheme (the part to guess), emoji
  const WORDS = {
    ill: [
      { word: 'fille',     grapheme: 'ill',  blank: 'f___e',    emoji: '👧', hint: 'Une personne jeune' },
      { word: 'famille',   grapheme: 'ill',  blank: 'fam___e',  emoji: '👨‍👩‍👧', hint: 'Papa, maman, enfants' },
      { word: 'gorille',   grapheme: 'ill',  blank: 'gor___e',  emoji: '🦍', hint: 'Un grand singe' },
      { word: 'chenille',  grapheme: 'ill',  blank: 'chen___e', emoji: '🐛', hint: 'Devient un papillon' },
      { word: 'grille',    grapheme: 'ill',  blank: 'gr___e',   emoji: '🪟', hint: 'Sépare des espaces' },
      { word: 'ville',     grapheme: 'ill',  blank: 'v___e',    emoji: '🏙️', hint: 'Là où habitent beaucoup de gens' },
      { word: 'brille',    grapheme: 'ill',  blank: 'br___e',   emoji: '✨', hint: 'Émet de la lumière' },
      { word: 'coquille',  grapheme: 'ill',  blank: 'coqu___e', emoji: '🐚', hint: 'Enveloppe d\'un mollusque' },
    ],
    ail: [
      { word: 'soleil',    grapheme: 'eil',  blank: 'sol___',   emoji: '☀️', hint: 'Il brille dans le ciel' },
      { word: 'oreille',   grapheme: 'eill', blank: 'or___e',   emoji: '👂', hint: 'Pour entendre' },
      { word: 'abeille',   grapheme: 'eill', blank: 'ab___e',   emoji: '🐝', hint: 'Fait du miel' },
      { word: 'travail',   grapheme: 'ail',  blank: 'trav___',  emoji: '💼', hint: 'Ce que font les adultes' },
      { word: 'portail',   grapheme: 'ail',  blank: 'port___',  emoji: '🚪', hint: 'Grande porte d\'entrée' },
      { word: 'médaille',  grapheme: 'aill', blank: 'méd___e',  emoji: '🥇', hint: 'Récompense sportive' },
      { word: 'paille',    grapheme: 'aill', blank: 'p___e',    emoji: '🌾', hint: 'Pour boire ou du foin séché' },
      { word: 'rail',      grapheme: 'ail',  blank: 'r___',     emoji: '🛤️', hint: 'Sur quoi roule le train' },
    ],
    un: [
      { word: 'lundi',     grapheme: 'un',   blank: '___di',    emoji: '📅', hint: 'Premier jour de la semaine' },
      { word: 'brun',      grapheme: 'un',   blank: 'br___',    emoji: '🟤', hint: 'Une couleur foncée' },
      { word: 'parfum',    grapheme: 'un',   blank: 'parf___',  emoji: '🌸', hint: 'Sent bon' },
      { word: 'commun',    grapheme: 'un',   blank: 'comm___',  emoji: '🤝', hint: 'Partagé par tous' },
      { word: 'chacun',    grapheme: 'un',   blank: 'chac___',  emoji: '👤', hint: 'Chaque personne' },
      { word: 'aucun',     grapheme: 'un',   blank: 'auc___',   emoji: '🚫', hint: 'Pas un seul' },
      { word: 'jeûn',      grapheme: 'un',   blank: 'jeûne — j___',  emoji: '🍽️', hint: 'Ne pas manger' },
    ],
    ain: [
      { word: 'pain',      grapheme: 'ain',  blank: 'p___',     emoji: '🍞', hint: 'On le mange au repas' },
      { word: 'main',      grapheme: 'ain',  blank: 'm___',     emoji: '✋', hint: 'Au bout du bras' },
      { word: 'train',     grapheme: 'ain',  blank: 'tr___',    emoji: '🚂', hint: 'Roule sur des rails' },
      { word: 'faim',      grapheme: 'aim',  blank: 'f___',     emoji: '😋', hint: 'Envie de manger' },
      { word: 'frein',     grapheme: 'ein',  blank: 'fr___',    emoji: '🛑', hint: 'Pour ralentir' },
      { word: 'plein',     grapheme: 'ein',  blank: 'pl___',    emoji: '🪣', hint: 'Rempli complètement' },
      { word: 'bain',      grapheme: 'ain',  blank: 'b___',     emoji: '🛁', hint: 'Se laver dans l\'eau' },
      { word: 'certain',   grapheme: 'ain',  blank: 'cert___',  emoji: '✅', hint: 'Dont on est sûr' },
    ],
    oin: [
      { word: 'coin',      grapheme: 'oin',  blank: 'c___',     emoji: '📐', hint: 'Un angle' },
      { word: 'loin',      grapheme: 'oin',  blank: 'l___',     emoji: '🗺️', hint: 'Pas près' },
      { word: 'soin',      grapheme: 'oin',  blank: 's___',     emoji: '💊', hint: 'Traiter une blessure' },
      { word: 'moins',     grapheme: 'oin',  blank: 'm___s',    emoji: '➖', hint: 'Le contraire de plus' },
      { word: 'point',     grapheme: 'oin',  blank: 'p___t',    emoji: '⬤', hint: 'Petit rond' },
      { word: 'besoin',    grapheme: 'oin',  blank: 'bes___',   emoji: '💭', hint: 'Ce dont on a besoin' },
      { word: 'pointe',    grapheme: 'oin',  blank: 'p___te',   emoji: '📍', hint: 'Extrémité aiguisée' },
    ],
  };

  // Revision = all sounds mixed
  function getRevisionWords() {
    const all = Object.values(WORDS).flat();
    return shuffle(all).slice(0, 8);
  }

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

  let currentSound = 'ill';
  let usedWords = [];
  let state = {};

  const soundBadge = document.getElementById('sound-badge');
  const soundLabel = document.getElementById('sound-label');
  const questionBox = document.getElementById('question-box');
  const wordImage = document.getElementById('word-image');
  const wordDisplay = document.getElementById('word-display');
  const letterChoices = document.getElementById('letter-choices');
  const feedbackEl = document.getElementById('feedback');
  const newBtn = document.getElementById('new-btn');

  // Sound buttons
  document.querySelectorAll('.sound-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSound = btn.dataset.sound;
      document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      usedWords = [];
      setup();
    });
  });

  function getWordPool() {
    if (currentSound === 'revision') return getRevisionWords();
    return WORDS[currentSound] || [];
  }

  function getNextWord(pool) {
    const available = pool.filter(w => !usedWords.includes(w.word));
    if (available.length === 0) { usedWords = []; return pool[Math.floor(Math.random() * pool.length)]; }
    const w = available[Math.floor(Math.random() * available.length)];
    usedWords.push(w.word);
    return w;
  }

  // Build distractors: other graphemes that produce the same sound, or random letter combos
  const GRAPHEME_POOLS = {
    ill:  ['ill', 'il', 'ille', 'ie'],
    ail:  ['ail', 'aille', 'eil', 'eille'],
    un:   ['un', 'um', 'in', 'aim'],
    ain:  ['ain', 'aim', 'ein', 'en'],
    oin:  ['oin', 'ouin', 'oim', 'oin'],
  };

  function buildChoices(correctGrapheme, sound) {
    const pool = GRAPHEME_POOLS[sound] || [correctGrapheme, 'ou', 'on', 'an'];
    const distractors = pool.filter(g => g !== correctGrapheme);
    const shuffled = shuffle(distractors).slice(0, 2);
    return shuffle([correctGrapheme, ...shuffled]);
  }

  function setup() {
    const pool = getWordPool();
    if (pool.length === 0) return;
    const entry = getNextWord(pool);
    const sound = currentSound === 'revision'
      ? Object.keys(WORDS).find(k => WORDS[k].some(w => w.word === entry.word)) || 'ill'
      : currentSound;

    const choices = buildChoices(entry.grapheme, sound);

    state = { entry, sound, correctGrapheme: entry.grapheme };

    // Update sound badge
    const soundNames = { ill: 'ill', ail: 'ail / eil', un: 'un', ain: 'ain / aim / ein', oin: 'oin', revision: 'Révision' };
    soundLabel.textContent = soundNames[currentSound] || currentSound;

    // Question
    questionBox.innerHTML = `Quel graphème entends-tu dans ce mot ?<div class="word-hint">${entry.hint}</div>`;

    // Image
    wordImage.textContent = entry.emoji;

    // Word with blank
    wordDisplay.innerHTML = '';
    const parts = entry.blank.split('___');
    if (parts.length === 2) {
      const before = document.createTextNode(parts[0]);
      const blank = document.createElement('span');
      blank.className = 'word-blank';
      blank.id = 'word-blank';
      blank.textContent = '___';
      const after = document.createTextNode(parts[1]);
      wordDisplay.appendChild(before);
      wordDisplay.appendChild(blank);
      wordDisplay.appendChild(after);
    } else {
      wordDisplay.textContent = entry.blank;
    }

    // Choices
    letterChoices.innerHTML = '';
    choices.forEach(grapheme => {
      const btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.textContent = grapheme;
      btn.addEventListener('click', () => answer(grapheme, btn));
      letterChoices.appendChild(btn);
    });

    feedbackEl.className = 'feedback';
    newBtn.classList.remove('visible');
  }

  function answer(grapheme, btn) {
    if (state.answered) return;
    state.answered = true;
    const correct = grapheme === state.correctGrapheme;

    // Reveal the blank
    const blankEl = document.getElementById('word-blank');
    if (blankEl) blankEl.textContent = state.correctGrapheme;

    document.querySelectorAll('.letter-btn').forEach(b => {
      b.disabled = true;
      if (b.textContent === state.correctGrapheme) b.classList.add('correct');
      else if (b === btn) b.classList.add('wrong');
    });

    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = correct
      ? `✅ Bravo ! On entend bien « ${state.entry.grapheme} » dans « ${state.entry.word} » !`
      : `❌ Non. Dans « ${state.entry.word} », on entend « ${state.entry.grapheme} ».`;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    newBtn.classList.add('visible');
  }

  newBtn.addEventListener('click', () => {
    state = {};
    setup();
  });

  setup();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

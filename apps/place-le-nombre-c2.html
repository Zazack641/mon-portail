<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Place le nombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-units:    #3B7DD8;
    --color-tens:     #D64045;
    --color-hundreds: #3A9E6F;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #C0272D;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  .level-bar {
    background: #fff;
    border-bottom: 1px solid #E2E8F0;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .level-btn {
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .level-btn.active { background: #C0272D; color: #fff; border-color: #C0272D; }
  .level-btn:not(.active):hover { background: #EEF2F7; border-color: #CBD5E0; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 28px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
  }

  .question-box {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 3.5vw, 21px);
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.5;
  }

  /* Number to place — big colored display */
  .target-number {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(52px, 12vw, 80px);
    font-weight: 900;
    line-height: 1;
    display: flex;
    gap: 2px;
    align-items: baseline;
    justify-content: center;
  }

  /* Numberline canvas */
  .numberline-wrap {
    width: 100%;
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 16px 8px;
    touch-action: none;
    cursor: pointer;
    user-select: none;
  }
  #nl-canvas {
    width: 100%;
    display: block;
    touch-action: none;
  }

  .hint {
    font-size: 18px;
    color: #475569;
    text-align: center;
    font-style: italic;
    line-height: 1.5;
  }

  .feedback {
    width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 3vw, 19px);
    font-weight: 800;
    display: none;
  }
  .feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .verify-btn {
    padding: 16px 36px;
    background: #C0272D;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .verify-btn:hover { background: #A01F23; }
  .verify-btn:disabled { background: #94A3B8; cursor: default; }
  .new-btn {
    padding: 16px 36px;
    background: #0F7860;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: #0A5C48; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>↗️ Place le nombre</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1 · dizaines</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2 · unités</button>
</div>

<main>
  <div class="question-box" id="question-box">Place ce nombre sur la droite :</div>
  <div class="target-number" id="target-number"></div>

  <div class="numberline-wrap" id="nl-wrap"
       tabindex="0" role="slider"
       aria-label="Droite graduée — utilise les flèches gauche/droite pour placer le nombre"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas id="nl-canvas"></canvas>
  </div>

  <div class="hint" id="hint">Touche la droite pour placer le repère. Déplace-le si besoin, puis vérifie.</div>

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<script>
  const PLACE_COLORS = ['--color-units', '--color-tens', '--color-hundreds'];
  function colorForRank(rank) { return `var(${PLACE_COLORS[rank % 3]})`; }

  let currentLevel = 1;
  let state = {};

  const targetNumberEl = document.getElementById('target-number');
  const feedbackEl = document.getElementById('feedback');
  const verifyBtn = document.getElementById('verify-btn');
  const newBtn = document.getElementById('new-btn');
  const nlWrap = document.getElementById('nl-wrap');
  const canvas = document.getElementById('nl-canvas');
  const ctx = canvas.getContext('2d');
  const questionBox = document.getElementById('question-box');

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function renderTargetNumber(n) {
    targetNumberEl.innerHTML = '';
    const digits = String(n).split('');
    const len = digits.length;
    digits.forEach((d, i) => {
      const rank = len - 1 - i;
      const span = document.createElement('span');
      span.style.color = colorForRank(rank);
      span.textContent = d;
      targetNumberEl.appendChild(span);
    });
  }

  function setup() {
    // Les deux niveaux restent dans la plage 5H-6H (jusqu'à 1000).
    // Niveau 1 : droite complète 0–1000, graduations de 100, placer une dizaine.
    // Niveau 2 : zoom sur une centaine, graduations de 10, placer une unité.
    const segments = 10;
    let nlStart, step, target;
    if (currentLevel === 1) {
      nlStart = 0;
      step = 100;
      const nlEnd1 = nlStart + segments * step; // 1000
      const inner = [];
      for (let v = nlStart + 10; v < nlEnd1; v += 10) {
        if (v % 100 !== 0) inner.push(v); // une dizaine, jamais une centaine étiquetée
      }
      target = inner[Math.floor(Math.random() * inner.length)];
    } else {
      nlStart = randInt(0, 9) * 100; // une centaine au hasard (0–900)
      step = 10;
      const nlEnd2 = nlStart + segments * step; // nlStart + 100
      const inner = [];
      for (let v = nlStart + 1; v < nlEnd2; v++) {
        if (v % 10 !== 0) inner.push(v); // une unité, jamais une dizaine étiquetée
      }
      target = inner[Math.floor(Math.random() * inner.length)];
    }
    const nlEnd = nlStart + segments * step;

    state = {
      nlStart, nlEnd, step, segments, target,
      snapStep: currentLevel === 1 ? 10 : 1,
      userPos: null,
      answered: false,
    };

    questionBox.textContent = `Place le nombre ${target} sur la droite graduée.`;
    renderTargetNumber(target);
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    nlWrap.setAttribute('aria-valuemin', nlStart);
    nlWrap.setAttribute('aria-valuemax', nlEnd);
    nlWrap.setAttribute('aria-valuenow', nlStart);
    resizeAndDraw();
  }

  function resizeAndDraw() {
    const dpr = window.devicePixelRatio || 1;
    const w = nlWrap.clientWidth - 16;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(140 * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = '140px';
    drawLine();
  }

  function drawLine(userFrac, showResult) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.width / dpr, H = canvas.height / dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(dpr, dpr);

    const padL = 46, padR = 46;
    const lineY = H * 0.5;
    const lineW = W - padL - padR;
    const { nlStart, nlEnd, step, segments } = state;

    // Main line
    ctx.strokeStyle = '#64748B';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(padL, lineY);
    ctx.lineTo(padL + lineW, lineY);
    ctx.stroke();

    // Arrow right
    ctx.beginPath();
    ctx.moveTo(padL + lineW - 10, lineY - 8);
    ctx.lineTo(padL + lineW + 5, lineY);
    ctx.lineTo(padL + lineW - 10, lineY + 8);
    ctx.fillStyle = '#64748B';
    ctx.fill();

    // Ticks & labels
    const labelSize = Math.max(14, Math.min(18, Math.round(lineW / 36)));
    ctx.font = `bold ${labelSize}px 'Source Sans 3', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    for (let i = 0; i <= segments; i++) {
      const val = nlStart + i * step;
      const x = padL + (i / segments) * lineW;
      const isEndpoint = i === 0 || i === segments;

      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = isEndpoint ? 3 : 1.8;
      ctx.beginPath();
      ctx.moveTo(x, lineY - (isEndpoint ? 16 : 11));
      ctx.lineTo(x, lineY + (isEndpoint ? 16 : 11));
      ctx.stroke();

      ctx.fillStyle = '#475569';
      ctx.fillText(val, x, lineY + 20);
    }

    // Niveau 1 : sous-graduations (dizaines) entre les centaines étiquetées
    if (currentLevel === 1) {
      const subStep = 10;
      const totalRange = nlEnd - nlStart;
      for (let v = nlStart + subStep; v < nlEnd; v += subStep) {
        if (v % step === 0) continue;
        const frac = (v - nlStart) / totalRange;
        const x = padL + frac * lineW;
        ctx.strokeStyle = '#CBD5E0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, lineY - 8);
        ctx.lineTo(x, lineY + 8);
        ctx.stroke();
      }
    }

    // User marker
    const frac = userFrac !== undefined ? userFrac : state.userPos;
    if (frac !== null && frac !== undefined) {
      const ux = padL + frac * lineW;
      ctx.fillStyle = '#1A3A5C';
      ctx.beginPath();
      ctx.arc(ux, lineY, 11, 0, Math.PI * 2);
      ctx.fill();

      // Label above
      const userVal = Math.round(nlStart + frac * (nlEnd - nlStart));
      ctx.font = `bold 18px 'Nunito', sans-serif`;
      ctx.fillStyle = '#1A3A5C';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(userVal, ux, lineY - 16);
    }

    // Correct marker (after verification)
    if (showResult) {
      const correctFrac = (state.target - nlStart) / (nlEnd - nlStart);
      const cx = padL + correctFrac * lineW;
      ctx.fillStyle = '#10B981';
      ctx.beginPath();
      ctx.arc(cx, lineY, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `bold 18px 'Nunito', sans-serif`;
      ctx.fillStyle = '#10B981';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(state.target, cx, lineY - 36);
    }
    ctx.restore();
  }

  function getCanvasX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return clientX - rect.left;
  }

  function setUserValue(rawVal) {
    const range = state.nlEnd - state.nlStart;
    let val = Math.round(rawVal / state.snapStep) * state.snapStep;
    val = Math.max(state.nlStart, Math.min(state.nlEnd, val));
    state.userPos = (val - state.nlStart) / range;
    nlWrap.setAttribute('aria-valuenow', val);
    drawLine(state.userPos);
    verifyBtn.disabled = false;
  }

  function placeFromEvent(e) {
    if (state.answered) return;
    e.preventDefault();
    const x = getCanvasX(e);
    const dpr = window.devicePixelRatio || 1;
    const padL = 46, padR = 46;
    const lineW = canvas.width / dpr - padL - padR;
    let frac = (x - padL) / lineW;
    frac = Math.max(0, Math.min(1, frac));
    setUserValue(state.nlStart + frac * (state.nlEnd - state.nlStart));
    nlWrap.focus();
  }

  let dragging = false;
  canvas.addEventListener('pointerdown', e => {
    if (state.answered) return;
    dragging = true;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    placeFromEvent(e);
  });
  canvas.addEventListener('pointermove', e => { if (dragging) placeFromEvent(e); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });

  nlWrap.addEventListener('keydown', e => {
    if (state.answered) return;
    const range = state.nlEnd - state.nlStart;
    const curVal = state.userPos !== null ? Math.round(state.nlStart + state.userPos * range) : state.nlStart;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      setUserValue(curVal + state.snapStep);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setUserValue(curVal - state.snapStep);
    }
  });

  verifyBtn.addEventListener('click', () => {
    if (state.userPos === null) return;

    const userVal = Math.round(state.nlStart + state.userPos * (state.nlEnd - state.nlStart));
    const correct = userVal === state.target;

    if (correct) {
      state.answered = true;
      drawLine(state.userPos, true);
      feedbackEl.className = 'feedback correct';
      feedbackEl.textContent = `Bravo ! ${state.target} est bien placé sur la droite.`;
      playCorrect(); launchConfetti();
      verifyBtn.style.display = 'none';
      newBtn.classList.add('visible');
    } else {
      const refWord   = currentLevel === 1 ? 'centaine' : 'dizaine';
      const countWord = currentLevel === 1 ? 'dizaines' : 'unités';
      feedbackEl.className = 'feedback wrong';
      feedbackEl.textContent = `Presque ! Repère la ${refWord} juste avant ${state.target}, puis compte les ${countWord}.`;
      playIncorrect();
    }
  });

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      setup();
    });
  });

  newBtn.addEventListener('click', setup);
  window.addEventListener('resize', () => { resizeAndDraw(); });

  setup();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

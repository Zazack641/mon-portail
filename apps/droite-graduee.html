<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La droite graduée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-units:    #3B7DD8;
    --color-tens:     #D64045;
    --color-hundreds: #3A9E6F;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #C0272D;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  .level-bar {
    background: #fff;
    border-bottom: 1px solid #E2E8F0;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .level-btn {
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .level-btn.active { background: #C0272D; color: #fff; border-color: #C0272D; }
  .level-btn:not(.active):hover { background: #EEF2F7; border-color: #CBD5E0; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 28px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
  }

  .question-box {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(17px, 3.5vw, 21px);
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.4;
  }

  /* Number to place — big colored display */
  .target-number {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(52px, 12vw, 80px);
    font-weight: 900;
    line-height: 1;
    display: flex;
    gap: 2px;
    align-items: baseline;
    justify-content: center;
  }

  /* Numberline canvas */
  .numberline-wrap {
    width: 100%;
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 16px 8px;
    touch-action: none;
    cursor: pointer;
    user-select: none;
  }
  #nl-canvas {
    width: 100%;
    display: block;
    touch-action: none;
  }

  .hint {
    font-size: 14px;
    color: #94A3B8;
    text-align: center;
    font-style: italic;
  }

  .feedback {
    width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 800;
    display: none;
  }
  .feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .verify-btn {
    padding: 16px 36px;
    background: #C0272D;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .verify-btn:hover { background: #A01F23; }
  .verify-btn:disabled { background: #94A3B8; cursor: default; }
  .new-btn {
    padding: 16px 36px;
    background: #0F7860;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: #0A5C48; }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>↗️ La droite graduée</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1 · jusqu'à 100</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2 · jusqu'à 1000</button>
</div>

<main>
  <div class="question-box" id="question-box">Place ce nombre sur la droite :</div>
  <div class="target-number" id="target-number"></div>

  <div class="numberline-wrap" id="nl-wrap"
       tabindex="0" role="slider"
       aria-label="Droite graduée — utilise les flèches gauche/droite pour placer le nombre"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas id="nl-canvas"></canvas>
  </div>

  <div class="hint" id="hint">Appuie sur la droite ou utilise les flèches ← → pour placer le nombre.</div>

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<script>
  const PLACE_COLORS = ['--color-units', '--color-tens', '--color-hundreds'];
  function colorForRank(rank) { return `var(${PLACE_COLORS[rank % 3]})`; }

  let currentLevel = 1;
  let state = {};

  const targetNumberEl = document.getElementById('target-number');
  const feedbackEl = document.getElementById('feedback');
  const verifyBtn = document.getElementById('verify-btn');
  const newBtn = document.getElementById('new-btn');
  const nlWrap = document.getElementById('nl-wrap');
  const canvas = document.getElementById('nl-canvas');
  const ctx = canvas.getContext('2d');
  const questionBox = document.getElementById('question-box');

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function renderTargetNumber(n) {
    targetNumberEl.innerHTML = '';
    const digits = String(n).split('');
    const len = digits.length;
    digits.forEach((d, i) => {
      const rank = len - 1 - i;
      const span = document.createElement('span');
      span.style.color = colorForRank(rank);
      span.textContent = d;
      targetNumberEl.appendChild(span);
    });
  }

  function setup() {
    const max = currentLevel === 1 ? 100 : 1000;
    // Choose a "nice" interval for the numberline
    const step = currentLevel === 1 ? 10 : 100;
    const segments = 10;

    // Pick start as a multiple of step
    const maxStart = max - segments * step;
    const startMultiples = [];
    for (let v = 0; v <= maxStart; v += step) startMultiples.push(v);
    const nlStart = startMultiples[Math.floor(Math.random() * startMultiples.length)];
    const nlEnd = nlStart + segments * step;

    // Pick target strictly inside the line (not on endpoints)
    let target;
    if (currentLevel === 1) {
      // Must not be a labeled graduation (multiples of 10) — challenge
      const inner = [];
      for (let v = nlStart + 1; v < nlEnd; v++) {
        if (v % 10 !== 0) inner.push(v);
      }
      target = inner[Math.floor(Math.random() * inner.length)];
    } else {
      // Must not be on a labeled graduation (multiples of 100)
      const inner = [];
      for (let v = nlStart + 10; v < nlEnd; v += 10) {
        if (v % 100 !== 0) inner.push(v);
      }
      target = inner[Math.floor(Math.random() * inner.length)];
    }

    state = {
      nlStart, nlEnd, step, segments, target,
      userPos: null,
      answered: false,
      max,
    };

    questionBox.textContent = `Place le nombre ${target} sur la droite graduée.`;
    renderTargetNumber(target);
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    verifyBtn.style.display = '';
    verifyBtn.disabled = true;
    newBtn.classList.remove('visible');
    nlWrap.setAttribute('aria-valuemin', nlStart);
    nlWrap.setAttribute('aria-valuemax', nlEnd);
    nlWrap.setAttribute('aria-valuenow', nlStart);
    resizeAndDraw();
  }

  function resizeAndDraw() {
    const dpr = window.devicePixelRatio || 1;
    const w = nlWrap.clientWidth - 16;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(100 * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = '100px';
    drawLine();
  }

  function drawLine(userFrac, showResult) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.width / dpr, H = canvas.height / dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(dpr, dpr);

    const padL = 40, padR = 40;
    const lineY = H * 0.55;
    const lineW = W - padL - padR;
    const { nlStart, nlEnd, step, segments } = state;

    // Main line
    ctx.strokeStyle = '#64748B';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(padL, lineY);
    ctx.lineTo(padL + lineW, lineY);
    ctx.stroke();

    // Arrow right
    ctx.beginPath();
    ctx.moveTo(padL + lineW - 8, lineY - 6);
    ctx.lineTo(padL + lineW + 4, lineY);
    ctx.lineTo(padL + lineW - 8, lineY + 6);
    ctx.fillStyle = '#64748B';
    ctx.fill();

    // Ticks & labels
    ctx.font = `bold 12px 'Source Sans 3', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    for (let i = 0; i <= segments; i++) {
      const val = nlStart + i * step;
      const x = padL + (i / segments) * lineW;
      const isEndpoint = i === 0 || i === segments;

      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = isEndpoint ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.moveTo(x, lineY - (isEndpoint ? 12 : 8));
      ctx.lineTo(x, lineY + (isEndpoint ? 12 : 8));
      ctx.stroke();

      ctx.fillStyle = '#475569';
      ctx.fillText(val, x, lineY + 16);
    }

    // Level 2: intermediate smaller ticks every 10
    if (currentLevel === 2) {
      const subStep = 10;
      const totalRange = nlEnd - nlStart;
      for (let v = nlStart + subStep; v < nlEnd; v += subStep) {
        if (v % step === 0) continue;
        const frac = (v - nlStart) / totalRange;
        const x = padL + frac * lineW;
        ctx.strokeStyle = '#CBD5E0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, lineY - 5);
        ctx.lineTo(x, lineY + 5);
        ctx.stroke();
      }
    }

    // User marker
    const frac = userFrac !== undefined ? userFrac : state.userPos;
    if (frac !== null && frac !== undefined) {
      const ux = padL + frac * lineW;
      ctx.fillStyle = '#1A3A5C';
      ctx.beginPath();
      ctx.arc(ux, lineY, 8, 0, Math.PI * 2);
      ctx.fill();

      // Label above
      const userVal = Math.round(nlStart + frac * (nlEnd - nlStart));
      ctx.font = `bold 14px 'Nunito', sans-serif`;
      ctx.fillStyle = '#1A3A5C';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(userVal, ux, lineY - 12);
    }

    // Correct marker (after verification)
    if (showResult) {
      const correctFrac = (state.target - nlStart) / (nlEnd - nlStart);
      const cx = padL + correctFrac * lineW;
      ctx.fillStyle = '#10B981';
      ctx.beginPath();
      ctx.arc(cx, lineY, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `bold 14px 'Nunito', sans-serif`;
      ctx.fillStyle = '#10B981';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(state.target, cx, lineY - 28);
    }
    ctx.restore();
  }

  function getCanvasX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return clientX - rect.left;
  }

  function handleTap(e) {
    if (state.answered) return;
    e.preventDefault();
    const x = getCanvasX(e);
    const dpr = window.devicePixelRatio || 1;
    const padL = 40, padR = 40;
    const lineW = canvas.width / dpr - padL - padR;
    let frac = (x - padL) / lineW;
    frac = Math.max(0, Math.min(1, frac));
    state.userPos = frac;
    drawLine(frac);
    verifyBtn.disabled = false;
  }

  canvas.addEventListener('click', handleTap);
  canvas.addEventListener('touchstart', handleTap, { passive: false });

  nlWrap.addEventListener('keydown', e => {
    if (state.answered) return;
    const step = currentLevel === 1 ? 1 : 10;
    const range = state.nlEnd - state.nlStart;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      const curVal = state.userPos !== null ? Math.round(state.nlStart + state.userPos * range) : state.nlStart;
      const newVal = Math.min(state.nlEnd, curVal + step);
      state.userPos = (newVal - state.nlStart) / range;
      drawLine(state.userPos);
      verifyBtn.disabled = false;
      nlWrap.setAttribute('aria-valuenow', newVal);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      const curVal = state.userPos !== null ? Math.round(state.nlStart + state.userPos * range) : state.nlStart;
      const newVal = Math.max(state.nlStart, curVal - step);
      state.userPos = (newVal - state.nlStart) / range;
      drawLine(state.userPos);
      verifyBtn.disabled = false;
      nlWrap.setAttribute('aria-valuenow', newVal);
    }
  });

  verifyBtn.addEventListener('click', () => {
    if (state.userPos === null) return;
    state.answered = true;

    const userVal = Math.round(state.nlStart + state.userPos * (state.nlEnd - state.nlStart));
    const tolerance = currentLevel === 1 ? 3 : 20;
    const correct = Math.abs(userVal - state.target) <= tolerance;

    drawLine(state.userPos, true);

    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = correct
      ? `Bravo ! Tu as bien placé ${state.target} sur la droite.`
      : `Pas tout à fait. Tu as placé ${userVal}, mais la bonne position est ${state.target}.`;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    verifyBtn.style.display = 'none';
    newBtn.classList.add('visible');
  });

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      setup();
    });
  });

  newBtn.addEventListener('click', setup);
  window.addEventListener('resize', () => { resizeAndDraw(); });

  setup();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

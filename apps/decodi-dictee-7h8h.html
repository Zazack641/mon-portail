<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dictée DéCoDi — Modules 11-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  :root {
    /* Domaine : Français */
    --app-accent:      #7A6200;
    --app-accent-dark: #5C4A00;
    --app-tint-bg:     #FBF5D6;
    --app-tint-fg:     #7A6200;
  }

  /* ── Navigation contextuelle (remplace level-bar) ────────────────── */
  .nav-bar {
    background: #fff;
    border-bottom: 1px solid var(--app-border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
  }
  .nav-bar-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #64748B;
    white-space: nowrap;
    flex: 1;
  }
  .nav-back-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--app-border);
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    white-space: nowrap;
  }
  .nav-back-btn:hover  { background: #EEF2F7; }
  .nav-back-btn:active { background: #E2EAF4; }
  .nav-back-btn:focus-visible { outline: 3px solid var(--app-accent); outline-offset: 3px; }

  /* ── Grilles de sélection ────────────────────────────────────────── */
  .select-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    width: 100%;
  }
  .select-btn {
    padding: 14px 22px;
    border-radius: 12px;
    border: 2px solid var(--app-border);
    background: #fff;
    color: var(--app-text);
    font-family: 'Baloo 2', sans-serif;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
  }
  .select-btn:hover  { background: #FBF5D6; border-color: var(--app-accent); color: var(--app-accent); }
  .select-btn:active { background: #F5ECC0; }
  .select-btn:focus-visible { outline: 3px solid var(--app-accent); outline-offset: 3px; }

  .select-section-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #64748B;
    text-align: center;
    width: 100%;
    margin-bottom: -4px;
  }
  .bloc-btn {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 140px;
  }
  .bloc-btn-title {
    font-weight: 800;
  }
  .bloc-btn-words {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #94A3B8;
  }

  /* ── Vue dictée ──────────────────────────────────────────────────── */
  #view-dictee {
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .bloc-info {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #64748B;
    text-align: center;
  }

  .word-input {
    width: 100%;
    max-width: 340px;
    padding: 16px 20px;
    border: 2px solid var(--app-border);
    border-radius: 12px;
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    text-align: center;
    color: var(--app-text);
    background: #fff;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    outline: none;
  }
  .word-input:focus { border-color: var(--app-accent); outline: 3px solid var(--app-accent); outline-offset: 2px; }

  .listen-btn {
    padding: 14px 28px;
    background: var(--app-accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
  }
  .listen-btn:hover  { background: #685300; }
  .listen-btn:active { background: #554400; }
  .listen-btn:focus-visible { outline: 3px solid rgba(255,255,255,0.9); outline-offset: 3px; }

  /* ── Recopie ─────────────────────────────────────────────────────── */
  .recopy-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .recopy-label {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--app-wrong-fg);
    text-align: center;
  }
  .recopy-input {
    width: 100%;
    max-width: 340px;
    padding: 14px 20px;
    border: 2px solid #FECACA;
    border-radius: 12px;
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    text-align: center;
    color: var(--app-text);
    background: #fff;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    outline: none;
  }
  .recopy-input:focus { border-color: #D64045; outline: 3px solid #D64045; outline-offset: 2px; }
  .recopy-ok {
    font-family: 'Baloo 2', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--app-correct-fg);
    display: none;
  }
  .recopy-ok.visible { display: block; }

  /* ── Récapitulatif ───────────────────────────────────────────────── */
  .recap-box {
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    width: 100%;
  }
  .recap-score {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 800;
    color: var(--app-text);
    margin-bottom: 8px;
  }
  .recap-detail {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    color: #64748B;
    margin-bottom: 0;
  }
  .recap-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .nav-back-btn { transition: background 0.15s; }
    .select-btn   { transition: all 0.15s; }
    .listen-btn   { transition: background 0.15s; }
    .word-input   { transition: border-color 0.15s; }
    .recopy-input { transition: border-color 0.15s; }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>Dictée DéCoDi</h1>
  <div class="header-spacer"></div>
</header>

<div class="nav-bar" id="nav-bar" role="group" aria-label="Navigation dans l'activité">
  <span class="nav-bar-title" id="nav-label">Choisir un module</span>
  <button class="nav-back-btn" id="nav-back-btn" style="display:none">← Retour</button>
</div>

<main>

  <!-- VUE 1 — Sélection du module -->
  <div id="view-module">
    <p class="select-section-title">Choisir un module</p>
    <div class="select-grid" id="module-grid"></div>
  </div>

  <!-- VUE 2 — Sélection du graphème -->
  <div id="view-grapheme" style="display:none">
    <p class="select-section-title" id="grapheme-section-title">Choisir un graphème</p>
    <div class="select-grid" id="grapheme-grid"></div>
  </div>

  <!-- VUE 2b — Sélection du bloc -->
  <div id="view-bloc" style="display:none">
    <p class="select-section-title" id="bloc-section-title">Choisir un bloc</p>
    <div class="select-grid" id="bloc-grid"></div>
  </div>

  <!-- VUE 3 — Dictée -->
  <div id="view-dictee" style="display:none">

    <p class="bloc-info" id="bloc-info"></p>

    <div class="question-box" id="question-box"></div>

    <button class="listen-btn" id="listen-btn">🔊 Écouter</button>

    <input
      class="word-input"
      id="word-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Écris le mot ici"
      aria-label="Saisir le mot dicté"
    >

    <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="recopy-section" id="recopy-section" style="display:none">
      <p class="recopy-label">Recopie le mot : <strong id="recopy-word-display"></strong></p>
      <input
        class="recopy-input"
        id="recopy-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        aria-label="Recopier le mot"
        aria-describedby="recopy-word-display"
      >
      <p class="recopy-ok" id="recopy-ok">Bien recopié !</p>
    </div>

    <div class="action-row">
      <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
      <button class="new-btn" id="new-btn">Mot suivant</button>
    </div>

    <!-- Récapitulatif de fin de bloc -->
    <div class="recap-box" id="recap-box" style="display:none">
      <p class="recap-score" id="recap-score"></p>
      <p class="recap-detail" id="recap-detail"></p>
      <div class="recap-actions">
        <button class="verify-btn" id="next-bloc-btn" style="display:none">Bloc suivant</button>
        <button class="new-btn visible" id="change-bloc-btn">Choisir un bloc</button>
        <button class="new-btn visible" id="change-grapheme-btn">Changer de graphème</button>
      </div>
    </div>

  </div>

</main>

<script src="appUtils.js"></script>
<script>
// 'drill' : une tentative par mot ; la recopie est un étayage, pas un retry sur l'item.
const TYPE_TACHE = 'drill';

// ── Données — Modules 11 à 15 (C2 / 7H-8H) ──────────────────────────────────
const DECODI_DATA = {
  "Module 11": {
    "g-gu":   ["gâteau","frigo","légumes","grâce","portugais","groupe","fatigant","malgré","degré","ingrédient","gramme","glisser","garder","gout","naviguer","guidait","longue","guerre","genou","fromage","bougie","danger","manger","passage","mélanger","tragique","gentil","équipage","bagage","garage","grange"],
    "eu-eur": ["feu","deux","Europe","rongeur","fleuve","pêcheur","agriculteur","bleu","jeu","peur","nombreux","malheureux","jeune","peuple","mystérieux","visiteur","sauveur","joueur","furieux","plusieurs","longueur","profondeur","couleur","pleurer","creuser","heure"],
    "z":      ["zèbre","gazelle","gazon","douze","chimpanzé","magazine","zoo","lézard","zéro","zébrure","bronze","trapéziste","dizaine","bizarrement","zut","bizarre","bazar","bronzé"]
  },
  "Module 12": {
    "gn":  ["agneau","araignée","champignon","châtaigne","chignon","cigogne","montagne","ognon","peigne","peignoir","rossignol","vigne","baigner","beignet","gagner","magnifique","campagne","grignote","mignon","compagnon","ligne","poignée","soigner","consigne"],
    "y":   ["crayon","noyau","cygne","pyjama","tuyau","paysan","stylo","paysage","cyclope","labyrinthe","pyramide","payer","type","joyeux","hyper","essayer","voyage","foyer","voyageurs","effrayé","voyant","royaume","Égypte","joyaux","pays","mystère","papyrus","incroyable"],
    "k":   ["kiosque","ticket","cake","kaki","basket","ski","skier","koala","kangourou","Viking","kilo","Danemark","kilomètre","kidnappait","snack","cookies","paprika","kebab"],
    "ph":  ["photo","éléphant","dauphin","phoque","phare","téléphone","pharaons","orphelin","catastrophe","sarcophage","photographe","photographié","téléphoner","phrase","pharmacie","alphabet","géographie"],
    "x":   ["galaxie","taxi","index","texte","boxe","klaxon","exploser","exploit","explorer","extraordinaire","expérience","excellent","fixer","mixer","vexer","extérieur","exact","excité","excuser","exemple","exercice","exagérer","expliquer"]
  },
  "Module 13": {
    "ain-aim-ein": ["main","train","bain","pain","humain","ceinture","peinture","poulain","copain","maintenant","demain","terrain","vilain","certains","grain","ainsi","craintif","soudain","plaindre","faim","peintre","peindre","peint","plein","frein","éteindre","atteindre","rein"],
    "oin":  ["coin","foin","groin","pointe","poing","shampoing","pointu","besoin","loin","soin","moins","rejoindre","témoin","point","coincé"],
    "ien":  ["chien","indien","magicien","mécanicien","bien","vient","italien","ancien","mien","sien","lien","tien","musicien","bienvenu","combien","bientôt","végétarien","quotidien","gardien","prévient","appartient","soutient","souvient","revient","rien"],
    "un":   ["jungle","brun","lundi","chacun","aucun"]
  },
  "Module 14": {
    "ill":  ["papillon","chenille","coquillage","coquille","fille","famille","quille","cheville","aiguille","cuillère","brindille","grille","vanille","billet","juillet","lentille","maquillage","habiller","briller","griller","gentille","brillant","bille"],
    "ail":  ["poulailler","caille","paille","médaille","portail","ail","caillou","corail","d'ailleurs","volaille","maillot","bétail","travail","travailler","taille","bataille","bâiller","ailleurs","écaille","paillette","détail"],
    "eil":  ["soleil","abeille","bouteille","oreille","corbeille","réveil","orteil","corneille","oreiller","vieillir","vieillesse","vieille","sommeil","réveiller","merveilleux","conseil","conseiller","meilleur","surveiller","appareil","pareil","veiller"],
    "ouil": ["grenouille","citrouille","nouilles","bouillotte","bouilloire","fenouil","brouillard","chatouiller","mouiller","ratatouille","bouillir","bouillant","trouillard","fouiller","débrouiller","bouillon","bouillie"],
    "euil": ["feuille","fauteuil","écureuil","chevreuil","millefeuille","portefeuille","deuil","feuilleter"]
  },
  "Module 15": {
    "tion-tien": ["émotion","attention","martien","dalmatien","égyptien","potion","imagination","solution","invention","information","communication","conversation","occupation","concentration","création","sensation","modification","invitation","position","relation","action","natation","population","exception"],
    "w": ["wagon","kiwi"],
    "h": ["humain","homme","hibou","huit","panthère","hurler","labyrinthe","huile","histoire","aujourd'hui","habitat","habiter","habitant","bonheur","habit","habiller","hiver","heureux","malheureux","hasard","hiberner","habile","hyper","souhait"]
  }
};

const BLOC_SIZE = 7;

// ── Références DOM ────────────────────────────────────────────────────────────
const viewModule    = document.getElementById('view-module');
const viewGrapheme  = document.getElementById('view-grapheme');
const viewBloc      = document.getElementById('view-bloc');
const viewDictee    = document.getElementById('view-dictee');
const moduleGrid    = document.getElementById('module-grid');
const graphemeGrid  = document.getElementById('grapheme-grid');
const blocGrid      = document.getElementById('bloc-grid');
const graphSectionTitle  = document.getElementById('grapheme-section-title');
const blocSectionTitle   = document.getElementById('bloc-section-title');
const navLabel      = document.getElementById('nav-label');
const navBackBtn    = document.getElementById('nav-back-btn');
const blocInfo      = document.getElementById('bloc-info');
const questionBox   = document.getElementById('question-box');
const listenBtn     = document.getElementById('listen-btn');
const wordInput     = document.getElementById('word-input');
const feedbackEl    = document.getElementById('feedback');
const recopySection = document.getElementById('recopy-section');
const recopyWordDisplay = document.getElementById('recopy-word-display');
const recopyInput   = document.getElementById('recopy-input');
const recopyOk      = document.getElementById('recopy-ok');
const verifyBtn     = document.getElementById('verify-btn');
const newBtn        = document.getElementById('new-btn');
const recapBox      = document.getElementById('recap-box');
const recapScore    = document.getElementById('recap-score');
const recapDetail   = document.getElementById('recap-detail');
const nextBlocBtn      = document.getElementById('next-bloc-btn');
const changeBlocBtn    = document.getElementById('change-bloc-btn');
const changeGraphemeBtn = document.getElementById('change-grapheme-btn');

// ── État ──────────────────────────────────────────────────────────────────────
let selectedModule   = null;
let selectedGrapheme = null;
let blocs            = [];
let currentBlocIdx   = 0;
let currentWordIdx   = 0;
let correctCount     = 0;
let wordAnswered     = false;

// ── Web Speech ────────────────────────────────────────────────────────────────
speechSynthesis.onvoiceschanged = () => {};

function prononcerMot(mot) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(mot);
  u.lang = 'fr-FR';
  u.rate = 0.85;
  const voix = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
  if (voix) u.voice = voix;
  speechSynthesis.speak(u);
}

// ── Feedback unifié ───────────────────────────────────────────────────────────
function showFeedback(correct, msg) {
  feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
  feedbackEl.innerHTML = msg;
  if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
}

// ── Vues ──────────────────────────────────────────────────────────────────────
function showView(name) {
  viewModule.style.display   = name === 'module'   ? '' : 'none';
  viewGrapheme.style.display = name === 'grapheme' ? '' : 'none';
  viewBloc.style.display     = name === 'bloc'     ? '' : 'none';
  viewDictee.style.display   = name === 'dictee'   ? 'flex' : 'none';
}

// ── Navigation bar ────────────────────────────────────────────────────────────
function updateNavBar(view) {
  if (view === 'module') {
    navLabel.textContent = 'Choisir un module';
    navBackBtn.style.display = 'none';
  } else if (view === 'grapheme') {
    navLabel.textContent = selectedModule;
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToModule();
  } else if (view === 'bloc') {
    navLabel.textContent = selectedModule + ' — ' + selectedGrapheme;
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToGrapheme();
  } else {
    navLabel.textContent = selectedModule + ' — ' + selectedGrapheme;
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToBloc();
  }
}

// ── Vue 1 — Modules ───────────────────────────────────────────────────────────
function buildModuleGrid() {
  moduleGrid.innerHTML = '';
  Object.keys(DECODI_DATA).forEach(moduleName => {
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = moduleName;
    btn.addEventListener('click', () => selectModule(moduleName));
    moduleGrid.appendChild(btn);
  });
}

function goToModule() {
  selectedModule = null;
  selectedGrapheme = null;
  updateNavBar('module');
  showView('module');
  const first = moduleGrid.querySelector('.select-btn');
  if (first) first.focus();
}

function selectModule(moduleName) {
  selectedModule = moduleName;
  buildGraphemeGrid(moduleName);
  updateNavBar('grapheme');
  showView('grapheme');
  const first = graphemeGrid.querySelector('.select-btn');
  if (first) first.focus();
}

// ── Vue 2 — Graphèmes ─────────────────────────────────────────────────────────
function buildGraphemeGrid(moduleName) {
  graphemeGrid.innerHTML = '';
  graphSectionTitle.textContent = 'Choisir un graphème — ' + moduleName;
  Object.keys(DECODI_DATA[moduleName]).forEach(grapheme => {
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = grapheme;
    btn.addEventListener('click', () => selectGrapheme(grapheme));
    graphemeGrid.appendChild(btn);
  });
}

function goToGrapheme() {
  selectedGrapheme = null;
  buildGraphemeGrid(selectedModule);
  updateNavBar('grapheme');
  showView('grapheme');
  const first = graphemeGrid.querySelector('.select-btn');
  if (first) first.focus();
}

function selectGrapheme(grapheme) {
  selectedGrapheme = grapheme;
  const allWords = [...DECODI_DATA[selectedModule][grapheme]];
  blocs = [];
  for (let i = 0; i < allWords.length; i += BLOC_SIZE) {
    blocs.push(allWords.slice(i, i + BLOC_SIZE));
  }
  buildBlocGrid();
  updateNavBar('bloc');
  showView('bloc');
  const first = blocGrid.querySelector('.select-btn');
  if (first) first.focus();
}

// ── Vue 2b — Blocs ────────────────────────────────────────────────────────────
function buildBlocGrid() {
  blocGrid.innerHTML = '';
  blocSectionTitle.textContent = 'Choisir un bloc — ' + selectedGrapheme;
  blocs.forEach((bloc, idx) => {
    const btn = document.createElement('button');
    btn.className = 'select-btn bloc-btn';
    const preview = bloc.slice(0, 3).join(', ') + (bloc.length > 3 ? '…' : '');
    btn.innerHTML =
      `<span class="bloc-btn-title">Bloc ${idx + 1}</span>` +
      `<span class="bloc-btn-words">${preview}</span>`;
    btn.addEventListener('click', () => selectBloc(idx));
    blocGrid.appendChild(btn);
  });
}

function goToBloc() {
  buildBlocGrid();
  updateNavBar('bloc');
  showView('bloc');
  const first = blocGrid.querySelector('.select-btn');
  if (first) first.focus();
}

function selectBloc(idx) {
  startBloc(idx);
  updateNavBar('dictee');
  showView('dictee');
  listenBtn.focus();
}

// ── Vue 3 — Dictée ────────────────────────────────────────────────────────────
function startBloc(blocIdx) {
  currentBlocIdx = blocIdx;
  currentWordIdx = 0;
  correctCount   = 0;
  recapBox.style.display = 'none';
  startWord();
}

function startWord() {
  const bloc = blocs[currentBlocIdx];
  wordAnswered = false;

  blocInfo.textContent = `Bloc ${currentBlocIdx + 1} / ${blocs.length}`;

  questionBox.innerHTML =
    `<div style="font-size:18px;font-weight:700;color:#64748B;margin-bottom:6px;">Mot ${currentWordIdx + 1} / ${bloc.length}</div>` +
    `Écoute le mot, puis écris-le.`;

  wordInput.value = '';
  wordInput.disabled = false;
  wordInput.style.display = '';
  wordInput.focus();

  listenBtn.style.display = '';

  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';

  recopySection.style.display = 'none';
  recopyInput.value = '';
  recopyInput.disabled = false;
  recopyOk.classList.remove('visible');

  verifyBtn.style.display = '';
  verifyBtn.disabled = true;
  newBtn.classList.remove('visible');
  newBtn.textContent = currentWordIdx + 1 < bloc.length ? 'Mot suivant' : 'Voir le résultat';
}

function verifyWord() {
  if (wordAnswered) return;
  const mot    = blocs[currentBlocIdx][currentWordIdx];
  const saisie = wordInput.value.trim().toLowerCase();
  const correct = saisie === mot.trim().toLowerCase();

  wordAnswered = true;
  wordInput.disabled = true;
  verifyBtn.style.display = 'none';

  if (correct) {
    correctCount++;
    showFeedback(true, `Bravo ! <strong>${mot}</strong> s'écrit bien avec <strong>${selectedGrapheme}</strong>.`);
    newBtn.classList.add('visible');
    newBtn.focus();
  } else {
    showFeedback(false, `Pas tout à fait. Le mot était : <strong>${mot}</strong>`);
    showRecopy(mot);
  }
}

function showRecopy(mot) {
  recopyWordDisplay.textContent = mot;
  recopySection.style.display = 'flex';
  recopyInput.value = '';
  recopyInput.disabled = false;
  recopyInput.focus();
  recopyOk.classList.remove('visible');
  newBtn.classList.remove('visible');

  recopyInput.oninput = () => {
    if (recopyInput.value.trim().toLowerCase() === mot.trim().toLowerCase()) {
      recopyOk.classList.add('visible');
      recopyInput.disabled = true;
      newBtn.classList.add('visible');
      newBtn.focus();
    }
  };
}

function nextWord() {
  currentWordIdx++;
  if (currentWordIdx >= blocs[currentBlocIdx].length) {
    showRecap();
  } else {
    startWord();
  }
}

function showRecap() {
  const total = blocs[currentBlocIdx].length;
  questionBox.innerHTML = '';
  listenBtn.style.display    = 'none';
  wordInput.style.display    = 'none';
  feedbackEl.className       = 'feedback';
  recopySection.style.display = 'none';
  verifyBtn.style.display    = 'none';
  newBtn.classList.remove('visible');
  blocInfo.textContent = `Bloc ${currentBlocIdx + 1} / ${blocs.length} — terminé`;

  recapScore.textContent = `${correctCount} / ${total}`;
  recapDetail.textContent = correctCount === total ? 'Tous les mots sont bons !' :
                            correctCount >= total / 2 ? 'Bon travail !' :
                            "Continue à t'entraîner !";

  nextBlocBtn.style.display = currentBlocIdx + 1 < blocs.length ? '' : 'none';
  recapBox.style.display = '';
  const focusTarget = nextBlocBtn.style.display !== 'none' ? nextBlocBtn : changeBlocBtn;
  focusTarget.focus();
}

// ── Événements ────────────────────────────────────────────────────────────────
listenBtn.addEventListener('click', () => {
  prononcerMot(blocs[currentBlocIdx][currentWordIdx]);
});

wordInput.addEventListener('input', () => {
  verifyBtn.disabled = wordInput.value.trim() === '';
});

wordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !verifyBtn.disabled) verifyBtn.click();
});

verifyBtn.addEventListener('click', verifyWord);
newBtn.addEventListener('click', nextWord);

nextBlocBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  selectBloc(currentBlocIdx + 1);
});

changeBlocBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  goToBloc();
});

changeGraphemeBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  goToGrapheme();
});

// ── Démarrage ─────────────────────────────────────────────────────────────────
buildModuleGrid();
goToModule();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

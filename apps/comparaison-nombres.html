<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Comparaison de nombres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-units:    #3B7DD8;
    --color-tens:     #D64045;
    --color-hundreds: #3A9E6F;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: #F7F8FA;
    color: #1A1A2E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app-header {
    background: #C0272D;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .back-link:hover { color: #fff; }
  .app-header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 900;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .header-spacer { width: 80px; }

  .level-bar {
    background: #fff;
    border-bottom: 1px solid #E2E8F0;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .level-btn {
    padding: 10px 24px;
    border-radius: 999px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .level-btn.active { background: #C0272D; color: #fff; border-color: #C0272D; }
  .level-btn:not(.active):hover { background: #EEF2F7; border-color: #CBD5E0; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 40px;
    gap: 32px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  .question-box {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(17px, 3.5vw, 21px);
    font-weight: 800;
    color: #1A1A2E;
  }

  /* Comparison display */
  .comparison-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3vw, 24px);
    flex-wrap: nowrap;
    width: 100%;
  }

  .number-display {
    background: #fff;
    border: 2px solid #E2E8F0;
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    gap: 4px;
    align-items: baseline;
    justify-content: center;
    min-width: 110px;
    flex: 1;
    max-width: 200px;
  }

  .digit {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(36px, 8vw, 56px);
    font-weight: 900;
    line-height: 1;
  }
  .digit.units    { color: var(--color-units); }
  .digit.tens     { color: var(--color-tens); }
  .digit.hundreds { color: var(--color-hundreds); }
  .digit.thousands { color: var(--color-units); }

  /* Symbol buttons */
  .symbol-zone {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .symbol-btn {
    width: clamp(56px, 12vw, 72px);
    height: clamp(56px, 12vw, 72px);
    border-radius: 14px;
    border: 2.5px solid #E2E8F0;
    background: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 900;
    color: #1A1A2E;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .symbol-btn:hover { background: #EEF2F7; border-color: #3B7DD8; }
  .symbol-btn:active { transform: scale(0.95); }
  .symbol-btn.selected { background: #C0272D; color: #fff; border-color: #C0272D; }
  .symbol-btn.correct  { background: #D1FAE5; color: #065F46; border-color: #10B981; }
  .symbol-btn.wrong    { background: #FEE2E2; color: #991B1B; border-color: #EF4444; }
  .symbol-btn:disabled { cursor: default; }

  /* Digit legend */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #64748B;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .feedback {
    width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 800;
    display: none;
  }
  .feedback.correct { background: #D1FAE5; color: #065F46; display: block; }
  .feedback.wrong   { background: #FEE2E2; color: #991B1B; display: block; }

  .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .new-btn {
    padding: 16px 36px;
    background: #0F7860;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 56px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: #0A5C48; }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>🔢 Comparaison de nombres</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1 · jusqu'à 999</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2 · jusqu'à 9999</button>
</div>

<main>
  <div class="question-box" id="question-box">Place le bon symbole entre les deux nombres.</div>

  <div class="comparison-row" id="comparison-row">
    <div class="number-display" id="num-left"></div>
    <div class="symbol-zone" id="symbol-zone"></div>
    <div class="number-display" id="num-right"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="feedback" id="feedback"></div>

  <div class="action-row">
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<script>
  const PLACE_COLORS = ['--color-units', '--color-tens', '--color-hundreds'];
  function colorForRank(rank) { return `var(${PLACE_COLORS[rank % 3]})`; }
  function classForRank(rank) { return ['units', 'tens', 'hundreds', 'thousands'][rank] || 'units'; }

  let currentLevel = 1;
  let state = {};

  const numLeft = document.getElementById('num-left');
  const numRight = document.getElementById('num-right');
  const symbolZone = document.getElementById('symbol-zone');
  const feedbackEl = document.getElementById('feedback');
  const newBtn = document.getElementById('new-btn');
  const legend = document.getElementById('legend');

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function renderNumber(container, n) {
    container.innerHTML = '';
    const digits = String(n).split('');
    const len = digits.length;
    digits.forEach((d, i) => {
      const rank = len - 1 - i;
      const span = document.createElement('span');
      span.className = 'digit ' + classForRank(rank);
      span.style.color = colorForRank(rank);
      span.textContent = d;
      container.appendChild(span);
    });
  }

  function renderLegend(maxDigits) {
    legend.innerHTML = '';
    const allRanks = [
      { label: 'Milliers', rank: 3 },
      { label: 'Centaines', rank: 2 },
      { label: 'Dizaines', rank: 1 },
      { label: 'Unités', rank: 0 }
    ];
    allRanks.filter(r => r.rank < maxDigits).forEach(({ label, rank }) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const dot = document.createElement('div');
      dot.className = 'legend-dot';
      dot.style.background = colorForRank(rank);
      item.appendChild(dot);
      item.appendChild(document.createTextNode(label));
      legend.appendChild(item);
    });
  }

  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    newBtn.classList.add('visible');
  }

  function setup() {
    let a, b;
    const max = currentLevel === 1 ? 999 : 9999;
    const min = currentLevel === 1 ? 100 : 1000;
    do {
      a = randInt(min, max);
      b = randInt(min, max);
    } while (a === b);

    const correct = a < b ? '<' : '>';
    state = { a, b, correct, answered: false };

    renderNumber(numLeft, a);
    renderNumber(numRight, b);
    renderLegend(String(max).length);

    symbolZone.innerHTML = '';
    ['<', '>'].forEach(sym => {
      const btn = document.createElement('button');
      btn.className = 'symbol-btn';
      btn.textContent = sym;
      btn.addEventListener('click', () => answer(sym, btn));
      symbolZone.appendChild(btn);
    });

    feedbackEl.className = 'feedback';
    newBtn.classList.remove('visible');
  }

  function answer(sym, btn) {
    if (state.answered) return;
    state.answered = true;
    const correct = sym === state.correct;

    document.querySelectorAll('.symbol-btn').forEach(b => {
      b.disabled = true;
      if (b.textContent === state.correct) b.classList.add('correct');
      else if (b === btn) b.classList.add('wrong');
    });

    const symLabel = state.correct === '<' ? 'est plus petit que' : 'est plus grand que';
    showFeedback(correct,
      correct
        ? `Bravo ! ${state.a} ${state.correct} ${state.b}, c'est juste.`
        : `Pas tout à fait. Il fallait « ${state.correct} » car ${state.a} ${symLabel} ${state.b}.`
    );
  }

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      setup();
    });
  });

  newBtn.addEventListener('click', setup);
  setup();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

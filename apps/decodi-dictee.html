<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dictée DéCoDi — Modules 6-10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  :root {
    --app-header-bg: #B8960C;
  }

  /* ── Navigation contextuelle (remplace level-bar) ────────────────── */
  .nav-bar {
    background: #fff;
    border-bottom: 1px solid var(--app-border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
  }
  .nav-bar-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #64748B;
    white-space: nowrap;
    flex: 1;
  }
  .nav-back-btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--app-border);
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .nav-back-btn:hover  { background: #EEF2F7; }
  .nav-back-btn:active { background: #E2EAF4; }

  /* ── Grilles de sélection ────────────────────────────────────────── */
  .select-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    width: 100%;
  }
  .select-btn {
    padding: 14px 22px;
    border-radius: 12px;
    border: 2px solid var(--app-border);
    background: #fff;
    color: var(--app-text);
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    min-height: 52px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .select-btn:hover  { background: #FBF5D6; border-color: #B8960C; color: #7A6200; }
  .select-btn:active { background: #F5ECC0; }

  .select-section-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #64748B;
    text-align: center;
    width: 100%;
    margin-bottom: -4px;
  }

  /* ── Vue dictée ──────────────────────────────────────────────────── */
  #view-dictee {
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .bloc-info {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #64748B;
    text-align: center;
  }

  .word-input {
    width: 100%;
    max-width: 340px;
    padding: 16px 20px;
    border: 2px solid var(--app-border);
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    text-align: center;
    color: var(--app-text);
    background: #fff;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: border-color 0.15s, outline 0.1s;
  }
  .word-input:focus { border-color: #B8960C; outline: 3px solid #B8960C; outline-offset: 2px; }

  .listen-btn {
    padding: 14px 28px;
    background: var(--app-header-bg);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 54px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: background 0.15s;
  }
  .listen-btn:hover  { background: #9A7A08; }
  .listen-btn:active { background: #7A6200; }

  /* ── Recopie ─────────────────────────────────────────────────────── */
  .recopy-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .recopy-label {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--app-wrong-fg);
    text-align: center;
  }
  .recopy-input {
    width: 100%;
    max-width: 340px;
    padding: 14px 20px;
    border: 2px solid #FECACA;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    text-align: center;
    color: var(--app-text);
    background: #fff;
    min-height: 60px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: border-color 0.15s, outline 0.1s;
  }
  .recopy-input:focus { border-color: #D64045; outline: 3px solid #D64045; outline-offset: 2px; }
  .recopy-ok {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--app-correct-fg);
    display: none;
  }
  .recopy-ok.visible { display: block; }

  /* ── Récapitulatif ───────────────────────────────────────────────── */
  .recap-box {
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    width: 100%;
  }
  .recap-score {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 900;
    color: var(--app-text);
    margin-bottom: 8px;
  }
  .recap-detail {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    color: #64748B;
    margin-bottom: 0;
  }
  .recap-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>✍️ Dictée DéCoDi</h1>
  <div class="header-spacer"></div>
</header>

<div class="nav-bar" id="nav-bar" role="group" aria-label="Navigation dans l'activité">
  <span class="nav-bar-title" id="nav-label">Choisir un module</span>
  <button class="nav-back-btn" id="nav-back-btn" style="display:none">← Retour</button>
</div>

<main>

  <!-- VUE 1 — Sélection du module -->
  <div id="view-module">
    <p class="select-section-title">Choisir un module</p>
    <div class="select-grid" id="module-grid"></div>
  </div>

  <!-- VUE 2 — Sélection du graphème -->
  <div id="view-grapheme" style="display:none">
    <p class="select-section-title" id="grapheme-section-title">Choisir un graphème</p>
    <div class="select-grid" id="grapheme-grid"></div>
  </div>

  <!-- VUE 3 — Dictée -->
  <div id="view-dictee" style="display:none">

    <p class="bloc-info" id="bloc-info"></p>

    <div class="question-box" id="question-box"></div>

    <button class="listen-btn" id="listen-btn">🔊 Écouter</button>

    <input
      class="word-input"
      id="word-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Écris le mot ici"
      aria-label="Saisir le mot dicté"
    >

    <div class="feedback" id="feedback"></div>

    <div class="recopy-section" id="recopy-section" style="display:none">
      <p class="recopy-label">Recopie le mot : <strong id="recopy-word-display"></strong></p>
      <input
        class="recopy-input"
        id="recopy-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        aria-label="Recopier le mot"
      >
      <p class="recopy-ok" id="recopy-ok">Bien recopié !</p>
    </div>

    <div class="action-row">
      <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
      <button class="new-btn" id="new-btn">Mot suivant</button>
    </div>

    <!-- Récapitulatif de fin de bloc -->
    <div class="recap-box" id="recap-box" style="display:none">
      <p class="recap-score" id="recap-score"></p>
      <p class="recap-detail" id="recap-detail"></p>
      <div class="recap-actions">
        <button class="verify-btn" id="next-bloc-btn" style="display:none">Bloc suivant</button>
        <button class="new-btn visible" id="change-grapheme-btn">Changer de graphème</button>
      </div>
    </div>

  </div>

</main>

<script src="appUtils.js"></script>
<script>
// ── Données — Modules 6 à 10 (C1 / 3H-4H) ───────────────────────────────────
const DECODI_DATA = {
  "Module 6": {
    "ss": ["fossé","brosse","mousse","bosse","trousse","tissu","tasse","chasse","frousse","assis","passé","rousse","lisse","rassure","passent","pousse","tousse"],
    "n":  ["bassine","farine","prune","journal","tartine","nid","banane","tourne","fini","bonne","journée","nature","note","mine","maline","tourné","animal","numéro"],
    "è-ê-ë": ["chèvre","trèfle","forêt","lièvre","vipère","fourmilière","fièvre","frère","fête","chêne","père","lumière","lève","élève","promène","après","problème","très","prêt","bête","fière"]
  },
  "Module 7": {
    "s":     ["valise","trésor","fusil","usine","épuisé","surprise","méprise","rusé","utilisent","posent","poste","sabre","soupe","piste","salle","ours","sou","sport","sportif","journaliste","sourient","poursuivent"],
    "on-om": ["violon","buisson","hérisson","homme","charbon","tronc","bouchon","pont","montre","télévision","violoniste","sonne","frisson","son","résonne","ont","volonté","long","bon","sont","font"],
    "d":     ["dos","monde","dune","doudoune","douche","soldat","vide","dès","nomade","possèdent","tondent","produisent","mode","dur","idéal","idée","balade","départ","malade","altitude","dure","admire","formidable","dire"]
  },
  "Module 8": {
    "en-em-an-am": ["panda","maman","bambou","viande","branche","panthère","savane","antilope","dent","animal","blanche","pendant","ans","plante","temps","prend","souvent","suspendre","résistant","trente","aliment","ensemble","surprend","mordant","défense","puissant","méfiante","sentir","apprendre","chante"],
    "qu": ["équipe","orque","banquise","quarante","flaque","moustique","pastèque","attaquant","marque","fréquent","manque","qualifie","fantastique","Arctique","Antarctique","traque","attaque","scientifique","quasiment","jusque"],
    "oi": ["bois","noir","oie","avoine","framboise","poire","doigt","poil","froid","mois","proie","parfois","assoient","voit","foie","oison","mémoire","endroit","voix","choisi","toi","voir","maladroit","choix","avoir","pouvoir","boire"]
  },
  "Module 9": {
    "e":      ["fenêtre","cheval","renard","melon","chemise","refuse","propreté","environnement","saleté","appartement","retrouve","rapidement","jeton","petit","veste","lettre","lunettes","poubelle","verre","univers","Terre","espoir","préservons","appelle","belle","tristesse","nouvelle","cette","jette","terrible","super","quelques","mettre","personne","perd","reste","ferme","naturellement","tellement","devienne"],
    "er-ez-et": ["poulet","fermier","tablier","robinet","saladier","boucher","nez","chantier","atelier","violet","préparer","diner","premier","laver","déposer","saler","poivrer","huiler","enfourner","tourner","métier","pratiquer","poissonnier","bijoutier","chez","ouvrier","menuisier","objet","dernier","assez"],
    "in-im": ["bottines","lutin","lapin","sapin","chemin","jardin","épinards","romarin","inquiet","terminer","impuissant","matin","insu","individu","fini","impressionné","invité","minuit","introduire","installe","instant","pétrin","inquiéter","interdit","imprudent","voisin","jardinier","brin","festin","malin","machine","important","intéressant"]
  },
  "Module 10": {
    "ai-ei": ["aile","baleine","reine","laine","maison","madeleine","fraise","lait","monnaie","venait","appelait","anniversaire","marraine","était","souhait","aimable","aimait","avait","malaise","domaine","épaisse","promenait","dormait","paisiblement","baiser","désormais","plaisir","achetait","laitier","passait","livrait","donnait","frais","vrai","jamais"],
    "c-ç":  ["collier","café","école","costume","clé","sac","découvre","cours","écrire","classe","compter","récré","courir","calme","rencontre","camarade","scolaire","spectacle","raconte","raconté","acte","public","citron","ciel","balançoire","scène","français","merci","reçoivent","leçon","ça","silence","remercie","félicite","nécessaire","vacances","concentré","commence"],
    "au-eau": ["autruche","bateau","chaussure","ruisseau","corbeau","crapaud","épaule","chameau","jaune","oiseau","saucisse","eau","animaux","niveau","autre","pauvre","peau","chaud","troupeau","saute","hausse","aussitôt","sauvé","beau","chauffer"]
  }
};

const BLOC_SIZE = 7;

// ── Références DOM ────────────────────────────────────────────────────────────
const viewModule    = document.getElementById('view-module');
const viewGrapheme  = document.getElementById('view-grapheme');
const viewDictee    = document.getElementById('view-dictee');
const moduleGrid    = document.getElementById('module-grid');
const graphemeGrid  = document.getElementById('grapheme-grid');
const graphSectionTitle = document.getElementById('grapheme-section-title');
const navLabel      = document.getElementById('nav-label');
const navBackBtn    = document.getElementById('nav-back-btn');
const blocInfo      = document.getElementById('bloc-info');
const questionBox   = document.getElementById('question-box');
const listenBtn     = document.getElementById('listen-btn');
const wordInput     = document.getElementById('word-input');
const feedbackEl    = document.getElementById('feedback');
const recopySection = document.getElementById('recopy-section');
const recopyWordDisplay = document.getElementById('recopy-word-display');
const recopyInput   = document.getElementById('recopy-input');
const recopyOk      = document.getElementById('recopy-ok');
const verifyBtn     = document.getElementById('verify-btn');
const newBtn        = document.getElementById('new-btn');
const recapBox      = document.getElementById('recap-box');
const recapScore    = document.getElementById('recap-score');
const recapDetail   = document.getElementById('recap-detail');
const nextBlocBtn   = document.getElementById('next-bloc-btn');
const changeGraphemeBtn = document.getElementById('change-grapheme-btn');

// ── État ──────────────────────────────────────────────────────────────────────
let selectedModule   = null;
let selectedGrapheme = null;
let blocs            = [];
let currentBlocIdx   = 0;
let currentWordIdx   = 0;
let correctCount     = 0;
let wordAnswered     = false;

// ── Web Speech ────────────────────────────────────────────────────────────────
speechSynthesis.onvoiceschanged = () => {};

function prononcerMot(mot) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(mot);
  u.lang = 'fr-FR';
  u.rate = 0.85;
  const voix = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
  if (voix) u.voice = voix;
  speechSynthesis.speak(u);
}

// ── Feedback unifié ───────────────────────────────────────────────────────────
function showFeedback(correct, msg) {
  feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
  feedbackEl.innerHTML = msg;
  if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
}

// ── Vues ──────────────────────────────────────────────────────────────────────
function showView(name) {
  viewModule.style.display   = name === 'module'   ? '' : 'none';
  viewGrapheme.style.display = name === 'grapheme' ? '' : 'none';
  viewDictee.style.display   = name === 'dictee'   ? 'flex' : 'none';
}

// ── Navigation bar ────────────────────────────────────────────────────────────
function updateNavBar(view) {
  if (view === 'module') {
    navLabel.textContent = 'Choisir un module';
    navBackBtn.style.display = 'none';
  } else if (view === 'grapheme') {
    navLabel.textContent = selectedModule;
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToModule();
  } else {
    navLabel.textContent = selectedModule + ' — ' + selectedGrapheme;
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToGrapheme();
  }
}

// ── Vue 1 — Modules ───────────────────────────────────────────────────────────
function buildModuleGrid() {
  moduleGrid.innerHTML = '';
  Object.keys(DECODI_DATA).forEach(moduleName => {
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = moduleName;
    btn.addEventListener('click', () => selectModule(moduleName));
    moduleGrid.appendChild(btn);
  });
}

function goToModule() {
  selectedModule = null;
  selectedGrapheme = null;
  updateNavBar('module');
  showView('module');
}

function selectModule(moduleName) {
  selectedModule = moduleName;
  buildGraphemeGrid(moduleName);
  updateNavBar('grapheme');
  showView('grapheme');
}

// ── Vue 2 — Graphèmes ─────────────────────────────────────────────────────────
function buildGraphemeGrid(moduleName) {
  graphemeGrid.innerHTML = '';
  graphSectionTitle.textContent = 'Choisir un graphème — ' + moduleName;
  Object.keys(DECODI_DATA[moduleName]).forEach(grapheme => {
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = grapheme;
    btn.addEventListener('click', () => selectGrapheme(grapheme));
    graphemeGrid.appendChild(btn);
  });
}

function goToGrapheme() {
  selectedGrapheme = null;
  buildGraphemeGrid(selectedModule);
  updateNavBar('grapheme');
  showView('grapheme');
}

function selectGrapheme(grapheme) {
  selectedGrapheme = grapheme;
  const allWords = [...DECODI_DATA[selectedModule][grapheme]];
  blocs = [];
  for (let i = 0; i < allWords.length; i += BLOC_SIZE) {
    blocs.push(allWords.slice(i, i + BLOC_SIZE));
  }
  currentBlocIdx = 0;
  startBloc(0);
  updateNavBar('dictee');
  showView('dictee');
}

// ── Vue 3 — Dictée ────────────────────────────────────────────────────────────
function startBloc(blocIdx) {
  currentBlocIdx = blocIdx;
  currentWordIdx = 0;
  correctCount   = 0;
  recapBox.style.display = 'none';
  startWord();
}

function startWord() {
  const bloc = blocs[currentBlocIdx];
  wordAnswered = false;

  blocInfo.textContent = `Bloc ${currentBlocIdx + 1} / ${blocs.length}`;

  questionBox.innerHTML =
    `<div style="font-size:14px;font-weight:700;color:#64748B;margin-bottom:6px;">Mot ${currentWordIdx + 1} / ${bloc.length}</div>` +
    `Écoute le mot, puis écris-le.`;

  wordInput.value = '';
  wordInput.disabled = false;
  wordInput.style.display = '';
  wordInput.focus();

  listenBtn.style.display = '';

  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';

  recopySection.style.display = 'none';
  recopyInput.value = '';
  recopyInput.disabled = false;
  recopyOk.classList.remove('visible');

  verifyBtn.style.display = '';
  verifyBtn.disabled = true;
  newBtn.classList.remove('visible');
  newBtn.textContent = currentWordIdx + 1 < bloc.length ? 'Mot suivant' : 'Voir le résultat';
}

function verifyWord() {
  if (wordAnswered) return;
  const mot    = blocs[currentBlocIdx][currentWordIdx];
  const saisie = wordInput.value.trim().toLowerCase();
  const correct = saisie === mot.trim().toLowerCase();

  wordAnswered = true;
  wordInput.disabled = true;
  verifyBtn.style.display = 'none';

  if (correct) {
    correctCount++;
    showFeedback(true, `Bravo ! <strong>${mot}</strong> s'écrit bien avec <strong>${selectedGrapheme}</strong>.`);
    newBtn.classList.add('visible');
  } else {
    showFeedback(false, `Pas tout à fait. Le mot était : <strong>${mot}</strong>`);
    showRecopy(mot);
  }
}

function showRecopy(mot) {
  recopyWordDisplay.textContent = mot;
  recopySection.style.display = 'flex';
  recopyInput.value = '';
  recopyInput.disabled = false;
  recopyInput.focus();
  recopyOk.classList.remove('visible');
  newBtn.classList.remove('visible');

  recopyInput.oninput = () => {
    if (recopyInput.value.trim().toLowerCase() === mot.trim().toLowerCase()) {
      recopyOk.classList.add('visible');
      recopyInput.disabled = true;
      newBtn.classList.add('visible');
    }
  };
}

function nextWord() {
  currentWordIdx++;
  if (currentWordIdx >= blocs[currentBlocIdx].length) {
    showRecap();
  } else {
    startWord();
  }
}

function showRecap() {
  const total = blocs[currentBlocIdx].length;
  questionBox.innerHTML = '';
  listenBtn.style.display    = 'none';
  wordInput.style.display    = 'none';
  feedbackEl.className       = 'feedback';
  recopySection.style.display = 'none';
  verifyBtn.style.display    = 'none';
  newBtn.classList.remove('visible');
  blocInfo.textContent = `Bloc ${currentBlocIdx + 1} / ${blocs.length} — terminé`;

  recapScore.textContent = `${correctCount} / ${total}`;
  recapDetail.textContent = correctCount === total ? 'Tous les mots sont bons !' :
                            correctCount >= total / 2 ? 'Bon travail !' :
                            "Continue à t'entraîner !";

  nextBlocBtn.style.display = currentBlocIdx + 1 < blocs.length ? '' : 'none';
  recapBox.style.display = '';
}

// ── Événements ────────────────────────────────────────────────────────────────
listenBtn.addEventListener('click', () => {
  prononcerMot(blocs[currentBlocIdx][currentWordIdx]);
});

wordInput.addEventListener('input', () => {
  verifyBtn.disabled = wordInput.value.trim() === '';
});

wordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !verifyBtn.disabled) verifyBtn.click();
});

verifyBtn.addEventListener('click', verifyWord);
newBtn.addEventListener('click', nextWord);

nextBlocBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  startBloc(currentBlocIdx + 1);
});

changeGraphemeBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  goToGrapheme();
});

// ── Démarrage ─────────────────────────────────────────────────────────────────
buildModuleGrid();
goToModule();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

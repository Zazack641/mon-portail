<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dictée DéCoDi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  :root {
    --app-header-bg: #B8960C;
  }

  /* ── Navigation DéCoDi (remplace level-bar) ─────────────────────── */
  .nav-bar {
    background: #fff;
    border-bottom: 1px solid var(--app-border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
  }
  .nav-bar-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #64748B;
    white-space: nowrap;
  }
  .nav-bar-path {
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--app-text);
    flex: 1;
  }
  .nav-back-btn {
    padding: 8px 18px;
    border-radius: 999px;
    border: 2px solid var(--app-border);
    background: #F8FAFC;
    color: #4A5568;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: background 0.15s;
  }
  .nav-back-btn:hover { background: #EEF2F7; }

  /* ── Grilles de sélection (modules et graphèmes) ─────────────────── */
  .select-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    width: 100%;
  }
  .select-btn {
    padding: 14px 22px;
    border-radius: 12px;
    border: 2px solid var(--app-border);
    background: #fff;
    color: var(--app-text);
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    min-height: 52px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .select-btn:hover  { background: #FBF5D6; border-color: #B8960C; color: #7A6200; }
  .select-btn:active { background: #F5ECC0; }

  .select-section-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #64748B;
    text-align: center;
    width: 100%;
    margin-bottom: -4px;
  }

  /* ── Vue dictée ──────────────────────────────────────────────────── */
  .bloc-info {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #64748B;
    text-align: center;
  }

  .word-input {
    width: 100%;
    max-width: 340px;
    padding: 16px 20px;
    border: 2px solid var(--app-border);
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    text-align: center;
    color: var(--app-text);
    background: #fff;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    outline: none;
    transition: border-color 0.15s;
  }
  .word-input:focus { border-color: #B8960C; }

  .listen-btn {
    padding: 14px 28px;
    background: var(--app-header-bg);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 54px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: background 0.15s;
    letter-spacing: 0.01em;
  }
  .listen-btn:hover  { background: #9A7A08; }
  .listen-btn:active { background: #7A6200; }

  /* ── Recopie ─────────────────────────────────────────────────────── */
  .recopy-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .recopy-label {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--app-wrong-fg);
    text-align: center;
  }
  .recopy-input {
    width: 100%;
    max-width: 340px;
    padding: 14px 20px;
    border: 2px solid #FECACA;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    text-align: center;
    color: var(--app-text);
    background: #fff;
    min-height: 60px;
    touch-action: manipulation;
    -webkit-appearance: none;
    outline: none;
    transition: border-color 0.15s;
  }
  .recopy-input:focus { border-color: #D64045; }
  .recopy-ok {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--app-correct-fg);
    display: none;
  }
  .recopy-ok.visible { display: block; }

  /* ── Récapitulatif ───────────────────────────────────────────────── */
  .recap-box {
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    width: 100%;
  }
  .recap-score {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 900;
    color: var(--app-text);
    margin-bottom: 8px;
  }
  .recap-detail {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    color: #64748B;
  }
</style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>✍️ Dictée DéCoDi</h1>
  <div class="header-spacer"></div>
</header>

<!-- Barre de navigation contextuelle (remplace level-bar) -->
<div class="nav-bar" id="nav-bar" aria-label="Navigation" role="navigation">
  <span class="nav-bar-title" id="nav-label">Choisir un module</span>
  <span class="nav-bar-path" id="nav-path"></span>
  <button class="nav-back-btn" id="nav-back-btn" style="display:none">← Retour</button>
</div>

<main>

  <!-- VUE 1 — Sélection du module -->
  <div id="view-module">
    <p class="select-section-title">Choisir un module</p>
    <div class="select-grid" id="module-grid"></div>
  </div>

  <!-- VUE 2 — Sélection du graphème -->
  <div id="view-grapheme" style="display:none">
    <p class="select-section-title" id="grapheme-section-title">Choisir un graphème</p>
    <div class="select-grid" id="grapheme-grid"></div>
  </div>

  <!-- VUE 3 — Dictée -->
  <div id="view-dictee" style="display:none; width:100%; display:none; flex-direction:column; align-items:center; gap:20px;">

    <p class="bloc-info" id="bloc-info"></p>

    <div class="question-box" id="question-box"></div>

    <button class="listen-btn" id="listen-btn">🔊 Écouter</button>

    <input
      class="word-input"
      id="word-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Écris le mot ici"
      aria-label="Saisir le mot dicté"
    >

    <div class="feedback" id="feedback"></div>

    <div class="recopy-section" id="recopy-section" style="display:none">
      <p class="recopy-label">Recopie le mot : <strong id="recopy-word-display"></strong></p>
      <input
        class="recopy-input"
        id="recopy-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        aria-label="Recopier le mot"
      >
      <p class="recopy-ok" id="recopy-ok">Bien recopié !</p>
    </div>

    <div class="action-row">
      <button class="verify-btn" id="verify-btn" disabled>Vérifier</button>
      <button class="new-btn" id="new-btn">Mot suivant</button>
    </div>

    <!-- Récapitulatif de fin de bloc -->
    <div class="recap-box" id="recap-box" style="display:none">
      <p class="recap-score" id="recap-score"></p>
      <p class="recap-detail" id="recap-detail"></p>
      <div class="action-row" style="margin-top:20px;">
        <button class="verify-btn" id="next-bloc-btn" style="display:none">Bloc suivant</button>
        <button class="new-btn visible" id="change-grapheme-btn">Changer de graphème</button>
      </div>
    </div>

  </div>

</main>

<script src="appUtils.js"></script>

const BLOC_SIZE = 7;

// ── Références DOM ────────────────────────────────────────────────────────────
const viewModule    = document.getElementById('view-module');
const viewGrapheme  = document.getElementById('view-grapheme');
const viewDictee    = document.getElementById('view-dictee');
const moduleGrid    = document.getElementById('module-grid');
const graphemeGrid  = document.getElementById('grapheme-grid');
const graphSectionTitle = document.getElementById('grapheme-section-title');
const navLabel      = document.getElementById('nav-label');
const navPath       = document.getElementById('nav-path');
const navBackBtn    = document.getElementById('nav-back-btn');
const blocInfo      = document.getElementById('bloc-info');
const questionBox   = document.getElementById('question-box');
const listenBtn     = document.getElementById('listen-btn');
const wordInput     = document.getElementById('word-input');
const feedbackEl    = document.getElementById('feedback');
const recopySection = document.getElementById('recopy-section');
const recopyWordDisplay = document.getElementById('recopy-word-display');
const recopyInput   = document.getElementById('recopy-input');
const recopyOk      = document.getElementById('recopy-ok');
const verifyBtn     = document.getElementById('verify-btn');
const newBtn        = document.getElementById('new-btn');
const recapBox      = document.getElementById('recap-box');
const recapScore    = document.getElementById('recap-score');
const recapDetail   = document.getElementById('recap-detail');
const nextBlocBtn   = document.getElementById('next-bloc-btn');
const changeGraphemeBtn = document.getElementById('change-grapheme-btn');

// ── État ──────────────────────────────────────────────────────────────────────
let selectedModule  = null;
let selectedGrapheme = null;
let allWords        = [];   // tous les mots du graphème
let blocs           = [];   // tableau de tableaux (7 mots par bloc)
let currentBlocIdx  = 0;
let currentWordIdx  = 0;    // index dans le bloc en cours
let correctCount    = 0;
let wordAnswered    = false; // true une fois que la réponse est validée

// ── Web Speech ────────────────────────────────────────────────────────────────
speechSynthesis.onvoiceschanged = () => {};

function prononcerMot(mot) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(mot);
  u.lang = 'fr-FR';
  u.rate = 0.85;
  const voix = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
  if (voix) u.voice = voix;
  speechSynthesis.speak(u);
}

// ── Vues ──────────────────────────────────────────────────────────────────────
function showView(name) {
  viewModule.style.display   = name === 'module'   ? '' : 'none';
  viewGrapheme.style.display = name === 'grapheme' ? '' : 'none';
  viewDictee.style.display   = name === 'dictee'   ? 'flex' : 'none';
}

// ── Navigation bar ────────────────────────────────────────────────────────────
function updateNavBar(view) {
  if (view === 'module') {
    navLabel.textContent = 'Choisir un module';
    navPath.textContent  = '';
    navBackBtn.style.display = 'none';
  } else if (view === 'grapheme') {
    navLabel.textContent = selectedModule;
    navPath.textContent  = '';
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToModule();
  } else {
    navLabel.textContent = selectedModule + ' — ' + selectedGrapheme;
    navPath.textContent  = '';
    navBackBtn.style.display = '';
    navBackBtn.onclick = () => goToGrapheme();
  }
}

// ── Vue 1 — Modules ───────────────────────────────────────────────────────────
function buildModuleGrid() {
  moduleGrid.innerHTML = '';
  Object.keys(DECODI_DATA).forEach(moduleName => {
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = moduleName;
    btn.addEventListener('click', () => selectModule(moduleName));
    moduleGrid.appendChild(btn);
  });
}

function goToModule() {
  selectedModule = null;
  selectedGrapheme = null;
  updateNavBar('module');
  showView('module');
}

function selectModule(moduleName) {
  selectedModule = moduleName;
  buildGraphemeGrid(moduleName);
  updateNavBar('grapheme');
  showView('grapheme');
}

// ── Vue 2 — Graphèmes ─────────────────────────────────────────────────────────
function buildGraphemeGrid(moduleName) {
  graphemeGrid.innerHTML = '';
  graphSectionTitle.textContent = 'Choisir un graphème — ' + moduleName;
  Object.keys(DECODI_DATA[moduleName]).forEach(grapheme => {
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = grapheme;
    btn.addEventListener('click', () => selectGrapheme(grapheme));
    graphemeGrid.appendChild(btn);
  });
}

function goToGrapheme() {
  selectedGrapheme = null;
  buildGraphemeGrid(selectedModule);
  updateNavBar('grapheme');
  showView('grapheme');
}

function selectGrapheme(grapheme) {
  selectedGrapheme = grapheme;
  allWords = [...DECODI_DATA[selectedModule][grapheme]];
  // Découper en blocs de 7
  blocs = [];
  for (let i = 0; i < allWords.length; i += BLOC_SIZE) {
    blocs.push(allWords.slice(i, i + BLOC_SIZE));
  }
  currentBlocIdx = 0;
  startBloc(0);
  updateNavBar('dictee');
  showView('dictee');
}

// ── Vue 3 — Dictée ────────────────────────────────────────────────────────────
function startBloc(blocIdx) {
  currentBlocIdx = blocIdx;
  currentWordIdx = 0;
  correctCount   = 0;
  recapBox.style.display = 'none';
  startWord();
}

function startWord() {
  const bloc = blocs[currentBlocIdx];
  const mot  = bloc[currentWordIdx];
  wordAnswered = false;

  // Barre de progression
  blocInfo.textContent = `Bloc ${currentBlocIdx + 1} / ${blocs.length}`;

  // Question
  questionBox.innerHTML =
    `<div style="font-size:14px;font-weight:700;color:#64748B;margin-bottom:6px;">Mot ${currentWordIdx + 1} / ${bloc.length}</div>` +
    `Écoute le mot, puis écris-le.`;

  // Champ de saisie
  wordInput.value = '';
  wordInput.disabled = false;
  wordInput.style.display = '';
  wordInput.focus();

  // Bouton écouter
  listenBtn.style.display = '';

  // Feedback
  feedbackEl.className = 'feedback';
  feedbackEl.textContent = '';

  // Recopie
  recopySection.style.display = 'none';
  recopyInput.value = '';
  recopyOk.classList.remove('visible');

  // Boutons d'action
  verifyBtn.style.display = '';
  verifyBtn.disabled = true;
  newBtn.classList.remove('visible');
  newBtn.textContent = currentWordIdx + 1 < bloc.length ? 'Mot suivant' : 'Voir le résultat';
}

function verifyWord() {
  if (wordAnswered) return;
  const bloc   = blocs[currentBlocIdx];
  const mot    = bloc[currentWordIdx];
  const saisie = wordInput.value.trim().toLowerCase();
  const correct = saisie === mot.trim().toLowerCase();

  wordAnswered = true;
  wordInput.disabled = true;
  verifyBtn.style.display = 'none';

  if (correct) {
    correctCount++;
    feedbackEl.className = 'feedback correct';
    feedbackEl.textContent = '✓ Bravo !';
    playCorrect();
    launchConfetti();
    newBtn.classList.add('visible');
  } else {
    feedbackEl.className = 'feedback wrong';
    feedbackEl.innerHTML = `Pas tout à fait. Le mot était : <strong>${mot}</strong>`;
    playIncorrect();
    showRecopy(mot);
  }
}

function showRecopy(mot) {
  recopyWordDisplay.textContent = mot;
  recopySection.style.display = 'flex';
  recopyInput.value = '';
  recopyInput.focus();
  recopyOk.classList.remove('visible');
  newBtn.classList.remove('visible');

  recopyInput.oninput = () => {
    const ok = recopyInput.value.trim().toLowerCase() === mot.trim().toLowerCase();
    if (ok) {
      recopyOk.classList.add('visible');
      recopyInput.disabled = true;
      newBtn.classList.add('visible');
    }
  };
}

function nextWord() {
  const bloc = blocs[currentBlocIdx];
  currentWordIdx++;
  if (currentWordIdx >= bloc.length) {
    showRecap();
  } else {
    startWord();
  }
}

function showRecap() {
  const total = blocs[currentBlocIdx].length;
  questionBox.innerHTML = '';
  listenBtn.style.display   = 'none';
  wordInput.style.display   = 'none';
  feedbackEl.className      = 'feedback';
  recopySection.style.display = 'none';
  verifyBtn.style.display   = 'none';
  newBtn.classList.remove('visible');
  blocInfo.textContent = `Bloc ${currentBlocIdx + 1} / ${blocs.length} — terminé`;

  recapScore.textContent = `${correctCount} / ${total}`;
  const adjective = correctCount === total ? 'Tous les mots sont bons !' :
                    correctCount >= total / 2 ? 'Bon travail !' : "Continue à t'entraîner !";
  recapDetail.textContent = adjective;

  nextBlocBtn.style.display   = currentBlocIdx + 1 < blocs.length ? '' : 'none';
  recapBox.style.display = '';
}

// ── Événements ────────────────────────────────────────────────────────────────
listenBtn.addEventListener('click', () => {
  const mot = blocs[currentBlocIdx][currentWordIdx];
  prononcerMot(mot);
});

wordInput.addEventListener('input', () => {
  verifyBtn.disabled = wordInput.value.trim() === '';
});

wordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !verifyBtn.disabled) verifyBtn.click();
});

verifyBtn.addEventListener('click', verifyWord);

newBtn.addEventListener('click', nextWord);

nextBlocBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  startBloc(currentBlocIdx + 1);
});

changeGraphemeBtn.addEventListener('click', () => {
  recapBox.style.display = 'none';
  goToGrapheme();
});

// ── Démarrage ─────────────────────────────────────────────────────────────────
buildModuleGrid();
goToModule();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

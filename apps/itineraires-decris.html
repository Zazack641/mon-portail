<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Décris le trajet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  /* Couleur de branche : maths rouge PER */
  :root { --app-header-bg: #C0272D; }

  /* ── Grille (identique à itineraires.html) ───────────────────────────────── */
  .grid-wrapper {
    width: min(340px, calc(100vw - 32px));
    background: #7A9FB5;
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 6px 28px rgba(26, 58, 92, 0.20);
    flex-shrink: 0;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 4px;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
  }

  .grid-cell {
    background: #F5F2EA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 4.8vw, 30px);
    transition: background-color 0.18s;
    user-select: none;
    position: relative;
  }

  .grid-cell.start       { background: #BFDBFE; }
  .grid-cell.path-cell   { background: #DBEAFE; }
  .grid-cell.destination { background: #FEF9C3; }

  .grid-cell.cell-arrived {
    background: #BBF7D0 !important;
    animation: cell-pop 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes cell-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.22); }
    70%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }

  /* ── Séquence (au-dessus de la grille) ──────────────────────────────────── */
  .sequence-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    padding: 12px 16px 14px;
  }

  .sequence-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 8px;
    text-align: center;
  }

  .sequence-list {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 52px;
    align-items: center;
    padding-bottom: 2px;
  }

  .sequence-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #F1F5F9;
    border: 2px solid #E2E8F0;
    border-radius: 10px;
    padding: 4px 10px 6px;
    min-width: 46px;
    flex-shrink: 0;
    gap: 1px;
  }

  .sequence-num {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 900;
    color: #94A3B8;
    line-height: 1;
  }

  .sequence-arrow {
    font-size: 22px;
    line-height: 1;
  }

  .sequence-empty {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    color: #CBD5E0;
    font-style: italic;
    width: 100%;
    text-align: center;
    padding: 6px 0;
  }

  /* ── D-pad ───────────────────────────────────────────────────────────────── */
  .controls-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    padding: 18px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
  }

  .dpad-btn {
    font-size: 28px;
    background: #F1F5F9;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    min-height: 64px;
    min-width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.1s, opacity 0.18s;
  }
  .dpad-btn:hover:not(:disabled)  { background: #E2E8F0; }
  .dpad-btn:active:not(:disabled) { background: #CBD5E0; transform: scale(0.92); }
  .dpad-btn:disabled { opacity: 0.25; cursor: default; }

  .dpad-center {
    grid-column: 2; grid-row: 2;
    background: #BFDBFE;
    border-color: #93C5FD;
    pointer-events: none;
    font-size: 26px;
  }

  #btn-up    { grid-column: 2; grid-row: 1; }
  #btn-left  { grid-column: 1; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #btn-down  { grid-column: 2; grid-row: 3; }

  .controls-secondary {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 12px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #475569;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    min-height: 48px;
    transition: background 0.12s, opacity 0.15s;
  }
  .ctrl-btn:hover:not(:disabled)  { background: #EEF2F7; }
  .ctrl-btn:active:not(:disabled) { background: #E2E8F0; }
  .ctrl-btn:disabled { opacity: 0.35; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>🗺️ Décris le trajet</h1>
  <div class="header-spacer"></div>
</header>

<!-- ── Sélecteur de niveau ─────────────────────────────────────────────────── -->
<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1</button>
  <button class="level-btn"        data-level="2" aria-pressed="false">Niveau 2</button>
  <button class="level-btn"        data-level="3" aria-pressed="false">Niveau 3</button>
</div>

<!-- ── Contenu principal ───────────────────────────────────────────────────── -->
<main>
  <div class="question-box" id="question-box">Chargement…</div>

  <!-- Séquence construite par l'élève -->
  <div class="sequence-box" aria-label="Séquence d'instructions">
    <div class="sequence-title">Ma séquence</div>
    <div class="sequence-list" id="sequence-list" role="list"></div>
  </div>

  <!-- Grille -->
  <div class="grid-wrapper" aria-label="Plan de déplacement">
    <div class="grid-container" id="grid" role="grid"></div>
  </div>

  <!-- Contrôles directionnels -->
  <div class="controls-box" aria-label="Boutons de déplacement">
    <div class="dpad" role="group" aria-label="Directions">
      <button class="dpad-btn" id="btn-up"    aria-label="Déplacer vers le haut">⬆️</button>
      <button class="dpad-btn" id="btn-left"  aria-label="Déplacer vers la gauche">⬅️</button>
      <div    class="dpad-btn dpad-center"    aria-hidden="true">🧒</div>
      <button class="dpad-btn" id="btn-right" aria-label="Déplacer vers la droite">➡️</button>
      <button class="dpad-btn" id="btn-down"  aria-label="Déplacer vers le bas">⬇️</button>
    </div>
    <div class="controls-secondary">
      <button class="ctrl-btn" id="effacer-btn"     aria-label="Effacer la dernière instruction">⬅️ Effacer</button>
      <button class="ctrl-btn" id="recommencer-btn" aria-label="Recommencer depuis le début">🔄 Recommencer</button>
    </div>
  </div>

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <button class="new-btn" id="new-btn">Nouvel exercice</button>
  </div>
</main>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="appUtils.js"></script>
<script>
  // ── DOM ──────────────────────────────────────────────────────────────────────
  const questionBox    = document.getElementById('question-box');
  const feedbackEl     = document.getElementById('feedback');
  const newBtn         = document.getElementById('new-btn');
  const gridEl         = document.getElementById('grid');
  const sequenceList   = document.getElementById('sequence-list');
  const effacerBtn     = document.getElementById('effacer-btn');
  const recommencerBtn = document.getElementById('recommencer-btn');
  const btnUp          = document.getElementById('btn-up');
  const btnDown        = document.getElementById('btn-down');
  const btnLeft        = document.getElementById('btn-left');
  const btnRight       = document.getElementById('btn-right');

  // ── Constantes ───────────────────────────────────────────────────────────────
  const GRID   = 5;
  const EMOJIS = ['🏫', '🌳', '🥐', '🏠', '🏥', '🏪'];
  const NAMES  = {
    '🏫': "l'école",
    '🌳': "l'arbre",
    '🥐': "la boulangerie",
    '🏠': "la maison",
    '🏥': "l'hôpital",
    '🏪': "la boutique",
  };

  // ── État ─────────────────────────────────────────────────────────────────────
  let currentLevel = 1;
  let state = {};

  // ── Utilitaires ───────────────────────────────────────────────────────────────
  function inGrid(r, c) { return r >= 0 && r < GRID && c >= 0 && c < GRID; }
  function key(r, c)    { return r * GRID + c; }
  function mdist(a, b)  { return Math.abs(a.row - b.row) + Math.abs(a.col - b.col); }

  // ── Feedback ──────────────────────────────────────────────────────────────────
  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { newBtn.classList.add('visible'); playCorrect(); launchConfetti(); }
    else { playIncorrect(); }
  }

  function resetFeedback() {
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    newBtn.classList.remove('visible');
  }

  // ── Sélecteur de niveau ───────────────────────────────────────────────────────
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);

  // ── Génération d'exercice ─────────────────────────────────────────────────────
  function choosePositions(level) {
    const allCells = [];
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++)
        allCells.push({ row: r, col: c });

    let startPos;
    if (level === 1)      startPos = { row: 0, col: 0 };
    else if (level === 2) startPos = pick([{row:0,col:0},{row:0,col:4},{row:4,col:0},{row:4,col:4}], 1)[0];
    else                  startPos = pick(allCells, 1)[0];

    const [minD, maxD] = level === 1 ? [2, 3] : level === 2 ? [3, 4] : [4, 6];

    let pool = allCells.filter(p => {
      const d = mdist(p, startPos);
      return d >= minD && d <= maxD;
    });

    // Fallbacks progressifs si la grille est trop petite pour le range demandé
    if (!pool.length) pool = allCells.filter(p => mdist(p, startPos) >= 2);
    if (!pool.length) pool = allCells.filter(p => mdist(p, startPos) >= 1);

    const endPos = pick(pool, 1)[0];
    return { startPos, endPos };
  }

  function generateExercise(level) {
    const { startPos, endPos } = choosePositions(level);
    return {
      startPos,
      endPos,
      destEmoji:  pick(EMOJIS, 1)[0],
      currentPos: { ...startPos },
      path:       [{ ...startPos }],
      sequence:   [],
      answered:   false,
    };
  }

  // ── Rendu ─────────────────────────────────────────────────────────────────────
  function renderGrid() {
    gridEl.innerHTML = '';
    const pathSet = new Set(state.path.map(p => key(p.row, p.col)));

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.setAttribute('role', 'gridcell');

        const isStart   = r === state.startPos.row  && c === state.startPos.col;
        const isDest    = r === state.endPos.row     && c === state.endPos.col;
        const isCurrent = r === state.currentPos.row && c === state.currentPos.col;
        const inPath    = pathSet.has(key(r, c));

        if (state.answered && isDest) {
          cell.classList.add('cell-arrived');
          cell.textContent = '🧒';
          cell.setAttribute('aria-label', 'Arrivée !');
        } else if (isCurrent) {
          cell.classList.add(isStart ? 'start' : 'path-cell');
          cell.textContent = '🧒';
          cell.setAttribute('aria-label', 'Position de 🧒');
        } else if (isDest) {
          cell.classList.add('destination');
          cell.textContent = state.destEmoji;
          cell.setAttribute('aria-label', `Arrivée : ${NAMES[state.destEmoji]}`);
        } else if (isStart) {
          cell.classList.add('start');
          cell.setAttribute('aria-label', 'Départ');
        } else if (inPath) {
          cell.classList.add('path-cell');
        }

        gridEl.appendChild(cell);
      }
    }
  }

  function renderSequence() {
    sequenceList.innerHTML = '';

    if (!state.sequence.length) {
      const empty = document.createElement('span');
      empty.className = 'sequence-empty';
      empty.textContent = 'Appuie sur les flèches pour démarrer';
      sequenceList.appendChild(empty);
      return;
    }

    state.sequence.forEach((arrow, i) => {
      const step = document.createElement('div');
      step.className = 'sequence-step';
      step.setAttribute('role', 'listitem');
      step.setAttribute('aria-label', `Étape ${i + 1} : ${arrow}`);

      const num = document.createElement('span');
      num.className = 'sequence-num';
      num.setAttribute('aria-hidden', 'true');
      num.textContent = i + 1;

      const arrowEl = document.createElement('span');
      arrowEl.className = 'sequence-arrow';
      arrowEl.setAttribute('aria-hidden', 'true');
      arrowEl.textContent = arrow;

      step.appendChild(num);
      step.appendChild(arrowEl);
      sequenceList.appendChild(step);
    });

    // Scroll au dernier élément ajouté
    sequenceList.scrollLeft = sequenceList.scrollWidth;
  }

  function updateButtons() {
    const done = state.answered;
    btnUp.disabled    = done || !inGrid(state.currentPos.row - 1, state.currentPos.col);
    btnDown.disabled  = done || !inGrid(state.currentPos.row + 1, state.currentPos.col);
    btnLeft.disabled  = done || !inGrid(state.currentPos.row, state.currentPos.col - 1);
    btnRight.disabled = done || !inGrid(state.currentPos.row, state.currentPos.col + 1);
    effacerBtn.disabled     = done || state.sequence.length === 0;
    recommencerBtn.disabled = done;
  }

  // ── Déplacement ───────────────────────────────────────────────────────────────
  function move(dr, dc, arrow) {
    if (state.answered) return;
    const nr = state.currentPos.row + dr;
    const nc = state.currentPos.col + dc;
    if (!inGrid(nr, nc)) return;

    state.currentPos = { row: nr, col: nc };
    state.path.push({ ...state.currentPos });
    state.sequence.push(arrow);

    const arrived = nr === state.endPos.row && nc === state.endPos.col;
    if (arrived) state.answered = true;

    renderGrid();
    renderSequence();
    updateButtons();

    if (arrived) {
      const n = state.sequence.length;
      showFeedback(true,
        `Bravo ! Tu as décrit le chemin en ${n} déplacement${n > 1 ? 's' : ''} ! 🎉`
      );
    }
  }

  // ── Boutons ───────────────────────────────────────────────────────────────────
  btnUp.addEventListener('click',    () => move(-1,  0, '⬆️'));
  btnDown.addEventListener('click',  () => move( 1,  0, '⬇️'));
  btnLeft.addEventListener('click',  () => move( 0, -1, '⬅️'));
  btnRight.addEventListener('click', () => move( 0,  1, '➡️'));

  effacerBtn.addEventListener('click', () => {
    if (state.answered || !state.sequence.length) return;
    state.path.pop();
    state.sequence.pop();
    state.currentPos = { ...state.path[state.path.length - 1] };
    renderGrid();
    renderSequence();
    updateButtons();
  });

  recommencerBtn.addEventListener('click', () => {
    if (state.answered) return;
    state.currentPos = { ...state.startPos };
    state.path       = [{ ...state.startPos }];
    state.sequence   = [];
    resetFeedback();
    renderGrid();
    renderSequence();
    updateButtons();
  });

  // Support clavier (flèches + Backspace)
  document.addEventListener('keydown', e => {
    if (state.answered) return;
    if (e.key === 'ArrowUp')    { e.preventDefault(); move(-1,  0, '⬆️'); }
    if (e.key === 'ArrowDown')  { e.preventDefault(); move( 1,  0, '⬇️'); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); move( 0, -1, '⬅️'); }
    if (e.key === 'ArrowRight') { e.preventDefault(); move( 0,  1, '➡️'); }
    if (e.key === 'Backspace')  { e.preventDefault(); effacerBtn.click(); }
  });

  // ── Nouvel exercice ───────────────────────────────────────────────────────────
  function newExercise() {
    resetFeedback();
    state = generateExercise(currentLevel);
    renderGrid();
    renderSequence();
    updateButtons();
    questionBox.textContent =
      `Guide 🧒 jusqu'à ${NAMES[state.destEmoji]} ${state.destEmoji} !`;
  }

  // ── Démarrage ─────────────────────────────────────────────────────────────────
  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

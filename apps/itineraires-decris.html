<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Décris le trajet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  /* Couleur de branche : maths rouge PER */
  :root { --app-header-bg: #C0272D; }

  /* ── Grille (identique à itineraires.html) ───────────────────────────────── */
  .grid-wrapper {
    width: min(340px, calc(100vw - 32px));
    background: #7A9FB5;
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 6px 28px rgba(26, 58, 92, 0.20);
    flex-shrink: 0;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 4px;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
  }

  .grid-cell {
    background: #F5F2EA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 4.8vw, 30px);
    transition: background-color 0.18s;
    user-select: none;
    position: relative;
  }

  .grid-cell.start       { background: #BFDBFE; }
  .grid-cell.path-cell   { background: #DBEAFE; }
  .grid-cell.destination { background: #FEF9C3; }

  .grid-cell.cell-arrived {
    background: #BBF7D0 !important;
    animation: cell-pop 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes cell-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.22); }
    70%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }

  /* ── Séquence (au-dessus de la grille) ──────────────────────────────────── */
  .sequence-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    padding: 12px 16px 14px;
  }

  .sequence-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 8px;
    text-align: center;
  }

  .sequence-list {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 52px;
    align-items: center;
    padding-bottom: 2px;
  }

  .sequence-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #F1F5F9;
    border: 2px solid #E2E8F0;
    border-radius: 10px;
    padding: 4px 10px 6px;
    min-width: 46px;
    flex-shrink: 0;
    gap: 1px;
  }

  .sequence-num {
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 900;
    color: #475569;
    line-height: 1;
  }

  .sequence-arrow {
    font-size: 22px;
    line-height: 1;
  }

  .sequence-error-icon {
    font-size: 14px;
    line-height: 1;
  }

  .sequence-empty {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    color: #475569;
    font-style: italic;
    width: 100%;
    text-align: center;
    padding: 6px 0;
  }

  /* ── D-pad ───────────────────────────────────────────────────────────────── */
  .controls-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    padding: 18px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 12px;
  }

  .dpad-btn {
    font-size: 28px;
    background: #F1F5F9;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    min-height: 64px;
    min-width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.1s, opacity 0.18s;
  }
  .dpad-btn:hover:not(:disabled)  { background: #E2E8F0; }
  .dpad-btn:active:not(:disabled) { background: #CBD5E0; transform: scale(0.92); }
  .dpad-btn:disabled { opacity: 0.25; cursor: default; }

  /* Verrouillage pendant l'animation de vérification (voir updateButtons()) : app-base.css ne
     déclare pas d'état :disabled pour .level-btn, on l'ajoute ici sans y toucher. */
  .level-btn:disabled { opacity: 0.45; cursor: default; }

  .dpad-center {
    grid-column: 2; grid-row: 2;
    background: #BFDBFE;
    border-color: #93C5FD;
    pointer-events: none;
    font-size: 26px;
  }

  #btn-up    { grid-column: 2; grid-row: 1; }
  #btn-left  { grid-column: 1; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #btn-down  { grid-column: 2; grid-row: 3; }

  .controls-secondary {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 12px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    color: #475569;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    min-height: 64px;
    min-width: 64px;
    transition: background 0.12s, opacity 0.15s;
  }
  .ctrl-btn:hover:not(:disabled)  { background: #EEF2F7; }
  .ctrl-btn:active:not(:disabled) { background: #E2E8F0; }
  .ctrl-btn:disabled { opacity: 0.35; cursor: default; }
  .grid-cell.obstacle { background: #94A3B8; }

  .sequence-step.error {
    border-color: #E53E3E;
    background: #FEE2E2;
  }

  .ctrl-btn.verify {
    background: #C0272D;
    color: #fff;
    border-color: #A01F24;
  }
  .ctrl-btn.verify:hover:not(:disabled)  { background: #A01F24; }
  .ctrl-btn.verify:active:not(:disabled) { background: #8B1A1E; }
  .ctrl-btn.verify:disabled { background: #F8FAFC; color: #94A3B8; border-color: #E2E8F0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="app-header">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>🗺️ Décris le trajet</h1>
  <div class="header-spacer"></div>
</header>

<!-- ── Sélecteur de niveau ─────────────────────────────────────────────────── -->
<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1</button>
  <button class="level-btn"        data-level="2" aria-pressed="false">Niveau 2</button>
  <button class="level-btn"        data-level="3" aria-pressed="false">Niveau 3</button>
</div>

<!-- ── Contenu principal ───────────────────────────────────────────────────── -->
<main>
  <div class="question-box" id="question-box" tabindex="-1">Chargement…</div>

  <!-- Séquence construite par l'élève -->
  <div class="sequence-box" aria-label="Séquence d'instructions">
    <div class="sequence-title">Ma séquence</div>
    <div class="sequence-list" id="sequence-list" role="list"></div>
  </div>

  <!-- Grille -->
  <div class="grid-wrapper" aria-label="Plan de déplacement">
    <div class="grid-container" id="grid" role="grid"></div>
  </div>

  <!-- Contrôles directionnels -->
  <div class="controls-box" aria-label="Boutons de déplacement">
    <div class="dpad" role="group" aria-label="Directions">
      <button class="dpad-btn" id="btn-up"    aria-label="Déplacer vers le haut">⬆️</button>
      <button class="dpad-btn" id="btn-left"  aria-label="Déplacer vers la gauche">⬅️</button>
      <div    class="dpad-btn dpad-center"    aria-hidden="true">🧒</div>
      <button class="dpad-btn" id="btn-right" aria-label="Déplacer vers la droite">➡️</button>
      <button class="dpad-btn" id="btn-down"  aria-label="Déplacer vers le bas">⬇️</button>
    </div>
    <div class="controls-secondary">
      <button class="ctrl-btn" id="effacer-btn"     aria-label="Effacer la dernière instruction">⬅️ Effacer</button>
      <button class="ctrl-btn" id="recommencer-btn" aria-label="Recommencer depuis le début">🔄 Recommencer</button>
      <button class="ctrl-btn verify" id="verifier-btn" aria-label="Vérifier la séquence">✅ Vérifier</button>
    </div>
  </div>

  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></div>

  <div class="action-row">
    <button class="new-btn" id="new-btn"><span aria-hidden="true">▶</span> Nouvel exercice</button>
  </div>
</main>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="appUtils.js"></script>
<script>
  // ── DOM ──────────────────────────────────────────────────────────────────────
  const questionBox    = document.getElementById('question-box');
  const feedbackEl     = document.getElementById('feedback');
  const newBtn         = document.getElementById('new-btn');
  const gridEl         = document.getElementById('grid');
  const sequenceList   = document.getElementById('sequence-list');
  const effacerBtn     = document.getElementById('effacer-btn');
  const recommencerBtn = document.getElementById('recommencer-btn');
  const verifierBtn    = document.getElementById('verifier-btn');
  const btnUp          = document.getElementById('btn-up');
  const btnDown        = document.getElementById('btn-down');
  const btnLeft        = document.getElementById('btn-left');
  const btnRight       = document.getElementById('btn-right');

  // 'instance' : l'erreur est corrigeable — l'élève corrige sa séquence et revérifie
  // la même instance jusqu'à réussite (retry déjà implémenté via verifySequence()).
  const TYPE_TACHE = 'instance';

  // ── Constantes ───────────────────────────────────────────────────────────────
  const GRID   = 5;
  const EMOJIS = ['🏫', '🌳', '🥐', '🏠', '🏥', '🏪'];
  const NAMES  = {
    '🏫': "l'école",
    '🌳': "l'arbre",
    '🥐': "la boulangerie",
    '🏠': "la maison",
    '🏥': "l'hôpital",
    '🏪': "la boutique",
  };
  const DIRS = { '⬆️': [-1, 0], '⬇️': [1, 0], '⬅️': [0, -1], '➡️': [0, 1] };
  const ARROW_LABEL = { '⬆️': 'haut', '⬇️': 'bas', '⬅️': 'gauche', '➡️': 'droite' };

  function edgeHint(dr, dc) {
    if (dr === -1) return "tu es déjà au bord du haut";
    if (dr ===  1) return "tu es déjà au bord du bas";
    if (dc === -1) return "tu es déjà au bord gauche";
    return "tu es déjà au bord droit";
  }

  function relativeHint(from, to) {
    const dr = to.row - from.row;
    const dc = to.col - from.col;
    const parts = [];
    if (dr > 0) parts.push(`${dr} case${dr > 1 ? 's' : ''} vers le bas`);
    if (dr < 0) parts.push(`${-dr} case${-dr > 1 ? 's' : ''} vers le haut`);
    if (dc > 0) parts.push(`${dc} case${dc > 1 ? 's' : ''} vers la droite`);
    if (dc < 0) parts.push(`${-dc} case${-dc > 1 ? 's' : ''} vers la gauche`);
    return parts.join(' et ');
  }

  // ── État ─────────────────────────────────────────────────────────────────────
  let currentLevel = 1;
  let state = {};

  // ── Utilitaires ───────────────────────────────────────────────────────────────
  function inGrid(r, c) { return r >= 0 && r < GRID && c >= 0 && c < GRID; }
  function key(r, c)    { return r * GRID + c; }
  function mdist(a, b)  { return Math.abs(a.row - b.row) + Math.abs(a.col - b.col); }
  function sleep(ms)    { return new Promise(r => setTimeout(r, ms)); }

  function hasPath(start, end, obstacles) {
    const blocked = new Set(obstacles.map(o => key(o.row, o.col)));
    const visited = new Set([key(start.row, start.col)]);
    const queue   = [{ ...start }];
    while (queue.length) {
      const curr = queue.shift();
      if (curr.row === end.row && curr.col === end.col) return true;
      for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr = curr.row + dr, nc = curr.col + dc;
        if (!inGrid(nr, nc)) continue;
        const k = key(nr, nc);
        if (visited.has(k) || blocked.has(k)) continue;
        visited.add(k);
        queue.push({ row: nr, col: nc });
      }
    }
    return false;
  }

  function bfsPath(start, end, obstacles) {
    const blocked = new Set(obstacles.map(o => key(o.row, o.col)));
    const parent  = new Map([[key(start.row, start.col), null]]);
    const queue   = [start];
    while (queue.length) {
      const curr = queue.shift();
      if (curr.row === end.row && curr.col === end.col) {
        const path = [];
        let k = key(curr.row, curr.col);
        while (k !== null) {
          path.unshift({ row: Math.floor(k / GRID), col: k % GRID });
          k = parent.get(k);
        }
        return path;
      }
      for (const [dr, dc] of shuffle([[-1,0],[1,0],[0,-1],[0,1]])) {
        const nr = curr.row + dr, nc = curr.col + dc;
        if (!inGrid(nr, nc)) continue;
        const k = key(nr, nc);
        if (parent.has(k) || blocked.has(k)) continue;
        parent.set(k, key(curr.row, curr.col));
        queue.push({ row: nr, col: nc });
      }
    }
    return null;
  }

  // ── Feedback ──────────────────────────────────────────────────────────────────
  function showFeedback(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }

    if (correct || TYPE_TACHE === 'drill') {
      newBtn.classList.add('visible');
      newBtn.focus();
    } else {
      feedbackEl.focus();
    }
  }

  function resetFeedback() {
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    newBtn.classList.remove('visible');
  }

  // ── Sélecteur de niveau ───────────────────────────────────────────────────────
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);

  // ── Génération d'exercice ─────────────────────────────────────────────────────
  function choosePositions(level) {
    const allCells = [];
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++)
        allCells.push({ row: r, col: c });

    let startPos;
    if (level === 1)      startPos = { row: 0, col: 0 };
    else if (level === 2) startPos = pick([{row:0,col:0},{row:0,col:4},{row:4,col:0},{row:4,col:4}], 1)[0];
    else                  startPos = pick(allCells, 1)[0];

    const [minD, maxD] = level === 1 ? [2, 3] : level === 2 ? [3, 4] : [4, 6];
    let pool = allCells.filter(p => {
      const d = mdist(p, startPos);
      return d >= minD && d <= maxD;
    });
    if (!pool.length) pool = allCells.filter(p => mdist(p, startPos) >= 2);
    if (!pool.length) pool = allCells.filter(p => mdist(p, startPos) >= 1);

    const endPos = pick(pool, 1)[0];
    return { startPos, endPos };
  }

  function generateObstacles(startPos, endPos) {
    const shortest = bfsPath(startPos, endPos, []);
    if (!shortest || shortest.length <= 2) return [];

    // 2 obstacles sur le chemin direct (force le détour)
    const intermediates = shuffle(shortest.slice(1, -1));
    const obstacles = [];
    for (const candidate of intermediates) {
      if (obstacles.length >= 2) break;
      if (hasPath(startPos, endPos, [...obstacles, candidate])) {
        obstacles.push(candidate);
      }
    }

    // 1 obstacle hors-chemin, en évitant que les 3 soient alignés
    const onPath = new Set(shortest.map(p => key(p.row, p.col)));
    const offPath = [];
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++) {
        const k = key(r, c);
        if (!onPath.has(k) &&
            !(r === startPos.row && c === startPos.col) &&
            !(r === endPos.row   && c === endPos.col))
          offPath.push({ row: r, col: c });
      }
    for (const candidate of shuffle(offPath)) {
      const all = [...obstacles, candidate];
      const aligned = all.every(o => o.row === all[0].row) ||
                      all.every(o => o.col === all[0].col);
      if (aligned) continue;
      if (hasPath(startPos, endPos, all)) {
        obstacles.push(candidate);
        break;
      }
    }

    return obstacles;
  }

  function generateExercise(level) {
    const { startPos, endPos } = choosePositions(level);
    const obstacles = level === 3 ? generateObstacles(startPos, endPos) : [];
    return {
      startPos,
      endPos,
      obstacles,
      destEmoji: pick(EMOJIS, 1)[0],
      sequence:  [],
      animPos:   null,
      animPath:  [],
      answered:  false,
      animating: false,
      errorStep: -1,
    };
  }

  // ── Rendu ─────────────────────────────────────────────────────────────────────
  function renderGrid() {
    gridEl.innerHTML = '';
    const obstacleSet = new Set(state.obstacles.map(o => key(o.row, o.col)));
    const animPathSet = new Set((state.animPath || []).map(p => key(p.row, p.col)));

    const displayPos = state.answered
      ? (state.animPos || state.endPos)
      : (state.animating ? state.animPos : state.startPos);

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.setAttribute('role', 'gridcell');

        const isStart    = r === state.startPos.row && c === state.startPos.col;
        const isDest     = r === state.endPos.row   && c === state.endPos.col;
        const isCurrent  = displayPos && r === displayPos.row && c === displayPos.col;
        const isObstacle = obstacleSet.has(key(r, c));
        const inAnimPath = animPathSet.has(key(r, c));

        if (isObstacle) {
          cell.classList.add('obstacle');
          cell.textContent = '🧱';
          cell.setAttribute('aria-label', 'Obstacle');
        } else if (state.answered && isDest) {
          cell.classList.add('cell-arrived');
          cell.textContent = '🧒';
          cell.setAttribute('aria-label', 'Arrivée !');
        } else if (isCurrent) {
          cell.classList.add(isStart ? 'start' : 'path-cell');
          cell.textContent = '🧒';
          cell.setAttribute('aria-label', 'Position de 🧒');
        } else if (isDest) {
          cell.classList.add('destination');
          cell.textContent = state.destEmoji;
          cell.setAttribute('aria-label', `Arrivée : ${NAMES[state.destEmoji]}`);
        } else if (isStart) {
          cell.classList.add('start');
          cell.setAttribute('aria-label', 'Départ');
        } else if (inAnimPath) {
          cell.classList.add('path-cell');
        }

        gridEl.appendChild(cell);
      }
    }
  }

  function renderSequence() {
    sequenceList.innerHTML = '';

    if (!state.sequence.length) {
      const empty = document.createElement('span');
      empty.className = 'sequence-empty';
      empty.textContent = 'Appuie sur les flèches pour construire ta séquence';
      sequenceList.appendChild(empty);
      return;
    }

    let errorStepEl = null;

    state.sequence.forEach((arrow, i) => {
      const isError = i === state.errorStep;
      const step = document.createElement('div');
      step.className = 'sequence-step' + (isError ? ' error' : '');
      step.setAttribute('role', 'listitem');
      step.setAttribute('aria-label', `Étape ${i + 1} : ${arrow}` + (isError ? ' — erreur, à corriger' : ''));

      const num = document.createElement('span');
      num.className = 'sequence-num';
      num.setAttribute('aria-hidden', 'true');
      num.textContent = i + 1;

      const arrowEl = document.createElement('span');
      arrowEl.className = 'sequence-arrow';
      arrowEl.setAttribute('aria-hidden', 'true');
      arrowEl.textContent = arrow;

      step.appendChild(num);
      step.appendChild(arrowEl);

      if (isError) {
        const errIcon = document.createElement('span');
        errIcon.className = 'sequence-error-icon';
        errIcon.setAttribute('aria-hidden', 'true');
        errIcon.textContent = '⚠️';
        step.appendChild(errIcon);
        errorStepEl = step;
      }

      sequenceList.appendChild(step);
    });

    // La séquence n'est jamais tronquée sur erreur : sans ceci, une erreur détectée avant
    // la fin resterait scrollée hors champ derrière les étapes suivantes (non jouées).
    if (errorStepEl) {
      errorStepEl.scrollIntoView({ block: 'nearest', inline: 'center' });
    } else {
      sequenceList.scrollLeft = sequenceList.scrollWidth;
    }
  }

  function updateButtons() {
    const locked = state.answered || state.animating;
    btnUp.disabled    = locked;
    btnDown.disabled  = locked;
    btnLeft.disabled  = locked;
    btnRight.disabled = locked;
    effacerBtn.disabled     = locked || state.sequence.length === 0;
    recommencerBtn.disabled = locked || state.sequence.length === 0;
    verifierBtn.disabled    = locked || state.sequence.length === 0;
    // La séquence est animée de façon asynchrone (plusieurs `await sleep()`) : changer de
    // niveau pendant l'animation remplacerait `state` sous les pieds de verifySequence().
    document.querySelectorAll('.level-btn').forEach(b => { b.disabled = state.animating; });
  }

  // ── Ajout d'une instruction à la séquence ─────────────────────────────────────
  function addToSequence(arrow) {
    if (state.answered || state.animating) return;
    state.sequence.push(arrow);
    state.errorStep = -1;
    resetFeedback();
    renderSequence();
    updateButtons();
  }

  // ── Boutons directionnels ──────────────────────────────────────────────────────
  btnUp.addEventListener('click',    () => addToSequence('⬆️'));
  btnDown.addEventListener('click',  () => addToSequence('⬇️'));
  btnLeft.addEventListener('click',  () => addToSequence('⬅️'));
  btnRight.addEventListener('click', () => addToSequence('➡️'));

  effacerBtn.addEventListener('click', () => {
    if (state.answered || state.animating || !state.sequence.length) return;
    state.sequence.pop();
    state.errorStep = -1;
    resetFeedback();
    renderSequence();
    updateButtons();
  });

  recommencerBtn.addEventListener('click', () => {
    if (state.answered || state.animating) return;
    state.sequence  = [];
    state.errorStep = -1;
    state.animPath  = [];
    state.animPos   = null;
    resetFeedback();
    renderGrid();
    renderSequence();
    updateButtons();
  });

  document.addEventListener('keydown', e => {
    if (state.answered || state.animating) return;
    if (e.key === 'ArrowUp')    { e.preventDefault(); addToSequence('⬆️'); }
    if (e.key === 'ArrowDown')  { e.preventDefault(); addToSequence('⬇️'); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); addToSequence('⬅️'); }
    if (e.key === 'ArrowRight') { e.preventDefault(); addToSequence('➡️'); }
    if (e.key === 'Backspace')  { e.preventDefault(); effacerBtn.click(); }
    if (e.key === 'Enter')      { e.preventDefault(); verifierBtn.click(); }
  });

  // ── Vérification animée de la séquence ───────────────────────────────────────
  async function verifySequence() {
    if (state.answered || state.animating || !state.sequence.length) return;

    // Capturé avant tout `await` : si `state` est remplacé pendant l'animation (nouvel
    // exercice/changement de niveau), on le détecte après chaque pause et on abandonne
    // cette exécution au lieu de continuer à modifier l'exercice qui l'a remplacée.
    const runState = state;

    state.animating = true;
    state.animPath  = [];
    state.errorStep = -1;
    resetFeedback();
    updateButtons();

    const obstacleSet = new Set(state.obstacles.map(o => key(o.row, o.col)));
    let pos = { ...state.startPos };
    state.animPos  = { ...pos };
    state.animPath = [{ ...pos }];
    renderGrid();
    renderSequence();
    await sleep(300);
    if (state !== runState) return;

    for (let i = 0; i < state.sequence.length; i++) {
      const [dr, dc] = DIRS[state.sequence[i]];
      const nr = pos.row + dr;
      const nc = pos.col + dc;

      if (!inGrid(nr, nc)) {
        state.errorStep = i;
        state.animating = false;
        state.animPos   = null;
        state.animPath  = [];
        renderGrid();
        renderSequence();
        updateButtons();
        showFeedback(false, `Étape ${i + 1} — tu veux aller vers le ${ARROW_LABEL[state.sequence[i]]} mais ${edgeHint(dr, dc)}. Change cette instruction.`);
        return;
      }

      if (obstacleSet.has(key(nr, nc))) {
        state.errorStep = i;
        state.animating = false;
        state.animPos   = null;
        state.animPath  = [];
        renderGrid();
        renderSequence();
        updateButtons();
        showFeedback(false, `Étape ${i + 1} — il y a un mur 🧱 vers le ${ARROW_LABEL[state.sequence[i]]}. Trouve une autre direction pour le contourner.`);
        return;
      }

      pos = { row: nr, col: nc };
      state.animPos = { ...pos };
      state.animPath.push({ ...pos });
      renderGrid();
      await sleep(400);
      if (state !== runState) return;
    }

    state.animating = false;

    if (pos.row === state.endPos.row && pos.col === state.endPos.col) {
      state.answered = true;
      renderGrid();
      updateButtons();
      const n = state.sequence.length;
      showFeedback(true,
        `Bravo ! Tu as trouvé le chemin en ${n} déplacement${n > 1 ? 's' : ''} ! 🎉`
      );
    } else {
      state.animPos  = null;
      state.animPath = [];
      renderGrid();
      updateButtons();
      showFeedback(false,
        `🧒 s'est arrêté, mais n'est pas encore à ${NAMES[state.destEmoji]}. Il lui manque encore : ${relativeHint(pos, state.endPos)}.`
      );
    }
  }

  verifierBtn.addEventListener('click', verifySequence);

  // ── Nouvel exercice ───────────────────────────────────────────────────────────
  function newExercise() {
    resetFeedback();
    state = generateExercise(currentLevel);
    renderGrid();
    renderSequence();
    updateButtons();
    questionBox.textContent =
      `Construis la séquence pour guider 🧒 jusqu'à ${NAMES[state.destEmoji]} ${state.destEmoji} !`;
    questionBox.focus();
  }

  // ── Démarrage ─────────────────────────────────────────────────────────────────
  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>

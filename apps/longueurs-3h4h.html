<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Les longueurs — Comparer des longueurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-base.css">
<style>
  /* Couleur de branche (Mathématiques) — app-base.css s'en sert pour header,
     boutons primaires et niveau actif. */
  :root { --app-header-bg: #C0272D; }

  .canvas-wrap {
    width: 100%;
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    overflow: hidden;
  }
  #length-canvas {
    width: 100%;
    display: block;
    touch-action: none;
    cursor: default;
  }
  #length-canvas.clickable { cursor: pointer; }

  .choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .choice-btn {
    flex: 1;
    min-width: 120px;
    max-width: 200px;
    padding: 16px 12px;
    background: #fff;
    border: 2px solid #E2E8F0;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #1A1A2E;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-appearance: none;
    transition: all 0.15s;
    text-align: center;
  }
  .choice-btn:hover { background: #EEF2F7; border-color: #3B7DD8; }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn:focus-visible { outline: 3px solid var(--app-header-bg); outline-offset: 3px; }
  .choice-btn.correct { background: #D1FAE5; border-color: #10B981; color: #065F46; }
  .choice-btn.wrong   { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
  .choice-btn:disabled { cursor: default; }

  /* Spécifique à cette app (le style visuel des boutons vient d'app-base.css) :
     verify-btn masqué par défaut — n'apparaît qu'au N3 quand les 4 barres sont
     classées — et effet d'enfoncement au tap conservé. */
  .verify-btn { display: none; }
  .verify-btn.visible { display: block; }
  .verify-btn:active, .new-btn:active { transform: scale(0.97); }

  .hint {
    width: 100%;
    text-align: center;
    color: #475569;
    font-size: 18px;
    font-weight: 600;
    margin-top: -12px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <a href="../index.html" class="back-link">← Retour</a>
  <h1>📏 Les longueurs</h1>
  <div class="header-spacer"></div>
</header>

<div class="level-bar" role="group" aria-label="Choisir le niveau">
  <button class="level-btn active" data-level="1" aria-pressed="true">Niveau 1</button>
  <button class="level-btn" data-level="2" aria-pressed="false">Niveau 2</button>
  <button class="level-btn" data-level="3" aria-pressed="false">Niveau 3</button>
</div>

<main>
  <div class="question-box" id="question-box" tabindex="-1">Chargement…</div>

  <div class="canvas-wrap">
    <canvas id="length-canvas" aria-hidden="true"></canvas>
  </div>

  <p class="hint" id="hint" style="display:none"></p>

  <div class="choices" id="choices" role="group"></div>
  <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="action-row">
    <button class="verify-btn" id="verify-btn">Vérifier</button>
    <button class="new-btn" id="new-btn"><span aria-hidden="true">▶</span> Nouvel exercice</button>
  </div>
</main>

<script src="appUtils.js"></script>
<script>
  const canvas = document.getElementById('length-canvas');
  const ctx = canvas.getContext('2d');
  const questionBox = document.getElementById('question-box');
  const choicesDiv = document.getElementById('choices');
  const feedbackEl = document.getElementById('feedback');
  const newBtn = document.getElementById('new-btn');
  const verifyBtn = document.getElementById('verify-btn');
  const hintEl = document.getElementById('hint');

  let currentLevel = 1;
  let state = {};

  // Cette app est mixte (voir skills/pedagogie-per/SKILL.md § « Drill vs instance
  // signifiante ») : N1/N2 = 'drill' (choix parmi 2-3 barres — le retry serait un
  // tâtonnement aveugle). N3 = 'instance' (classement de 4 barres — l'erreur est
  // partiellement exploitable, certaines barres sont déjà bien placées : l'élève
  // corrige et revérifie la MÊME instance jusqu'à réussite, voir verifyL3).
  const TYPE_TACHE = { 1: 'drill', 2: 'drill', 3: 'instance' };

  // Garde-fou : chaque fonction de niveau suppose un type de tâche précis
  // (answerL12 = 'drill', verifyL3 = 'instance'). Cet assert fait réellement
  // consulter TYPE_TACHE par le code — si la table est modifiée un jour sans
  // adapter le comportement correspondant, l'écart est signalé au lieu de
  // rester silencieux.
  function assertTypeTache(level, expected) {
    if (TYPE_TACHE[level] !== expected) {
      console.error(`longueurs-3h4h : TYPE_TACHE[${level}] vaut '${TYPE_TACHE[level]}' mais le code de ce niveau suppose '${expected}'.`);
    }
  }

  const COLORS = ['#3B7DD8', '#D64045', '#3A9E6F', '#F59E0B'];
  const KEYBOARD_HINT_SUFFIX = ' ou utilise les boutons ci-dessous.';

  // ── helpers ──────────────────────────────────────────────────────────────

  // randBetween (flottant, propre à cette app) : NE PAS confondre avec celui
  // d'appUtils.js (entier). Conservé volontairement.
  function randBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function ordinal(n) {
    return n === 1 ? '1er' : n + 'e';
  }

  // shuffle : fourni par appUtils.js (chargé avant ce script). Utilisé ici sur
  // des tableaux jetables, donc la version « copie » d'appUtils est équivalente.

  function pointToSegDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.hypot(px - ax, py - ay);
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function segToSegDist(ax, ay, bx, by, cx, cy, dx, dy) {
    const cross = (ux, uy, vx, vy) => ux * vy - uy * vx;
    const d1 = cross(dx - cx, dy - cy, ax - cx, ay - cy);
    const d2 = cross(dx - cx, dy - cy, bx - cx, by - cy);
    const d3 = cross(bx - ax, by - ay, cx - ax, cy - ay);
    const d4 = cross(bx - ax, by - ay, dx - ax, dy - ay);
    if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
        ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return 0;
    return Math.min(
      pointToSegDist(ax, ay, cx, cy, dx, dy),
      pointToSegDist(bx, by, cx, cy, dx, dy),
      pointToSegDist(cx, cy, ax, ay, bx, by),
      pointToSegDist(dx, dy, ax, ay, bx, by)
    );
  }

  // ── canvas sizing ─────────────────────────────────────────────────────────

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const w = wrap.clientWidth;
    canvas.width = w;
    if (currentLevel === 1) {
      canvas.height = Math.max(160, w * 0.32);
    } else if (currentLevel === 2) {
      canvas.height = Math.max(220, w * 0.55);
    } else {
      canvas.height = Math.max(260, w * 0.60);
    }
    draw();
  }

  // ── NIVEAU 1 : deux barres horizontales, partent toutes du même bord gauche ─

  function setupL1() {
    const isLongest = Math.random() < 0.5;
    const lenA = randBetween(0.22, 0.80);
    let lenB;
    do { lenB = randBetween(0.22, 0.80); } while (Math.abs(lenA - lenB) < 0.10);

    state = {
      level: 1,
      lines: [
        { name: 'A', len: lenA, color: COLORS[0] },
        { name: 'B', len: lenB, color: COLORS[1] },
      ],
      isLongest,
      correctName: isLongest ? (lenA > lenB ? 'A' : 'B') : (lenA < lenB ? 'A' : 'B'),
      answered: false,
    };

    questionBox.textContent = isLongest
      ? 'Quelle barre est la plus longue ?'
      : 'Quelle barre est la plus courte ?';

    resetUI();
    canvas.classList.add('clickable');
    hintEl.textContent = 'Tape directement sur la barre,' + KEYBOARD_HINT_SUFFIX;
    hintEl.style.display = 'block';
    renderChoices();
  }

  function answerL12(name) {
    if (state.answered) return;
    assertTypeTache(currentLevel, 'drill');
    state.answered = true;
    state.chosenName = name;
    canvas.classList.remove('clickable');
    hintEl.style.display = 'none';

    const correct = name === state.correctName;
    closeExercise(correct, correct
      ? '✅ Bravo ! C\'est exact !'
      : `❌ Pas tout à fait. La bonne réponse est la barre ${state.correctName}.`);
  }

  // ── NIVEAU 2 : 3 barres dans des directions et positions variées ──────────

  function tryPlaceBar(lenFrac, W, H, pad, maxBarPx, placedBars = []) {
    const barPx = lenFrac * maxBarPx;
    const MIN_GAP = 22; // min distance between bar centerlines (bar height = 13px → ~9px visual gap)
    for (let attempt = 0; attempt < 300; attempt++) {
      const deg = randBetween(-65, 65);
      const angle = (deg * Math.PI) / 180;
      const ex = Math.cos(angle) * barPx;
      const ey = Math.sin(angle) * barPx;

      const minSx = pad + Math.max(0, -ex);
      const maxSx = W - pad - Math.max(0, ex);
      const minSy = pad + Math.max(0, -ey);
      const maxSy = H - pad - Math.max(0, ey);

      if (maxSx - minSx <= 10 || maxSy - minSy <= 10) continue;

      const sx = randBetween(minSx, maxSx);
      const sy = randBetween(minSy, maxSy);

      let tooClose = false;
      for (const p of placedBars) {
        if (segToSegDist(sx, sy, sx + ex, sy + ey,
                         p.sx, p.sy, p.sx + Math.cos(p.angle) * p.barPx, p.sy + Math.sin(p.angle) * p.barPx) < MIN_GAP) {
          tooClose = true;
          break;
        }
      }
      if (!tooClose) return { sx, sy, angle, barPx };
    }
    return null;
  }

  function setupL2() {
    const isLongest = Math.random() < 0.5;
    const COUNT = 3;
    const fracs = [];
    while (fracs.length < COUNT) {
      const f = randBetween(0.20, 0.85);
      if (fracs.every(g => Math.abs(g - f) >= 0.10)) fracs.push(f);
    }

    const lines = fracs.map((len, i) => ({
      name: ['A', 'B', 'C'][i],
      len,
      color: COLORS[i],
      placement: null,
    }));

    const sorted = [...lines].sort((a, b) => a.len - b.len);
    state = {
      level: 2,
      lines,
      isLongest,
      correctName: isLongest ? sorted[COUNT - 1].name : sorted[0].name,
      answered: false,
    };

    questionBox.textContent = isLongest
      ? 'Quelle barre est la plus longue ?'
      : 'Quelle barre est la plus courte ?';

    resetUI();
    canvas.classList.add('clickable');
    hintEl.textContent = 'Tape directement sur la barre,' + KEYBOARD_HINT_SUFFIX;
    hintEl.style.display = 'block';
    renderChoices();
  }

  // ── NIVEAU 3 : 4 barres à classer dans l'ordre ───────────────────────────

  function setupL3() {
    const sortAsc = Math.random() < 0.5; // true = du plus court au plus long
    const COUNT = 4;
    const fracs = [];
    while (fracs.length < COUNT) {
      const f = randBetween(0.15, 0.85);
      if (fracs.every(g => Math.abs(g - f) >= 0.10)) fracs.push(f);
    }

    const lines = shuffle(fracs.map((len, i) => ({
      name: ['A', 'B', 'C', 'D'][i],
      len,
      color: COLORS[i],
      rank: null, // 1..4 assigned by user taps
    })));

    // Reattribute names based on shuffled order for display
    lines.forEach((l, i) => { l.name = ['A', 'B', 'C', 'D'][i]; l.color = COLORS[i]; });

    state = {
      level: 3,
      lines,
      sortAsc,
      answered: false,
    };

    questionBox.textContent = sortAsc
      ? 'Clique sur les barres dans l\'ordre : de la plus courte à la plus longue.'
      : 'Clique sur les barres dans l\'ordre : de la plus longue à la plus courte.';

    resetUI();
    canvas.classList.add('clickable');
    hintEl.textContent = 'Tape les barres une par une dans le bon ordre,' + KEYBOARD_HINT_SUFFIX;
    hintEl.style.display = 'block';
    renderChoices();
  }

  // Clôture d'un exercice (réponse donnée en drill, ou classement entièrement
  // correct en instance) : feedback, son, affichage de « Nouvel exercice » et
  // focus dessus — partagé par answerL12 et le succès de verifyL3.
  function closeExercise(correct, msg) {
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    feedbackEl.textContent = msg;
    if (correct) { playCorrect(); launchConfetti(); } else { playIncorrect(); }
    newBtn.classList.add('visible');
    renderChoices();
    draw();
    newBtn.focus();
  }

  function verifyL3() {
    assertTypeTache(3, 'instance');
    // Ordre attendu : rang 1 = plus courte si sortAsc, plus longue sinon.
    const sorted = [...state.lines].sort((a, b) =>
      state.sortAsc ? a.len - b.len : b.len - a.len
    );
    const wrongNames = [];
    state.lines.forEach(line => {
      const expectedRank = sorted.findIndex(l => l === line) + 1;
      line.correct = line.rank === expectedRank;
      // Mémorise le rang vérifié : le repère vert/rouge de cette barre ne reste
      // affiché que tant que son rang n'a pas changé depuis (voir lineIsChecked).
      // Sans ça, corriger UNE barre effaçait aussi le repère des barres déjà
      // correctes que l'élève n'avait pas touchées.
      line.rankAtLastCheck = line.rank;
      if (!line.correct) wrongNames.push(line.name);
    });
    state.checked = true;

    if (wrongNames.length === 0) {
      // Classement entièrement correct : l'exercice se clôt.
      state.answered = true;
      canvas.classList.remove('clickable');
      verifyBtn.classList.remove('visible');
      hintEl.style.display = 'none';
      closeExercise(true, '✅ Bravo ! Toutes les barres sont dans le bon ordre !');
    } else {
      // Instance signifiante : l'erreur est partiellement exploitable (certaines
      // barres sont déjà bien placées). On ne révèle pas le rang exact attendu —
      // cela donnerait directement la réponse — l'élève retire les barres citées,
      // les replace, puis revérifie sur le même classement (verify-btn reste actif,
      // contrat design-portail « instance, incorrect »).
      feedbackEl.className = 'feedback wrong';
      feedbackEl.textContent = wrongNames.length === 1
        ? `❌ La barre ${wrongNames[0]} n'est pas à la bonne place. Retire-la, replace-la, puis vérifie à nouveau.`
        : `❌ Les barres ${wrongNames.join(', ')} ne sont pas à la bonne place. Retire-les, replace-les, puis vérifie à nouveau.`;
      playIncorrect();
      renderChoices();
      draw();
      feedbackEl.setAttribute('tabindex', '-1');
      feedbackEl.focus();
    }
  }

  // ── DESSIN ────────────────────────────────────────────────────────────────

  function draw() {
    if (!state.lines) return;
    if (state.level === 1) drawL1();
    else if (state.level === 2) drawL2();
    else drawL3();
  }

  // ── Boutons accessibles (équivalent clavier du tap sur le canvas) ──────────
  // Le canvas seul n'offre aucun moyen clavier de répondre (WCAG 2.1.1, exigence
  // « clavier »). Ces boutons déclenchent exactement les mêmes actions que le tap
  // sur le canvas : answerL12 aux niveaux 1 et 2, toggleRank au niveau 3.
  // Reconstruits à chaque changement d'état réel (pas à chaque redimensionnement —
  // resizeCanvas() ne redessine que le canvas, il n'appelle pas renderChoices) pour
  // rester synchronisés ; le focus est restauré sur le bouton de la même barre
  // après reconstruction, sinon le focus clavier se perdrait à chaque tap (le
  // bouton cliqué est détruit et recréé).
  function renderChoices() {
    const focusedName = choicesDiv.querySelector(':focus')?.dataset.name;
    choicesDiv.innerHTML = '';
    choicesDiv.setAttribute('aria-label', state.level === 3 ? 'Classer les barres' : 'Choisir une barre');

    state.lines.forEach(line => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.dataset.name = line.name;
      btn.disabled = !!state.answered;

      if (state.level === 3) {
        btn.textContent = line.rank !== null ? `Barre ${line.name} — ${ordinal(line.rank)}` : `Barre ${line.name}`;
        btn.setAttribute('aria-label', line.rank !== null
          ? `Barre ${line.name}, position ${ordinal(line.rank)} sur ${state.lines.length}`
          : `Barre ${line.name}, pas encore classée`);
        btn.addEventListener('click', () => toggleRankByName(line.name));
        if (lineIsChecked(line)) btn.classList.add(line.correct ? 'correct' : 'wrong');
      } else {
        btn.textContent = 'Barre ' + line.name;
        btn.addEventListener('click', () => answerL12(line.name));
        if (state.answered && line.name === state.correctName) {
          btn.setAttribute('aria-label', `Barre ${line.name}, bonne réponse`);
          btn.classList.add('correct');
        } else if (state.answered && line.name === state.chosenName) {
          btn.setAttribute('aria-label', `Barre ${line.name}, ta réponse, incorrecte`);
          btn.classList.add('wrong');
        }
      }

      choicesDiv.appendChild(btn);
    });

    if (focusedName) {
      const toFocus = choicesDiv.querySelector(`[data-name="${focusedName}"]`);
      if (toFocus && !toFocus.disabled) toFocus.focus();
    }
  }

  function drawL1() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const lines = state.lines;
    const n = lines.length;
    const padLeft = 52, padRight = 24, padV = 24;
    const availW = W - padLeft - padRight;
    const rowH = (H - padV * 2) / n;

    lines.forEach((line, i) => {
      const y = padV + rowH * i + rowH / 2;
      const barPx = line.len * availW;

      // Label
      ctx.font = `bold 18px 'Nunito', sans-serif`;
      ctx.fillStyle = line.color;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(line.name, padLeft - 10, y);

      let barColor = line.color;
      if (state.answered) {
        barColor = line.name === state.correctName ? '#10B981' : line.color + '55';
      }
      drawBar(padLeft, y, barPx, 0, barColor);

      // Checkmark on correct bar after answer
      if (state.answered && line.name === state.correctName) {
        ctx.font = `bold 16px 'Nunito', sans-serif`;
        ctx.fillStyle = '#10B981';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('✓', padLeft + barPx + 10, y);
      }
      // Cross on chosen-wrong bar
      if (state.answered && state.chosenName === line.name && line.name !== state.correctName) {
        ctx.font = `bold 16px 'Nunito', sans-serif`;
        ctx.fillStyle = '#EF4444';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('✗', padLeft + barPx + 10, y);
      }
    });
  }

  function drawL2() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const pad = 36;
    const maxBarPx = W * 0.70;

    state.lines.forEach((line, i) => {
      if (!line.placement) {
        const placed = state.lines.slice(0, i).map(l => l.placement).filter(Boolean);
        line.placement = tryPlaceBar(line.len, W, H, pad, maxBarPx, placed);
        if (!line.placement) {
          const barPx = line.len * maxBarPx;
          line.placement = { sx: pad, sy: pad + (H - pad * 2) * i / state.lines.length + 20, angle: 0, barPx };
        }
      }
      const { sx, sy, angle, barPx } = line.placement;

      let barColor = line.color;
      if (state.answered) {
        barColor = line.name === state.correctName ? '#10B981' : line.color + '55';
      }
      drawBar(sx, sy, barPx, angle, barColor);

      // Label near start of bar
      const labelOff = 14;
      ctx.font = `bold 17px 'Nunito', sans-serif`;
      ctx.fillStyle = state.answered
        ? (line.name === state.correctName ? '#10B981' : line.color + '99')
        : line.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(line.name, sx, sy - labelOff);

      // Marker at end of correct bar after answer
      if (state.answered && line.name === state.correctName) {
        const ex = sx + Math.cos(angle) * barPx;
        const ey = sy + Math.sin(angle) * barPx;
        ctx.font = `bold 18px 'Nunito', sans-serif`;
        ctx.fillStyle = '#10B981';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✓', ex + Math.cos(angle) * 18, ey + Math.sin(angle) * 18);
      }
      // Marker on the chosen-wrong bar (ne pas communiquer par la couleur seule,
      // cohérent avec drawL1 qui marque déjà le choix erroné d'une croix).
      if (state.answered && state.chosenName === line.name && line.name !== state.correctName) {
        const ex = sx + Math.cos(angle) * barPx;
        const ey = sy + Math.sin(angle) * barPx;
        ctx.font = `bold 18px 'Nunito', sans-serif`;
        ctx.fillStyle = '#EF4444';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✗', ex + Math.cos(angle) * 18, ey + Math.sin(angle) * 18);
      }
    });
  }

  function drawL3() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const lines = state.lines;
    const n = lines.length;
    const padLeft = 52, padRight = 24, padV = 20;
    const availW = W - padLeft - padRight;
    const rowH = (H - padV * 2) / n;

    lines.forEach((line, i) => {
      const y = padV + rowH * i + rowH / 2;
      const barPx = line.len * availW;

      // Label
      ctx.font = `bold 18px 'Nunito', sans-serif`;
      ctx.fillStyle = line.color;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(line.name, padLeft - 10, y);

      // Couleur de la barre : neutre tant que non vérifiée ou si son rang a
      // changé depuis la dernière vérification, vert/rouge sinon (voir
      // lineIsChecked — state.answered ne se fixe qu'à la réussite complète et
      // verrouille l'exercice, voir verifyL3).
      let barColor = line.color;
      if (lineIsChecked(line)) {
        barColor = line.correct ? '#10B981' : '#EF4444';
      }

      drawBar(padLeft, y, barPx, 0, barColor);

      // Rank badge
      if (line.rank !== null) {
        const badgeR = 14;
        const bx = padLeft - 36;
        const by = y;
        ctx.beginPath();
        ctx.arc(bx, by, badgeR, 0, Math.PI * 2);
        ctx.fillStyle = lineIsChecked(line)
          ? (line.correct ? '#10B981' : '#EF4444')
          : '#1A3A5C';
        ctx.fill();
        ctx.font = `bold 15px 'Nunito', sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(line.rank), bx, by);
      }
    });
  }

  // ── Dessin d'une barre ────────────────────────────────────────────────────

  function drawBar(sx, sy, barPx, angle, color) {
    const BAR_H = 13;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    ctx.fillStyle = color;
    ctx.beginPath();
    // Fallback for iOS < 15.4 without roundRect
    if (ctx.roundRect) {
      ctx.roundRect(0, -BAR_H / 2, barPx, BAR_H, BAR_H / 2);
    } else {
      const r = BAR_H / 2;
      ctx.moveTo(r, -r);
      ctx.lineTo(barPx - r, -r);
      ctx.arcTo(barPx, -r, barPx, 0, r);
      ctx.arcTo(barPx, r, barPx - r, r, r);
      ctx.lineTo(r, r);
      ctx.arcTo(0, r, 0, 0, r);
      ctx.arcTo(0, -r, r, -r, r);
    }
    ctx.fill();

    // End dots
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(barPx, 0, 5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // ── resetUI ───────────────────────────────────────────────────────────────

  function resetUI() {
    feedbackEl.className = 'feedback';
    feedbackEl.removeAttribute('tabindex');
    newBtn.classList.remove('visible');
    verifyBtn.classList.remove('visible');
    canvas.classList.remove('clickable');
  }

  // ── Hit testing ───────────────────────────────────────────────────────────

  // L1: bars are in horizontal rows — detect by y coordinate
  function hitTestL1(cx, cy) {
    const W = canvas.width, H = canvas.height;
    const n = state.lines.length;
    const padLeft = 52, padV = 24;
    const rowH = (H - padV * 2) / n;
    const idx = Math.floor((cy - padV) / rowH);
    if (idx < 0 || idx >= n) return null;
    return state.lines[idx].name;
  }

  // L2: hit test on rotated bar — transform click into bar's local space
  function hitTestL2(cx, cy) {
    const TOL = 28; // px tolerance around bar
    for (const line of state.lines) {
      if (!line.placement) continue;
      const { sx, sy, angle, barPx } = line.placement;
      // Translate + rotate into bar local space
      const dx = cx - sx, dy = cy - sy;
      const lx =  dx * Math.cos(-angle) - dy * Math.sin(-angle);
      const ly =  dx * Math.sin(-angle) + dy * Math.cos(-angle);
      if (lx >= -TOL && lx <= barPx + TOL && ly >= -TOL && ly <= TOL) {
        return line.name;
      }
    }
    return null;
  }

  // ── Unified canvas click handler ──────────────────────────────────────────

  function handleCanvasClick(e) {
    if (state.answered) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (e.clientX - rect.left)  * scaleX;
    const cy = (e.clientY - rect.top)   * scaleY;

    if (state.level === 1) {
      const name = hitTestL1(cx, cy);
      if (name) answerL12(name);
    } else if (state.level === 2) {
      const name = hitTestL2(cx, cy);
      if (name) answerL12(name);
    } else if (state.level === 3) {
      handleL3Click(cx, cy);
    }
  }

  // Une barre reste « repère vert/rouge » tant que son rang n'a pas changé
  // depuis la dernière vérification — voir le commentaire dans verifyL3.
  function lineIsChecked(line) {
    return state.checked && line.rank !== null && line.rank === line.rankAtLastCheck;
  }

  // Bascule le rang d'une barre (retire son rang si elle est déjà classée,
  // sinon lui attribue le rang libre le plus bas). Partagée par le tap sur le
  // canvas et par les boutons accessibles au clavier (renderChoices) — un seul
  // point de vérité, nécessaire pour corriger le classement après une
  // vérification incorrecte (voir verifyL3, TYPE_TACHE[3] === 'instance').
  //
  // Ne décale JAMAIS le rang des autres barres : au retrait, la barre libère
  // simplement son rang (un « trou »), sans toucher aux autres. Une version
  // précédente décalait les rangs suivants d'un cran — pratique pour annuler
  // le dernier tap pendant la construction du classement, mais ça déplaçait
  // silencieusement le rang de barres que l'élève n'avait pas touchées quand
  // ça servait à corriger UNE barre au milieu d'un classement déjà complet
  // (y compris des barres déjà correctes). Le prochain tap comble le rang
  // libre le plus bas, ce qui reproduit un classement identique si l'élève ne
  // retape que les barres visées, dans le même ordre — sans jamais perturber
  // une barre qu'il n'a pas touchée.
  function toggleRank(line) {
    if (line.rank !== null) {
      line.rank = null;
    } else {
      const used = new Set(state.lines.map(l => l.rank).filter(r => r !== null));
      let rank = 1;
      while (used.has(rank)) rank++;
      line.rank = rank;
    }
    verifyBtn.classList.toggle('visible', state.lines.every(l => l.rank !== null));
    renderChoices();
    draw();
  }

  function toggleRankByName(name) {
    if (state.answered) return;
    const line = state.lines.find(l => l.name === name);
    if (line) toggleRank(line);
  }

  function handleL3Click(cx, cy) {
    if (state.answered) return;
    const W = canvas.width, H = canvas.height;
    const n = state.lines.length;
    const padV = 20;
    const rowH = (H - padV * 2) / n;
    const idx = Math.floor((cy - padV) / rowH);
    if (idx < 0 || idx >= n) return;

    toggleRank(state.lines[idx]);
  }

  // ── Events ────────────────────────────────────────────────────────────────

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = parseInt(btn.dataset.level);
      document.querySelectorAll('.level-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      newExercise();
    });
  });

  newBtn.addEventListener('click', newExercise);
  verifyBtn.addEventListener('click', verifyL3);

  canvas.addEventListener('click', e => handleCanvasClick(e));
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    handleCanvasClick(e.changedTouches[0]);
  }, { passive: false });

  function newExercise() {
    if (currentLevel === 1) setupL1();
    else if (currentLevel === 2) setupL2();
    else setupL3();
    resizeCanvas();
    questionBox.focus();
  }

  window.addEventListener('resize', resizeCanvas);
  newExercise();
</script>
<script src="feedbackUtils.js"></script>
</body>
</html>
